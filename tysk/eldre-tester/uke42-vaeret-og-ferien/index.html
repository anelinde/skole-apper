<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tysk-trening</title>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --ink:#1f1b3a; --muted:#6b6790; --line:#e4e0f5; --chip:#efeafe;
  --brand:#6c4cf1; --brand-ink:#ffffff; --accent:#ff8a3d;
  --ok:#14874a; --okbg:#e3f6ea; --bad:#c93a3a; --badbg:#fde9e9;
  --shadow:0 2px 0 rgba(31,27,58,.08), 0 8px 24px rgba(31,27,58,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14122a; --card:#1f1c3b; --ink:#f1efff; --muted:#a8a3cc; --line:#34305a; --chip:#2c2852;
    --brand:#8f74ff; --brand-ink:#ffffff; --accent:#ff9b57;
    --ok:#46d68a; --okbg:#173a28; --bad:#ff7070; --badbg:#3d1d24;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:16px 16px 140px}
h1,h2,h3{line-height:1.2;margin:0}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row.end{justify-content:flex-end}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--chip);color:var(--ink);min-height:48px}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none}

/* Topp */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:22px}
.hero{display:grid;gap:10px}
.lvl{display:flex;align-items:baseline;gap:10px}
.lvlnum{font-size:28px;font-weight:800}
.rank{font-weight:700;color:var(--brand)}
.bar{height:14px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px;transition:width .5s}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:600}
.pill.hot{background:var(--accent);color:#fff}

/* Temakort */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.topic{display:grid;gap:6px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.topic:not(:disabled):hover{border-color:var(--brand)}
.topic .em{font-size:30px}
.topic b{font-size:18px}
.topic small{color:var(--muted);font-size:14px}
.topic .bar{height:8px;margin-top:4px}
.topic:disabled{opacity:.55;cursor:default;box-shadow:none}

.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.medal{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.medal .e{font-size:26px}
.medal.locked{opacity:.4;filter:grayscale(1)}
.medal b{display:block;font-size:14px}
footer{margin-top:32px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* Økt */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sbar .bar{flex:1}
.combo{font-weight:800;min-width:56px;text-align:right}
.combo.on{color:var(--accent)}
.task{min-height:300px}
.q-label{color:var(--muted);font-weight:600;font-size:15px;margin-bottom:8px}
.q-big{font-size:28px;font-weight:800;margin:6px 0 18px}
.q-sent{font-size:24px;font-weight:700;margin:8px 0 6px;line-height:1.8}
.q-no{color:var(--muted);margin-bottom:6px}
.emoji-big{font-size:96px;text-align:center;line-height:1.1;margin:4px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;min-height:54px}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
input.answer{width:100%;font:inherit;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.answer:focus{outline:none;border-color:var(--brand)}
input.answer.inline{width:7.5ch;display:inline-block;padding:4px 8px;font-size:22px;font-weight:700;text-align:center;vertical-align:baseline}
input.answer.right{border-color:var(--ok);background:var(--okbg)}
input.answer.wrong{border-color:var(--bad);background:var(--badbg)}
.hintbox{margin-top:12px;color:var(--muted);font-size:18px}
.hintbox:empty{display:none}
.mini{border-collapse:collapse;margin-top:6px}
.mini td{padding:3px 12px 3px 0}
.mini td:last-child{font-weight:700;color:var(--ink)}

/* Tabell */
.ctable{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;margin-top:8px}
.ctable label{font-weight:700;font-size:20px}
.ctable .fix{color:var(--ok);font-weight:700}

/* Ordstilling */
.slots{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.slots.right{border-color:var(--ok);background:var(--okbg);border-style:solid}
.slots.wrong{border-color:var(--bad);background:var(--badbg);border-style:solid}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;font-size:19px;min-height:48px}
.tok:hover{border-color:var(--brand)}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mbtn{padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;min-height:56px;font-size:16px}
.mbtn.sel{border-color:var(--brand);background:var(--chip)}
.mbtn.done{border-color:var(--ok);background:var(--okbg);opacity:.6;cursor:default}
.mbtn.flash{border-color:var(--bad);background:var(--badbg);animation:shake .35s}

/* Lesetekst */
.text{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:19px;line-height:1.6;margin:10px 0}
details{margin:6px 0 12px;color:var(--muted)}
summary{cursor:pointer;font-weight:600}
.qcount{font-weight:700;color:var(--brand);margin:10px 0 6px}
.qtext{font-weight:700;font-size:19px;margin-bottom:10px}

/* Tilbakemelding */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px;border-top:3px solid;display:flex;justify-content:center;animation:up .2s ease-out;z-index:5}
.fb .in{max-width:720px;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb .msg{flex:1;min-width:220px}
.fb .title{font-size:21px;font-weight:800}
.fb.ok .title{color:var(--ok)}
.fb.bad .title{color:var(--bad)}
.fb .xp{font-weight:800;color:var(--accent);margin-left:6px}

/* Slutt */
.end{text-align:center;display:grid;gap:10px;justify-items:center}
.end .big{font-size:72px}
.end .stat{font-size:20px;font-weight:700}
.newmedal{background:var(--chip);border-radius:14px;padding:10px 14px;font-weight:700}

/* Utfordring */
.chal-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:22px;margin-bottom:12px;gap:12px}
.timer{font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}

/* Skriving */
textarea{width:100%;min-height:220px;font:inherit;font-size:19px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--brand)}
.checks{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks li.done{color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chipb{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:600}
.diff{margin-top:6px;font-size:18px;line-height:1.6}
.d-add{background:var(--okbg);color:var(--ok);text-decoration:underline;font-weight:800}
.d-del{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.fb.near{background:#fff4e5;border-color:var(--accent)}
.fb.near .title{color:#b45309}
@media (prefers-color-scheme: dark){.fb.near{background:#3a2a14}.fb.near .title{color:var(--accent)}}
.spell{margin-top:14px}
.spell .marked{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.8;white-space:pre-wrap}
.spell mark{background:var(--badbg);color:inherit;border-bottom:3px solid var(--bad);border-radius:3px;padding:0 2px}
.spell ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.spell li{background:var(--bg);border-radius:12px;padding:10px 12px}
.sugg{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:10px;padding:4px 10px;font-weight:800;margin:4px 6px 0 0}
.example{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:8px}

/* Konfetti */
.conf{position:fixed;top:55vh;font-size:28px;pointer-events:none;z-index:10;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-50vh) scale(1.2) rotate(var(--r));opacity:0}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){
  .q-big{font-size:24px}
  .q-sent{font-size:21px}
  .emoji-big{font-size:80px}
  .mbtn{font-size:15px;padding:10px 8px}
}
</style>
</head>

// Repetisjon: høy vekt = kommer oftere. Nye ord starter på 3.
function st(id){ return S.stats[id] || {w: BOOK.has(id) || id.startsWith('conj-') ? 4 : 2, s:0, n:0}; }
function record(id, ok){
  const x = st(id); x.n++;
  if(ok){ x.s++; x.w = Math.max(1, x.w-1); } else { x.s = 0; x.w = Math.min(9, x.w+3); }
  S.stats[id] = x;
}
function weightedPick(arr, n){
  const a = arr.slice(), out = [];
  while(out.length < n && a.length){
    const tot = a.reduce((s,x)=>s+st(x.id).w, 0);
    let r = Math.random()*tot, i = 0;
    for(; i < a.length-1; i++){ r -= st(a[i].id).w; if(r <= 0) break; }
    out.push(a.splice(i,1)[0]);
  }
  return out;
}

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random()*a.length)];

function norm(s){ return String(s).toLowerCase().replace(/[.,!?;:"«»()¿¡]/g,'').replace(/\s+/g,' ').trim(); }
function loose(s){ return norm(s).replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')
  .replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u'); }
function alts(de){ return [de, ...de.split(' / ')]; }
// Som norm, men beholder store og små bokstaver (unntatt første bokstav i svaret)
function normC(s){ s = String(s).replace(/[.,!?;:"«»()¿¡]/g,'').replace(/\s+/g,' ').trim(); return s.charAt(0).toLowerCase() + s.slice(1); }
// Svarer 'exact', 'case' (bare feil stor/liten bokstav), 'close' (omlyd/ß) eller false
function checkAns(input, answers){
  if(!norm(input)) return false;
  if(answers.some(x => normC(x) === normC(input))) return 'exact';
  if(answers.some(x => norm(x) === norm(input))) return 'case';
  if(answers.some(x => loose(x) === loose(input))) return 'close';
  return false;
}
function bestMatch(input, answers){
  return answers.slice().sort((a,b) => lev(norm(a), norm(input)) - lev(norm(b), norm(input)))[0];
}
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
// Viser svaret og fasiten med bokstavene som er feil, markert
function diffHtml(input, correct){
  const a = input.trim(), b = correct.trim();
  const L = Array.from({length:a.length+1}, () => Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--)
    L[i][j] = a[i] === b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i = 0, j = 0, ha = '', hb = '';
  while(i < a.length || j < b.length){
    if(i < a.length && j < b.length && a[i] === b[j]){ ha += esc(a[i]); hb += esc(b[j]); i++; j++; }
    else if(j < b.length && (i >= a.length || L[i][j+1] >= L[i+1][j])){ hb += `<span class="d-add">${esc(b[j])}</span>`; j++; }
    else { ha += `<span class="d-del">${esc(a[i] === ' ' ? '␣' : a[i])}</span>`; i++; }
  }
  return `<div class="diff" lang="de"><div><span class="muted">Du skrev:</span> ${ha}</div><div><span class="muted">Riktig:</span> <b>${hb}</b></div></div>`;
}
const NEAR_MSG = {
  case:'Nesten! Se på store og små bokstaver. På tysk har alle substantiv stor forbokstav.',
  close:'Nesten! Se på skrivemåten. Husk ä, ö, ü og ß.',
};
function missingArticle(input, answers){
  const a = norm(input);
  return answers.some(x => { const m = norm(x).match(/^(der|die|das) (.+)$/); return m && loose(m[2]) === loose(a); });
}
function hintOf(de){ return de.split(' / ')[0].split(' ').map(w => w[0] + w.slice(1).replace(/[^.,!?]/g,'_')).join(' '); }

// For skriveoppdrag
function W(t){ return ' ' + t.toLowerCase().replace(/[.,!?;:"«»()]/g,' ').replace(/\s+/g,' ').trim() + ' '; }
function has(t, words){ const w = W(t); return words.some(x => w.includes(' '+x+' ')); }
function sentences(t){ return t.split(/[.!?]+/).filter(s => s.trim().split(/\s+/).length >= 2).length; }
function inversion(t){
  const re = /^(am morgen|morgens|am nachmittag|nachmittags|am abend|abends|nach der schule|am wochenende|jeden tag|dann|danach|um \S+( \S+)? uhr|\S+mal in der woche) \S+ ich( |$)/;
  return t.split(/[.!?]+/).some(s => re.test(norm(s)));
}

function level(xp = S.xp){ return Math.floor(Math.sqrt(xp/30)) + 1; }
function levelInfo(){
  const l = level(), base = 30*(l-1)*(l-1), next = 30*l*l;

}
function dayKey(d = new Date()){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function beep(kind){

      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.14, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.22);
    });
  }catch(e){}
}

/* =====================================================================
   OPPGAVETYPER
   Hver oppgave kaller finish({ok, rec:[[id,ok]], xp, answer, note})
   ===================================================================== */
function vocabFor(topic){
  if(topic === 'mix') return VOCAB;
  if(topic === 'dagen') return VOCAB.filter(v => v.t === 'dagen' || v.t === 'tid');
  return VOCAB.filter(v => v.t === topic);
}
const CONJ = Object.keys(VERBS).flatMap(v => PERSONS.map((p,i) => ({id:`conj-${v}-${i}`, v, i})));
const PRET = /\b(war|warst|waren|wart|hatte|hattest|hatten|hattet)\b/;
function pool(kind, topic){
  switch(kind){
    case 'mcDeNo': case 'mcNoDe': case 'typeNoDe': case 'match': return vocabFor(topic);
    case 'symbol': return VOCAB.filter(v => v.e);
    case 'fill':   return (topic === 'verb' || topic === 'mix') ? FILL : FILL.filter(f => f.t === topic);
    case 'conj': case 'verbmc': return CONJ;
    case 'table':  return [{id:'tab-haben', v:'haben'}, {id:'tab-sein', v:'sein'}];
    case 'order':  return topic === 'mix' ? ORDER : topic === 'verb' ? ORDER.filter(o => PRET.test(o.de)) : ORDER.filter(o => o.t === topic);
    case 'read':   return topic === 'mix' ? READ : READ.filter(r => r.t === topic);
    case 'pres': case 'presType': return PRES;
    case 'forecast': return FORECAST;
  }
  return [];
}

function distractors(item, field, n = 3){
  const same = VOCAB.filter(v => v.id !== item.id && v[field] !== item[field] && (v.t === item.t || (v.t+item.t).match(/^(dagentid|tiddagen)$/)));
  const src = same.length >= n ? same : VOCAB.filter(v => v.id !== item.id && v[field] !== item[field]);
  const out = [];
  for(const v of shuffle(src)){ if(!out.includes(v[field])) out.push(v[field]); if(out.length === n) break; }
  return out;
}

// Generelt flervalg
function mc(el, head, options, correct, cb){
  el.innerHTML = head + `<div class="opts">${options.map((o,i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  const btns = [...el.querySelectorAll('.opt')];
  btns.forEach(b => b.onclick = () => {
    const pick = options[+b.dataset.i], ok = pick === correct;
    btns.forEach(x => { x.disabled = true; if(options[+x.dataset.i] === correct) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    cb(ok);
  });
}

  },
  symbol(el, item, finish){

  },
  typeNoDe(el, item, finish){
    el.innerHTML = `<div class="q-label">Skriv på tysk</div><div class="q-big">${esc(item.no)}</div>

    const check = () => {

      else if(r && r !== 'exact') note = NEAR_MSG[r];
      finish({ok:!!r, near: r && r !== 'exact', rec:[[item.id, r === 'exact']], xp: r === 'exact' ? (hint ? 5 : 10) : 3,
        answer:item.de, note: r === 'exact' ? note : (note ? note + ' ' : '') + diffHtml(inp.value, best)});
    };
    el.querySelector('[data-a=check]').onclick = check; onEnter(inp, check); inp.focus();
  },
  fill(el, f, finish){

    el.innerHTML = `<div class="q-label">Fyll inn riktig form av <b>${f.v}</b> i preteritum</div>
      <div class="q-sent" lang="de">${esc(a)}<input class="answer inline" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(b)}</div>

      <div class="hintbox"></div>
      <div class="row end"><button class="btn ghost" data-a="hint">💡 Vis bøyningen</button><button class="btn primary" data-a="check">Sjekk</button></div>`;
    const inp = el.querySelector('input'); let hint = false;
    el.querySelector('[data-a=hint]').onclick = e => { hint = true; e.target.disabled = true; el.querySelector('.hintbox').innerHTML = miniTable(f.v); inp.focus(); };
    const check = () => {
      if(!inp.value.trim() || inp.disabled) return;
      const ok = norm(inp.value) === norm(f.a);
      inp.disabled = true; el.querySelectorAll('button').forEach(b => b.disabled = true);
      inp.classList.add(ok ? 'right' : 'wrong');
      finish({ok, rec:[[f.id,ok]], xp: hint ? 5 : 10, answer:f.s.replace('___', f.a), note: ok ? '' : diffHtml(inp.value, f.a) + miniTable(f.v)});
    };
    el.querySelector('[data-a=check]').onclick = check; onEnter(inp, check); inp.focus();
  },
  conj(el, c, finish){
    const ans = VERBS[c.v][c.i];
    el.innerHTML = `<div class="q-label">Bøy <b>${c.v}</b> (${VERB_NO[c.v]}) i preteritum</div>
      <div class="q-sent" lang="de">${PERSONS[c.i]} <input class="answer inline" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
      <div class="row end"><button class="btn primary" data-a="check">Sjekk</button></div>`;
    const inp = el.querySelector('input');
    const check = () => {
      if(!inp.value.trim() || inp.disabled) return;
      const ok = norm(inp.value) === ans;
      inp.disabled = true; el.querySelector('button').disabled = true;
      inp.classList.add(ok ? 'right' : 'wrong');
      finish({ok, rec:[[c.id,ok]], answer:`${PERSONS[c.i]} ${ans}`, note: ok ? '' : diffHtml(inp.value, ans) + miniTable(c.v)});
    };
    el.querySelector('button').onclick = check; onEnter(inp, check); inp.focus();
  },
  verbmc(el, c, finish){
    const ans = VERBS[c.v][c.i], opts = shuffle([...new Set(VERBS[c.v])]);
    mc(el, `<div class="q-label">Velg riktig form av <b>${c.v}</b> i preteritum</div><div class="q-big" lang="de">${PERSONS[c.i]} ___</div>`, opts, ans,
      ok => finish({ok, rec:[[c.id,ok]], answer:`${PERSONS[c.i]} ${ans}`, note: ok ? '' : miniTable(c.v)}));
  },
  table(el, t, finish){
    el.innerHTML = `<div class="q-label">Fyll ut hele tabellen: <b>${t.v}</b> (${VERB_NO[t.v]}) i preteritum</div>
      <div class="ctable" lang="de">${PERSONS.map((p,i) => `<label for="ct${i}">${p}</label><input id="ct${i}" class="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><span class="fix"></span>`).join('')}</div>
      <div class="row end"><button class="btn primary">Sjekk tabellen</button></div>`;
    const inps = [...el.querySelectorAll('input')];
    inps.forEach((inp,i) => inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); (inps[i+1] || el.querySelector('button')).focus(); } }));
    el.querySelector('button').onclick = () => {
      const rec = []; let right = 0;
      inps.forEach((inp,i) => {
        const ok = norm(inp.value) === VERBS[t.v][i]; inp.disabled = true;
        inp.classList.add(ok ? 'right' : 'wrong');
        if(!ok) inp.nextElementSibling.textContent = '→ ' + VERBS[t.v][i];
        rec.push([`conj-${t.v}-${i}`, ok]); if(ok) right++;
      });
      el.querySelector('button').disabled = true;
      finish({ok: right === 6, rec, xp: right*2 + (right === 6 ? 8 : 0), big: right === 6,
        note: right === 6 ? 'Hele tabellen riktig! 🏆' : `${right} av 6 riktige. Se rettingen i tabellen.`});
    };
    inps[0].focus();
  },
  order(el, o, finish){
    const words = o.de.split(' ');
    let bank = shuffle(words.map((w,i) => ({w,i})));
    if(bank.map(x => x.w).join(' ') === o.de) bank = bank.reverse();
    let line = [];
    el.innerHTML = `<div class="q-label">Sett ordene i riktig rekkefølge</div>
      <div class="q-no">🇳🇴 ${esc(o.no)}</div>
      <div class="slots" lang="de"></div><div class="tokens" lang="de"></div>
      <div class="row end"><button class="btn ghost" data-a="reset">↺ Start på nytt</button><button class="btn primary" data-a="check" disabled>Sjekk</button></div>`;
    const slots = el.querySelector('.slots'), toks = el.querySelector('.tokens'), chk = el.querySelector('[data-a=check]');
    let locked = false;
    const draw = () => {
      slots.innerHTML = line.map((x,k) => `<button class="tok" data-k="${k}">${esc(x.w)}</button>`).join('');
      toks.innerHTML = bank.map((x,k) => `<button class="tok" data-k="${k}">${esc(x.w)}</button>`).join('');
      slots.querySelectorAll('.tok').forEach(b => b.onclick = () => { if(locked) return; bank.push(...line.splice(+b.dataset.k,1)); draw(); });
      toks.querySelectorAll('.tok').forEach(b => b.onclick = () => { if(locked) return; line.push(...bank.splice(+b.dataset.k,1)); beep('tick'); draw(); });
      chk.disabled = bank.length > 0 || locked;
    };
    el.querySelector('[data-a=reset]').onclick = () => { if(locked) return; bank = shuffle(bank.concat(line)); line = []; draw(); };
    chk.onclick = () => {
      const built = line.map(x => x.w).join(' '), ok = [o.de, ...(o.alt||[])].includes(built);
      locked = true; slots.classList.add(ok ? 'right' : 'wrong'); el.querySelectorAll('button').forEach(b => b.disabled = true);
      finish({ok, rec:[[o.id,ok]], answer:o.de, note: ok ? '' : o.n});
    };
    draw();
  },
  read(el, r, finish){
    let qi = 0, right = 0;
    el.innerHTML = `<div class="q-label">Les teksten 📖</div><h3>${esc(r.title)}</h3>
      <div class="text" lang="de">${esc(r.text)}</div>
      <details><summary>Ord som kan hjelpe</summary>${r.g.map(([d,n]) => `<div><b lang="de">${esc(d)}</b> = ${esc(n)}</div>`).join('')}</details>
      <div class="qbox"></div>`;
    const box = el.querySelector('.qbox');
    const ask = () => {
      const [q, opts] = r.qs[qi];
      const sh = shuffle(opts);
      box.innerHTML = '';
      const div = document.createElement('div'); box.append(div);
      mc(div, `<div class="qcount">Spørsmål ${qi+1} av ${r.qs.length}</div><div class="qtext">${esc(q)}</div>`, sh, opts[0], ok => {
        if(ok){ right++; beep('ok'); } else beep('bad');
        qi++;
        const nb = document.createElement('div'); nb.className = 'row end';
        nb.innerHTML = qi < r.qs.length ? '<button class="btn primary">Neste spørsmål ➜</button>' : '<button class="btn primary">Ferdig ✓</button>';
        div.append(nb);
        const b = nb.querySelector('button'); b.focus();
        b.onclick = () => {
          b.disabled = true;
          if(qi < r.qs.length) ask();
          else { const ok = right >= r.qs.length - 1; finish({ok, rec:[[r.id,ok]], xp: right*5, big: right === r.qs.length, silent:true, note:`Du fikk ${right} av ${r.qs.length} riktige på lesespørsmålene.`}); }
        };
      });
    };
    ask();
  },
  pres(el, p, finish){
    const correctForm = p.sj.f === 'er' ? p.forms.er : p.forms.de;
    const wrong = [...new Set(Object.values(p.forms))].filter(f => f !== correctForm);
    const opts = shuffle([p.right, ...shuffle(wrong).slice(0,3).map(f => `${p.sj.de} ${f}.`)]);
    const who = p.sj.tag ? `${p.sj.de} (${p.sj.tag})` : p.sj.de;
    mc(el, `<div class="q-label">Hva gjør de? Velg riktig setning.</div><div class="emoji-big">${p.e}</div>
      <div class="q-sent" lang="de">${esc(who)} + ${esc(p.inf)}</div>`, opts, p.right,
      ok => finish({ok, rec:[[p.id,ok]], answer:p.right, note: ok ? p.n : `${p.sj.f === 'er' ? 'Er / sie (hun) → -t' : 'Sie (de) → samme som infinitiv'}. ${p.n}`}));
  },
  presType(el, p, finish){
    el.innerHTML = `<div class="q-label">Skriv setningen på tysk</div><div class="emoji-big">${p.e}</div>
      <div class="q-big">${esc(p.no)}</div>
      <input class="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Skriv her …" lang="de">
      <div class="hintbox"></div>
      <div class="row end"><button class="btn ghost" data-a="hint">💡 Hint</button><button class="btn primary" data-a="check">Sjekk</button></div>`;
    const inp = el.querySelector('input'); let hint = false;
    el.querySelector('[data-a=hint]').onclick = e => { hint = true; e.target.disabled = true; el.querySelector('.hintbox').innerHTML = `Verbet: <b lang="de">${esc(p.inf)}</b>`; inp.focus(); };
    const check = () => {
      if(!inp.value.trim() || inp.disabled) return;
      const r = checkAns(inp.value, [p.right]);
      inp.disabled = true; el.querySelectorAll('button').forEach(b => b.disabled = true);
      inp.classList.add(r === 'exact' ? 'right' : 'wrong');
      const rule = `${p.sj.f === 'er' ? 'Han / hun → -t' : 'De → samme som infinitiv (-en)'}. ${p.n}`;
      finish({ok:!!r, near: r && r !== 'exact', rec:[[p.id, r === 'exact']], xp: r === 'exact' ? (hint ? 5 : 10) : 3, answer:p.right,
        note: r === 'exact' ? p.n : (r ? NEAR_MSG[r] : rule) + diffHtml(inp.value, p.right)});
    };
    el.querySelector('[data-a=check]').onclick = check; onEnter(inp, check); inp.focus();
  },
  forecast(el, f, finish){
    const sent = (a, b) => `Heute ${a.heute}. Morgen ${b.morgen}.`;
    const right = sent(f.a, f.b);
    const other = rnd(FC.filter(x => x !== f.a && x !== f.b));
    const bad = [
      sent(f.b, f.a),                                                     // byttet om i dag og i morgen
      sent(f.a, other),                                                   // feil vær i morgen
      `Heute ${f.a.heute}. Morgen es ${f.b.morgen.replace(' es','')}.`,   // feil ordstilling
    ];
    mc(el, `<div class="q-label">Værmelding: velg riktig setning</div>
      <div style="display:flex;justify-content:center;gap:36px;text-align:center;margin:6px 0 16px">
        <div><div style="font-size:64px">${f.a.e}</div><b>I dag</b></div>
        <div><div style="font-size:64px">${f.b.e}</div><b>I morgen</b></div>
      </div>`, shuffle([right, ...bad]), right,
      ok => finish({ok, rec:[[f.id,ok]], answer:right, note:'Etter Heute og Morgen kommer verbet først, så es: «Morgen wird es …». Om i morgen bruker du werden.'}));
  },
  match(el, _, finish, topic){
    let src = vocabFor(topic), items = [];
    for(const v of weightedPick(src, src.length)){
      if(!items.some(x => x.no === v.no || x.de === v.de)) items.push(v);
      if(items.length === 5) break;
    }
    const L = shuffle(items), R = shuffle(items), missed = new Set();
    let sel = null, done = 0, mistakes = 0;
    el.innerHTML = `<div class="q-label">Finn parene: trykk på et tysk ord og den norske betydningen</div>
      <div class="match"><div class="col" lang="de">${L.map(v => `<button class="mbtn" data-s="L" data-id="${v.id}">${esc(v.de)}</button>`).join('')}</div>
      <div class="col">${R.map(v => `<button class="mbtn" data-s="R" data-id="${v.id}">${esc(v.no)}</button>`).join('')}</div></div>`;
    el.querySelectorAll('.mbtn').forEach(b => b.onclick = () => {
      if(b.classList.contains('done')) return;
      if(!sel || sel.dataset.s === b.dataset.s){ if(sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
      if(sel.dataset.id === b.dataset.id){
        [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; });
        done++; beep('tick'); sel = null;
        if(done === items.length){
          finish({ok: mistakes <= 1, rec: items.map(v => [v.id, !missed.has(v.id)]), xp: Math.max(4, 12 - mistakes*2), big: !mistakes,
            note: mistakes ? `${mistakes} feil underveis. Ordene du bommet på, kommer igjen senere.` : 'Ingen feil! 💪'});
        }
      } else {
        mistakes++; missed.add(sel.dataset.id); missed.add(b.dataset.id); beep('bad');
        const a = sel; [a, b].forEach(x => { x.classList.remove('sel'); x.classList.add('flash'); });
        setTimeout(() => [a, b].forEach(x => x.classList.remove('flash')), 450);
        sel = null;
      }
    });
  },
};

function miniTable(v){
  return `<table class="mini" lang="de">${PERSONS.map((p,i) => `<tr><td>${p}</td><td>${VERBS[v][i]}</td></tr>`).join('')}</table>`;
}

/* =====================================================================
   ØKT
   ===================================================================== */
let SES = null;
const PRAISE = ['Riktig!','Supert!','Sehr gut!','Wunderbar!','Klasse!','Perfekt!','Toll!','Genau!'];
const COMFORT = ['Ikke helt','Nesten!','Godt forsøk','Ikke denne gangen'];

function startSession(topic){
  SES = {topic, i:0, total:SESSION_LEN, correct:0, combo:0, xp:0, lastKind:null, recent:[], retry:[], kindCount:{}, startLevel:level()};
  nextTask();
}
function chooseTask(){
  const kinds = TOPICS[SES.topic].kinds.filter(k =>
    k !== SES.lastKind && !(ONCE.includes(k) && SES.kindCount[k]) &&
    pool(k, SES.topic).length >= (k === 'match' ? 5 : 1));
  for(let tries = 0; tries < 30; tries++){
    const k = rnd(kinds);
    if(k === 'match') return {kind:k, item:null};
    const p = pool(k, SES.topic).filter(x => !SES.recent.includes(x.id));
    if(p.length) return {kind:k, item:weightedPick(p,1)[0]};
  }
  const k = rnd(kinds); return {kind:k, item:k === 'match' ? null : rnd(pool(k, SES.topic))};
}
function nextTask(){
  $('.fb')?.remove();
  // Ord han bommet på kommer tilbake. Er økta slutt, får han opptil 4 ekstra.
  if(SES.i >= SES.total && SES.retry.length && SES.total < SESSION_LEN + 4){ SES.total++; SES.retry[0].due = 0; }
  if(SES.i >= SES.total) return endSession();
  const di = SES.retry.findIndex(r => r.due <= SES.i);
  const task = di >= 0 ? SES.retry.splice(di,1)[0] : chooseTask();
  SES.current = task; SES.lastKind = task.kind;
  SES.kindCount[task.kind] = (SES.kindCount[task.kind]||0) + 1;
  if(task.item){ SES.recent.push(task.item.id); SES.recent = SES.recent.slice(-5); }

  const extra = SES.i >= SESSION_LEN;
  app.innerHTML = `
    <div class="sbar">
      <button class="icon" id="quit" aria-label="Avslutt">✕</button>
      <div class="bar"><div style="width:${100*SES.i/SES.total}%"></div></div>
      <div class="combo ${SES.combo >= 3 ? 'on' : ''}">${SES.combo >= 2 ? '🔥 '+SES.combo : ''}</div>
    </div>
    ${extra ? '<p class="muted" style="margin:-6px 0 10px">🔁 Ekstrarunde: ord du bommet på</p>' : ''}
    <div class="card task" id="task"></div>`;
  $('#quit').onclick = () => { if(confirm('Avslutte økta? XP-en du har fått, beholder du.')){ save(); renderHome(); } };
  RUN[task.kind]($('#task'), task.item, onResult, SES.topic);
  window.scrollTo(0,0);
}
function onResult(res){
  (res.rec||[]).forEach(([id,ok]) => record(id, ok));
  let gained;
  if(res.ok){
    SES.correct++; SES.combo++; S.maxCombo = Math.max(S.maxCombo, SES.combo);
    gained = (res.xp ?? 10) + (SES.combo >= 3 ? 5 : 0);
    if(!res.silent) beep('ok');
    if([3,5,10,15,20].includes(SES.combo) || res.big) burst();
    if(res.near && SES.current.item) SES.retry.push({kind:SES.current.kind, item:SES.current.item, due:SES.i+3});
  } else {
    SES.combo = 0; gained = res.xp && res.xp > 0 && ['read','table','match'].includes(SES.current.kind) ? res.xp : 0;
    if(!res.silent) beep('bad');
    if(SES.current.item && RETRY.includes(SES.current.kind)) SES.retry.push({kind:SES.current.kind, item:SES.current.item, due:SES.i+3});
  }
  SES.xp += gained; S.xp += gained; SES.i++; save();

  const fb = document.createElement('div');
  fb.className = 'fb ' + (res.near ? 'near' : res.ok ? 'ok' : 'bad');
  fb.innerHTML = `<div class="in"><div class="msg">
      <div class="title">${res.near ? 'Nesten riktig!' : res.ok ? rnd(PRAISE) : rnd(COMFORT)}${gained ? `<span class="xp">+${gained} XP</span>` : ''}${res.ok && SES.combo >= 3 ? ` <span class="xp">🔥 ${SES.combo} på rad!</span>` : ''}</div>
      ${!res.ok && res.answer && !(res.note || '').includes('class="diff"') ? `<div>Riktig svar: <b lang="de">${esc(res.answer)}</b></div>` : ''}
      ${res.note ? `<div>${res.note}</div>` : ''}
    </div><button class="btn primary" id="next">Fortsett ➜</button></div>`;
  document.body.append(fb);
  const nb = $('#next'); nb.onclick = nextTask; nb.focus();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.defaultPrevented && $('#next') && document.activeElement?.id !== 'next'){ e.preventDefault(); nextTask(); }
});

function endSession(){
  $('.fb')?.remove();
  S.sessions++; S.topicDone[SES.topic] = (S.topicDone[SES.topic]||0) + 1;
  markDay();
  const newM = checkMedals(); save();
  const up = level() > SES.startLevel, L = levelInfo();
  const pct = SES.correct / SES.total;
  const big = pct >= .9 ? '🏆' : pct >= .7 ? '🌟' : pct >= .5 ? '💪' : '🌱';
  const msg = pct >= .9 ? 'Helt rå!' : pct >= .7 ? 'Kjempebra jobba!' : pct >= .5 ? 'Bra! Øvelse gjør mester.' : 'Fint at du øvde! Ordene du bommet på, kommer oftere neste gang.';
  beep('win'); burst(up || newM.length ? 30 : 16);
  app.innerHTML = `<div class="card end">
      <div class="big">${big}</div><h2>${msg}</h2>
      <div class="stat">${SES.correct} av ${SES.total} riktige</div>
      <div class="stat" style="color:var(--accent)">+${SES.xp} XP</div>
      ${up ? `<div class="newmedal">⬆️ Nytt nivå: ${L.l} – ${L.rank}!</div>` : ''}
      ${newM.map(m => `<div class="newmedal">${m.e} Ny medalje: ${m.name}</div>`).join('')}
      <div class="row"><button class="btn primary" id="again">En runde til</button><button class="btn" id="home">Hjem</button></div>
    </div>`;
  const t = SES.topic;
  $('#again').onclick = () => startSession(t); $('#home').onclick = renderHome; $('#again').focus();
}

/* =====================================================================
   60-SEKUNDERS UTFORDRING
   ===================================================================== */
let CH = null;
function stopChallenge(){ if(CH){ clearInterval(CH.timer); CH = null; } }
function startChallenge(){
  stopChallenge();
  CH = {score:0, left:60, timer:null, startLevel:level()};
  app.innerHTML = `<div class="sbar"><button class="icon" id="quit" aria-label="Avslutt">✕</button>
      <div class="bar"><div id="tbar" style="width:100%"></div></div></div>
    <div class="chal-top"><span class="timer" id="time">⏱ 60</span><span>⭐ <span id="score">0</span></span></div>
    <div class="card task" id="task"></div>`;
  $('#quit').onclick = () => { stopChallenge(); renderHome(); };
  CH.timer = setInterval(() => {
    CH.left--; $('#time').textContent = '⏱ ' + CH.left; $('#tbar').style.width = (100*CH.left/60) + '%';
    if(CH.left <= 10) $('#time').classList.add('low');
    if(CH.left <= 0) endChallenge();
  }, 1000);
  chalQ();
}
function chalQ(){
  if(!CH) return;
  const el = $('#task'), type = rnd(['de','de','no','verb','pres']);
  const next = ok => {
    if(!CH) return;
    if(ok){ CH.score++; $('#score').textContent = CH.score; beep('ok'); } else beep('bad');
    setTimeout(chalQ, ok ? 300 : 900);
  };
  if(type === 'pres'){
    const p = rnd(PRES), cf = p.sj.f === 'er' ? p.forms.er : p.forms.de;
    const opts = shuffle([p.right, ...shuffle([...new Set(Object.values(p.forms))].filter(f => f !== cf)).slice(0,3).map(f => `${p.sj.de} ${f}.`)]);
    mc(el, `<div class="q-label">${p.e} ${esc(p.sj.tag ? p.sj.de+' ('+p.sj.tag+')' : p.sj.de)} + ${esc(p.inf)}</div>`, opts, p.right, ok => { record(p.id, ok); next(ok); });
  } else if(type === 'verb'){
    const c = rnd(CONJ), ans = VERBS[c.v][c.i];
    mc(el, `<div class="q-label">${c.v} i preteritum</div><div class="q-big" lang="de">${PERSONS[c.i]} ___</div>`, shuffle([...new Set(VERBS[c.v])]), ans, ok => { record(c.id, ok); next(ok); });
  } else {
    const v = rnd(VOCAB);
    if(type === 'de') mc(el, `<div class="q-label">Hva betyr dette?</div><div class="q-big" lang="de">${esc(v.de)}</div>`, shuffle([v.no, ...distractors(v,'no')]), v.no, ok => { record(v.id, ok); next(ok); });
    else mc(el, `<div class="q-label">Hva heter dette på tysk?</div><div class="q-big">${esc(v.no)}</div>`, shuffle([v.de, ...distractors(v,'de')]), v.de, ok => { record(v.id, ok); next(ok); });
  }
}
function endChallenge(){
  const c = CH; stopChallenge();
  const record60 = c.score > S.best60, xp = c.score * 3;
  if(record60) S.best60 = c.score;
  S.xp += xp; markDay();
  const newM = checkMedals(); save();
  beep('win'); burst(record60 ? 30 : 14);
  const up = level() > c.startLevel, L = levelInfo();
  app.innerHTML = `<div class="card end">
      <div class="big">${record60 ? '🏆' : '⚡'}</div>
      <h2>${record60 ? 'Ny rekord!' : 'Tiden er ute!'}</h2>
      <div class="stat">${c.score} riktige på 60 sekunder</div>
      <div class="muted">Rekorden din: ${S.best60}</div>
      <div class="stat" style="color:var(--accent)">+${xp} XP</div>
      ${up ? `<div class="newmedal">⬆️ Nytt nivå: ${L.l} – ${L.rank}!</div>` : ''}
      ${newM.map(m => `<div class="newmedal">${m.e} Ny medalje: ${m.name}</div>`).join('')}
      <div class="row"><button class="btn primary" id="again">Prøv igjen</button><button class="btn" id="home">Hjem</button></div>
    </div>`;
  $('#again').onclick = startChallenge; $('#home').onclick = renderHome; $('#again').focus();
}

/* =====================================================================
   SKRIVEOPPDRAG
   ===================================================================== */
// Egne regler for feil LanguageTool ikke fanger (ordstilling og typiske elevfeil)
const TIME_START = '(?:am morgen|morgens|am nachmittag|nachmittags|am abend|abends|nach der schule|am wochenende|jeden tag|dann|danach|heute|morgen|übermorgen|gestern|im sommer|im winter|in den \\S*ferien|am meer|im gebirge|im ferienhaus|bei oma und opa|in (?:der |den )?\\S+|\\S+mal in der woche|um \\S+(?: \\S+)? uhr)';
function localRules(t){
  const out = [];
  // 1) Ordstilling: tidsuttrykk/sted først → verbet før subjektet
  const reS = /[^.!?]+[.!?]*/g; let m;
  while((m = reS.exec(t))){
    const raw = m[0], lead = raw.length - raw.trimStart().length, sent = raw.trimStart(), base = m.index + lead;
    const r = new RegExp('^(' + TIME_START + ')\\s*,?\\s+(ich|du|er|sie|es|wir|ihr|das wetter|die sonne|der himmel)\\s+(\\S+?)(?=[\\s.,!?]|$)', 'i').exec(sent);
    if(r && !/^(nicht|auch|immer|oft|meistens|gern|gerne|und|oder)$/i.test(r[3])){
      const verbIdx = r[0].length - r[3].length;
      const subjIdx = r[0].toLowerCase().lastIndexOf(r[2].toLowerCase(), verbIdx - 1);
      const subj = r[0].slice(subjIdx, subjIdx + r[2].length);
      out.push({offset: base + subjIdx, length: verbIdx + r[3].length - subjIdx,
        label:'Ordstilling: når setningen starter med et tidsuttrykk eller sted, kommer verbet før «' + subj + '» (verbet på plass 2).',
        repl:[r[3] + ' ' + (/^(ich|du|er|sie|es|wir|ihr)$/i.test(subj) ? subj.toLowerCase() : subj)]});
    }
  }
  const rx = (re, label, fix) => { let k; re.lastIndex = 0; while((k = re.exec(t))) out.push({offset:k.index + (k[1] ? k[0].indexOf(k[2]) : 0), length:(k[2] || k[0]).length, label, repl:[fix(k)]}); };
  // 2) am morgen / am abend / am nachmittag → stor bokstav
  rx(/\b(am|Am) (morgen|abend|nachmittag|wochenende)\b/g, 'Stor forbokstav: der Morgen, der Abend … er substantiv.', k => k[2][0].toUpperCase() + k[2].slice(1));
  // 3) wahren/wahrst → waren/warst
  rx(/\bwahren\b/gi, 'Stavefeil: «waren» (var) skrives uten h. «wahr» betyr sann.', k => k[0][0] === 'W' ? 'Waren' : 'waren');
  rx(/\bwahrst\b/gi, 'Stavefeil: «warst» skrives uten h.', k => k[0][0] === 'W' ? 'Warst' : 'warst');
  // 4) schon/schön
  rx(/\b(war|ist|wird|sehr) (schon)(?=\s*[.!,]|\s+und)/gi, 'Mente du «schön» (fin)? «schon» betyr allerede.', () => 'schön');
  return out;
}

const LT_SKIP = /^(TYPOGRAPHY|STYLE|REDUNDANCY|COLLOQUIALISMS)$/;
function ltLabel(m){
  const c = m.rule.category.id, msg = m.message || '';
  if(/großgeschrieben|Großschreibung/i.test(msg)) return 'Stor forbokstav: substantiv (og ord først i setningen) skrives med stor bokstav på tysk.';
  if(/kleingeschrieben|Kleinschreibung/i.test(msg)) return 'Liten forbokstav: dette ordet skal skrives med liten bokstav.';
  if(/Übereinstimmung|Subjekt|Prädikat/i.test(msg)) return 'Verbet passer ikke med personen (ich, du, er, wir …).';
  if(c === 'TYPOS') return 'Stavefeil.';
  if(c === 'CASING') return 'Stor eller liten forbokstav.';
  if(c === 'PUNCTUATION') return 'Tegnsetting (komma, punktum …).';
  if(c === 'CONFUSED_WORDS') return 'Mulig feil ord.';
  if(c === 'GRAMMAR') return 'Grammatikkfeil.';
  return 'Mulig feil.';
}
async function spellCheck(t){
  let lt = [], failed = false;
  try{
    const body = new URLSearchParams({text:t, language:'de-DE', level:'default'});
    const r = await fetch('https://api.languagetool.org/v2/check', {method:'POST', body});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    lt = d.matches.filter(m => !LT_SKIP.test(m.rule.category.id)).map(m => {
      const orig = t.substr(m.offset, m.length), first = orig.split(' ')[0];
      // Konjunktiv (wäre, hätte) er ikke pensum. Forslag som beholder personen, kommer først.
      const repl = m.replacements.map(x => x.value).filter(v => !/\b(wäre|wären|wärst|hätte|hätten|hättest|sei|seist|seien)\b/.test(v))
        .sort((a,b) => (b.split(' ')[0] === first) - (a.split(' ')[0] === first)).slice(0,3);
      return {offset:m.offset, length:m.length, label:ltLabel(m), repl};
    });
  }catch(e){ failed = true; }
  const all = [...localRules(t), ...lt].sort((a,b) => a.offset - b.offset);
  const res = []; let end = -1;
  for(const m of all){ if(m.offset >= end){ res.push(m); end = m.offset + m.length; } }
  return {matches: res, failed};
}

function renderWriting(kind){
  const w = WRITING[kind];
  app.innerHTML = `
    <div class="sbar"><button class="icon" id="quit" aria-label="Tilbake">✕</button><b style="font-size:20px">${w.emoji} ${w.title}</b></div>
    <div class="card">
      <p style="margin-top:0">${w.task}</p>
      <div class="q-label">Trykk på ordene for å sette dem inn:</div>
      <div class="chips" lang="de">${w.bank.map((b,i) => `<button class="chipb" data-i="${i}">${esc(b)}</button>`).join('')}</div>
      <textarea id="txt" lang="de" spellcheck="false" placeholder="Skriv teksten din her …">${esc(S.drafts[kind] || '')}</textarea>
      <div class="q-label" style="margin-top:14px">Sjekkliste</div>
      <ul class="checks" id="checks"></ul>
      <details><summary>Se et eksempel (prøv selv først!)</summary><div class="example" lang="de">${esc(w.example)}</div></details>
      <div class="row end"><button class="btn" id="spellbtn">🔍 Sjekk stavingen</button><button class="btn primary" id="done">Jeg er ferdig ✓</button></div>
      <div class="spell" id="spell"></div>
      <p class="muted" style="font-size:14px">Stavekontrollen finner de fleste feil, men ikke alle. Teksten sendes til LanguageTool for å bli sjekket.</p>
    </div>`;
  const ta = $('#txt');
  const update = () => {
    $('#checks').innerHTML = w.checks.map(([label, fn]) => { const ok = fn(ta.value); return `<li class="${ok ? 'done' : ''}">${ok ? '✅' : '⬜'} ${esc(label)}</li>`; }).join('');
    S.drafts[kind] = ta.value; save();
  };
  ta.addEventListener('input', update);
  app.querySelectorAll('.chipb').forEach(b => b.onclick = () => {
    const text = w.bank[+b.dataset.i], s = ta.selectionStart, before = ta.value.slice(0, s);
    const pad = before && !/\s$/.test(before) ? ' ' : '';
    ta.setRangeText(pad + text + ' ', s, ta.selectionEnd, 'end'); ta.focus(); update();
  });
  $('#quit').onclick = renderHome;
  let lastCheck = null; // {text, errors}
  const runSpell = async () => {
    const t = ta.value; if(!t.trim()){ ta.focus(); return null; }
    const box = $('#spell'); box.innerHTML = '<p class="muted">🔍 Sjekker …</p>';
    const {matches, failed} = await spellCheck(t);
    if(ta.value !== t || !ta.isConnected) return null;
    lastCheck = {text:t, errors:matches.length};
    let html = '', pos = 0;
    matches.forEach((m,k) => { html += esc(t.slice(pos, m.offset)) + `<mark>${esc(t.substr(m.offset, m.length))}</mark>`; pos = m.offset + m.length; });
    html += esc(t.slice(pos));
    box.innerHTML = (failed ? '<p style="color:var(--bad)">Fikk ikke kontakt med stavekontrollen (er du på nett?). Bare appens egne regler er sjekket.</p>' : '') +
      (matches.length
        ? `<div class="q-label">${matches.length} ${matches.length === 1 ? 'mulig feil' : 'mulige feil'}. Trykk på et forslag for å rette:</div>
           <div class="marked" lang="de">${html}</div>
           <ul>${matches.map((m,k) => `<li><b lang="de" style="color:var(--bad)">${esc(t.substr(m.offset, m.length))}</b> · ${esc(m.label)}<br>${m.repl.map((r,ri) => `<button class="sugg" data-k="${k}" data-r="${ri}" lang="de">${esc(r)}</button>`).join('')}</li>`).join('')}</ul>`
        : (failed ? '' : '<p style="color:var(--ok);font-weight:700">✅ Fant ingen feil. Bra jobba!</p>'));
    box.querySelectorAll('.sugg').forEach(b => b.onclick = () => {
      const m = matches[+b.dataset.k];
      ta.value = t.slice(0, m.offset) + m.repl[+b.dataset.r] + t.slice(m.offset + m.length);
      update(); beep('tick'); runSpell();
    });
    return lastCheck;
  };
  $('#spellbtn').onclick = runSpell;
  ta.addEventListener('input', () => { if(lastCheck && lastCheck.text !== ta.value) $('#spell').innerHTML = '<p class="muted">Teksten er endret. Trykk «Sjekk stavingen» igjen.</p>'; });
  $('#done').onclick = async () => {
    if(!ta.value.trim()){ ta.focus(); return; }
    if(!lastCheck || lastCheck.text !== ta.value){
      const c = await runSpell();
      if(!ta.isConnected) return;
      if(c && c.errors){ $('#spell').insertAdjacentHTML('afterbegin', '<p style="font-weight:700">Rett feilene først, eller trykk «Jeg er ferdig» igjen for å levere likevel.</p>'); $('#spell').scrollIntoView({behavior:'smooth'}); return; }
    }
    const noErrors = lastCheck && lastCheck.text === ta.value && lastCheck.errors === 0;
    const passed = w.checks.filter(([, fn]) => fn(ta.value)).length, all = passed === w.checks.length;
    if(!ta.value.trim()){ ta.focus(); return; }
    const isNew = S.submitted[kind] !== ta.value.trim();
    const xp = isNew ? passed*5 + (all ? 20 : 0) + (noErrors ? 15 : 0) : 0;
    const L0 = level();
    if(isNew){ S.xp += xp; S.submitted[kind] = ta.value.trim(); if(all) S.writingDone++; markDay(); }
    const newM = checkMedals(); save();
    if(all){ beep('win'); burst(24); } else beep('ok');
    const L = levelInfo();
    app.innerHTML = `<div class="card end">
        <div class="big">${all ? '🏆' : '✍️'}</div>
        <h2>${all ? 'Hele sjekklista er fullført!' : `${passed} av ${w.checks.length} punkter på sjekklista`}</h2>
        ${xp ? `<div class="stat" style="color:var(--accent)">+${xp} XP</div>` : '<div class="muted">Endre teksten for å få XP igjen.</div>'}
        ${noErrors ? '<div class="newmedal">✨ Ingen stavefeil: +15 XP bonus</div>' : ''}
        ${level() > L0 ? `<div class="newmedal">⬆️ Nytt nivå: ${L.l} – ${L.rank}!</div>` : ''}
        ${newM.map(m => `<div class="newmedal">${m.e} Ny medalje: ${m.name}</div>`).join('')}
        ${all ? '' : '<p class="muted">Gå tilbake og prøv å få med resten. Teksten din er lagret.</p>'}
        <div class="row"><button class="btn primary" id="back">${all ? 'Skriv mer' : 'Fortsett å skrive'}</button><button class="btn" id="home">Hjem</button></div>
      </div>`;
    $('#back').onclick = () => renderWriting(kind); $('#home').onclick = renderHome;
  };
  update();
}

renderHome();
</script>
</body>
</html>
