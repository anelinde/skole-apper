<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norsk: argumenterende tekst</title>
<style>
:root{
  --bg:#eff6ff; --card:#ffffff; --ink:#1f1b3a; --muted:#6b6790; --line:#bfdbfe; --chip:#dbeafe;
  --brand:#1d4ed8; --brand-ink:#ffffff; --accent:#ff8a3d;
  --ok:#14874a; --okbg:#e3f6ea; --bad:#c93a3a; --badbg:#fde9e9; --near:#b45309; --nearbg:#fff4e5;
  --shadow:0 2px 0 rgba(31,27,58,.08), 0 8px 24px rgba(31,27,58,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14122a; --card:#1f1c3b; --ink:#f1efff; --muted:#a8a3cc; --line:#34305a; --chip:#2c2852;
    --brand:#60a5fa; --brand-ink:#1c0f05; --accent:#ff9b57;
    --ok:#46d68a; --okbg:#173a28; --bad:#ff7070; --badbg:#3d1d24; --near:#ffb35c; --nearbg:#3a2a14;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:16px 16px 160px}
h1,h2,h3{line-height:1.2;margin:0}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row.end{justify-content:flex-end}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--chip);color:var(--ink);min-height:48px}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;text-decoration:none;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px}
.hero{display:grid;gap:10px}
.lvl{display:flex;align-items:baseline;gap:10px}
.lvlnum{font-size:28px;font-weight:800}
.rank{font-weight:700;color:var(--brand)}
.bar{height:14px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px;transition:width .5s}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:600}
.pill.hot{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.topic{display:grid;gap:6px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.topic:hover{border-color:var(--brand)}
.topic .em{font-size:30px}
.topic b{font-size:18px}
.topic small{color:var(--muted);font-size:14px}
.topic .bar{height:8px;margin-top:4px}
.topic.wide{grid-column:1/-1}
footer{margin-top:32px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sbar .bar{flex:1}
.combo{font-weight:800;min-width:56px;text-align:right}
.combo.on{color:var(--accent)}
.task{min-height:260px}
.q-label{color:var(--muted);font-weight:600;font-size:15px;margin-bottom:8px}
.q-big{font-size:25px;font-weight:800;margin:6px 0 16px}
.q-text{font-size:20px;font-weight:700;margin:6px 0 14px}
.q-sent{font-size:21px;font-weight:700;margin:8px 0 6px;line-height:1.9}
input.answer{width:100%;font:inherit;font-size:21px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.answer.inline{width:8.5ch;display:inline-block;padding:4px 8px;font-weight:700;text-align:center}
input.answer:focus,textarea:focus{outline:none;border-color:var(--brand)}
input.answer.right{border-color:var(--ok);background:var(--okbg)}
input.answer.wrong{border-color:var(--bad);background:var(--badbg)}
input.answer.near{border-color:var(--accent);background:var(--nearbg)}
textarea{width:100%;min-height:110px;font:inherit;font-size:19px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.guard{font-size:14px;color:var(--near);font-weight:700;margin-top:6px}
.guard:empty{display:none}
.hintbox{margin-top:10px;color:var(--muted);font-size:18px}
.hintbox:empty{display:none}
.diff{margin-top:6px;font-size:18px;line-height:1.6}
.d-add{background:var(--okbg);color:var(--ok);text-decoration:underline;font-weight:800}
.d-del{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.keys{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.keys li.ok{color:var(--ok);font-weight:700}
.keys li.near{color:var(--near);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chipb{border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:600}
.checks{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.checks li.done{color:var(--ok);font-weight:700}
.model{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:6px}
details{margin:10px 0}
summary{cursor:pointer;font-weight:700;color:var(--brand)}
.spell .marked{background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.8;white-space:pre-wrap}
.spell mark{background:var(--badbg);color:inherit;border-bottom:3px solid var(--bad);border-radius:3px;padding:0 2px}
.spell ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.spell li{background:var(--bg);border-radius:12px;padding:10px 12px}
.sugg{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:10px;padding:4px 10px;font-weight:800;margin:4px 6px 0 0}
.mini{border-collapse:collapse;margin-top:6px}
.mini td{padding:2px 14px 2px 0}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px;border-top:3px solid;display:flex;justify-content:center;animation:up .2s ease-out;z-index:5}
.fb .in{max-width:720px;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.near{background:var(--nearbg);border-color:var(--accent)}
.fb .msg{flex:1;min-width:220px;max-height:42vh;overflow:auto}
.fb .title{font-size:21px;font-weight:800}
.fb.ok .title{color:var(--ok)} .fb.bad .title{color:var(--bad)} .fb.near .title{color:var(--near)}
.fb .xp{font-weight:800;color:var(--accent);margin-left:6px}
.end{text-align:center;display:grid;gap:10px;justify-items:center}
.end .big{font-size:72px}
.end .stat{font-size:20px;font-weight:800}
.review{text-align:left;width:100%;display:grid;gap:8px}
.review div{background:var(--bg);border-radius:12px;padding:10px 12px}
.conf{position:fixed;top:55vh;font-size:28px;pointer-events:none;z-index:10;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-50vh) scale(1.2) rotate(var(--r));opacity:0}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sortcard{font-size:22px;font-weight:800;text-align:center;background:var(--bg);border-radius:16px;padding:24px 14px;margin:8px 0 14px}
.sortcard.right{background:var(--okbg);color:var(--ok)} .sortcard.wrong{background:var(--badbg);color:var(--bad)}
.buckets{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.buckets .btn{min-height:58px;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--line)} .dots span.ok{background:var(--ok)} .dots span.bad{background:var(--bad)}
.clue{font-size:19px;font-weight:700;background:var(--bg);border-radius:14px;padding:14px;margin:6px 0 12px;line-height:1.5}
.clue .hid{filter:blur(6px);user-select:none}
.potbar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;font-weight:800;margin-bottom:8px}
.wrongnum{background:var(--badbg);color:var(--bad);border-radius:6px;padding:0 6px;text-decoration:line-through}
.badge{display:inline-block;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;margin-bottom:8px}
.badge.bonus{background:#fde68a;color:#92400e} .badge.boss{background:#ede9fe;color:#5b21b6}
.chal-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:22px;margin-bottom:12px}
.timer.low{color:var(--bad)}
.flash{min-height:26px;font-weight:800;margin-top:10px}
.readtext{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.65;white-space:pre-line;margin:8px 0}
.readtext.hidden{filter:blur(7px);user-select:none;pointer-events:none}
.src{font-size:13px;color:var(--muted)}
.qnum{font-weight:800;color:var(--brand);margin:12px 0 4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="innhold.js"></script>
<script>
const K = window.FAG;
const BEG = K.begreper.map(([id,t,fork,svar]) => ({id,t,fork,svar}));
const TEMA = Object.fromEntries(K.temaer.map(t => [t.id, t]));
const TEST_DATE = K.provedato ? new Date(K.provedato + 'T00:00:00') : null;
const KEY = K.lagringsnokkel;
const DEFAULT = {xp:0, stats:{}, sessions:0, maxCombo:0, dayStreak:0, lastDay:null, sound:true};
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(r)); }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ return S.stats[id] || {w:3, s:0, n:0}; }
function record(id, ok){ const x = st(id); x.n++; if(ok){ x.s++; x.w = Math.max(1, x.w-1); } else { x.s = 0; x.w = Math.min(9, x.w+3); } S.stats[id] = x; }
function weightedPick(arr, n){ const a = arr.slice(), out = []; while(out.length < n && a.length){ const tot = a.reduce((s,x) => s+st(x.id).w, 0); let r = Math.random()*tot, i = 0; for(; i < a.length-1; i++){ r -= st(a[i].id).w; if(r <= 0) break; } out.push(a.splice(i,1)[0]); } return out; }
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random()*a.length)];
const RANKS = ['Lytter','Debattant','Skribent','Argumentator','Retoriker','Debattmester','Kronikør'];
function level(xp = S.xp){ return Math.floor(Math.sqrt(xp/30)) + 1; }
function levelInfo(){ const l = level(), base = 30*(l-1)*(l-1), next = 30*l*l; return {l, rank:RANKS[Math.min(l-1, RANKS.length-1)], cur:S.xp-base, need:next-base}; }
function dayKey(d = new Date()){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function markDay(){ const today = dayKey(); if(S.lastDay === today) return; const y = new Date(); y.setDate(y.getDate()-1); S.dayStreak = (S.lastDay === dayKey(y)) ? S.dayStreak+1 : 1; S.lastDay = today; }
function daysToTest(){ if(!TEST_DATE) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((TEST_DATE - t)/864e5); }
let actx;
function beep(kind){ if(!S.sound) return; try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  ({ok:[660,880], bad:[260,200], win:[523,659,784,1046]})[kind].forEach((f,i) => { const t0 = actx.currentTime + i*0.09, o = actx.createOscillator(), g = actx.createGain();
    o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.14, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.22); }); }catch(e){} }
function burst(n = 14){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<n;i++){ const s = document.createElement('span'); s.className = 'conf'; s.textContent = rnd(['⭐','✨','✍️','💬','🏆']);
    s.style.left = (35 + Math.random()*30) + 'vw'; s.style.setProperty('--dx', (Math.random()*60-30) + 'vw'); s.style.setProperty('--r', (Math.random()*360-180) + 'deg');
    document.body.append(s); setTimeout(() => s.remove(), 1400); } }

/* ---------- Han skriver selv ---------- */
const WRITE_ATTR = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
function guardInput(inp, msgEl){
  inp.addEventListener('beforeinput', e => { const t = e.inputType || '';
    if(/^insertFrom(Paste|Drop|Yank)/.test(t) || (e.data && e.data.length > 25)){ e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Skriv svaret selv. På prøven skriver du for hånd!'; } });
  inp.addEventListener('paste', e => { e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Innliming er skrudd av. Skriv selv!'; });
}

/* ---------- Retting ---------- */
const norm = s => String(s).toLowerCase().replace(/[.,!?;:«»"()]/g,'').replace(/\s+/g,' ').trim();
function osa(a, b){ const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]); for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if(i>1 && j>1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1); } return d[a.length][b.length]; }
// 'ok' | 'near' (skrivefeil) | 'bad' | null
function gradeWord(input, answers){ const a = norm(input); if(!a) return null;
  if(answers.some(x => norm(x) === a)) return 'ok';
  if(answers.some(x => { const y = norm(x); return y.length >= 5 && osa(a, y) <= (y.length >= 8 ? 2 : 1); })) return 'near';
  return 'bad'; }
const words = t => t.toLowerCase().replace(/[^\p{L}\p{N} -]+/gu,' ').split(/\s+/).filter(Boolean);
function hasStem(t, ws, stem){ stem = stem.toLowerCase(); const tl = t.toLowerCase();
  if(stem === 'brahma') return ws.some(w => w === 'brahma' || w === 'brahmas');
  if(stem === 'brahman') return ws.some(w => w.startsWith('brahman'));
  if(stem.length < 4) return ws.some(w => w.startsWith(stem));
  if(tl.includes(stem)) return true;
  if(stem.length >= 6) return ws.some(w => w.length >= stem.length-1 && osa(w.slice(0, stem.length), stem) <= 1);
  return false; }
function conceptCheck(begreper, text){ const ws = words(text); return begreper.map(([navn, ...stems]) => ({navn, ok: stems.some(s => hasStem(text, ws, s))})); }
// Stavesjekk av fagordene (navn og begreper fra arket)
const FAG = [...new Set(BEG.flatMap(b => b.svar).filter(x => x.length >= 5 && !x.includes(' ')))];
function fagSjekk(text){ const out = []; const re = /\p{L}+/gu; let m;
  while((m = re.exec(text))){ const w = m[0].toLowerCase(); if(w.length < 5 || (K.ikkeFag || []).some(x => w.startsWith(x)) || FAG.some(f => w.startsWith(f.slice(0, Math.max(5, f.length-2))) && osa(w.slice(0,f.length), f) === 0)) continue;
    const hit = FAG.find(f => w.slice(0,2) === f.slice(0,2) && [f.length-1, f.length, f.length+1].some(L => L <= w.length && L >= 5 && osa(w.slice(0,L), f) === 1 && !(L === f.length-1 && f.startsWith(w.slice(0,L)))));
    if(hit) out.push({ord:m[0], riktig:hit}); }
  return out; }

/* =====================================================================
   OPPGAVER (alle er skriving)
   ===================================================================== */
function onEnter(inp, fn){ inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); fn(); } }); }
const RUN = {
  begrep(el, b, finish){
    el.innerHTML = `<div class="q-label">${TEMA[b.t].e} Skriv begrepet eller navnet</div><div class="q-text">${esc(b.fork)}</div>
      <input class="answer" ${WRITE_ATTR} placeholder="Skriv her …"><div class="guard"></div><div class="hintbox"></div>
      <div class="row end"><button class="btn ghost" id="hint">💡 Hint</button><button class="btn primary" id="check">Sjekk</button></div>`;
    const inp = el.querySelector('input'); guardInput(inp, el.querySelector('.guard')); let hinted = false;
    $('#hint').onclick = e => { hinted = true; e.target.disabled = true; const w = b.svar[0]; el.querySelector('.hintbox').textContent = 'Starter med «' + w.slice(0,2).toUpperCase() + '» og har ' + w.length + ' bokstaver'; inp.focus(); };
    const check = () => { const g = gradeWord(inp.value, b.svar); if(g === null || inp.disabled) return;
      inp.disabled = true; el.querySelectorAll('button').forEach(x => x.disabled = true); inp.classList.add(g === 'ok' ? 'right' : g === 'near' ? 'near' : 'wrong');
      const riktig = b.svar[0].charAt(0).toUpperCase() + b.svar[0].slice(1);
      finish({ok: g !== 'bad', near: g === 'near', rec:[[b.id, g === 'ok']], xp: g === 'ok' ? (hinted ? 5 : 10) : g === 'near' ? 4 : 0,
        note: g === 'ok' ? '' : g === 'near' ? `Nesten! Riktig skrivemåte: <b>${esc(riktig)}</b>` : `Riktig svar: <b>${esc(riktig)}</b>`}); };
    $('#check').onclick = check; onEnter(inp, check); inp.focus();
  },
  fyll(el, y, finish){
    const [a, c] = y.s.split('___');
    el.innerHTML = `<div class="q-label">${TEMA[y.t].e} Skriv ordet som mangler</div>
      <div class="q-text">${esc(a)}<input class="answer inline" ${WRITE_ATTR} style="width:9.5ch">${esc(c)}</div><div class="guard"></div>
      <div class="row end"><button class="btn primary" id="check">Sjekk</button></div>`;
    const inp = el.querySelector('input'); guardInput(inp, el.querySelector('.guard'));
    const check = () => { const g = gradeWord(inp.value, y.svar); if(g === null || inp.disabled) return;
      inp.disabled = true; $('#check').disabled = true; inp.classList.add(g === 'ok' ? 'right' : g === 'near' ? 'near' : 'wrong');
      const riktig = y.svar[0].charAt(0).toUpperCase() + y.svar[0].slice(1);
      finish({ok: g !== 'bad', near: g === 'near', rec:[[y.id, g === 'ok']], xp: g === 'ok' ? 10 : g === 'near' ? 4 : 0,
        note: g === 'ok' ? '' : (g === 'near' ? 'Nesten! Se på skrivemåten. ' : '') + esc(y.s.replace('___', riktig))}); };
    $('#check').onclick = check; onEnter(inp, check); inp.focus();
  },
  // 🕵️ Hvem er jeg? Forklaringen avsløres bit for bit. Jo færre biter, jo flere poeng.
  gaate(el, b, finish){
    const ws = b.fork.split(' '), parts = [Math.ceil(ws.length/3), Math.ceil(2*ws.length/3), ws.length];
    let step = 0; const pts = [20, 12, 6];
    const draw = () => { el.querySelector('.clue').innerHTML = ws.map((w,i) => i < parts[step] ? esc(w) : `<span class="hid">${esc(w)}</span>`).join(' ');
      el.querySelector('.pot').textContent = pts[step]; if(step >= 2) $('#more').disabled = true; };
    el.innerHTML = `<div class="q-label">${TEMA[b.t].e} 🕵️ Hvem er jeg?</div>
      <div class="potbar">🏆 Potten: <span class="pot"></span> XP <span class="muted" style="font-weight:600">· gjett tidlig for flest poeng</span></div>
      <div class="clue"></div>
      <input class="answer" ${WRITE_ATTR} placeholder="Skriv begrepet …"><div class="guard"></div>
      <div class="row end"><button class="btn ghost" id="more">🔎 Vis mer</button><button class="btn primary" id="check">Gjett</button></div>`;
    const inp = el.querySelector('input'); guardInput(inp, el.querySelector('.guard')); draw();
    $('#more').onclick = () => { step = Math.min(2, step+1); draw(); inp.focus(); };

/* =====================================================================
   ØKTER
   ===================================================================== */
const ALL = () => [...BEG.map(x => ['begrep',x]), ...K.fyll.map(x => ['fyll',x]), ...K.kortsvar.map(x => ['kortsvar',x]), ...(K.sorter||[]).map(x => ['sorter',x]), ...(K.lesetekster||[]).map(x => ['les',x]), ...(K.skriv||[]).map(x => ['skriv',x])];
// Tall-oppgaver for «Rett feilen» og «Tallsprint»
const isNum = y => /\d/.test(y.svar[0]);
const NUMS = () => K.fyll.filter(isNum);
function feilItem(y){
  const pool = [...new Set(NUMS().map(x => x.svar[0]))].filter(v => !y.svar.some(a => a.replace(/\s/g,'') === v.replace(/\s/g,'')));
  return {id:'feil-'+y.id, t:y.t, y, feil: rnd(pool)};
}
// Sjekkliste for skriveoppgaver
const Wd = t => ' ' + t.toLowerCase().replace(/[.,!?;:"«»()…]/g,' ').replace(/\s+/g,' ').trim() + ' ';
const sentCount = t => t.split(/[.!?]+/).filter(x => x.trim().split(/\s+/).length >= 3).length;
function sjekkOk(t, [, type, arg]){
  const w = Wd(t);
  if(type === 'ord') return t.trim().split(/\s+/).filter(Boolean).length >= arg;
  if(type === 'setn') return sentCount(t) >= arg;
  if(type === 'spm') return (t.match(/\?/g) || []).length >= arg;
  if(type === 'noen') return arg.some(x => w.includes(' ' + x.toLowerCase() + ' ') || (x.length > 5 && w.includes(x.toLowerCase())));
  if(type === 'ikke') return t.trim().length > 0 && !arg.some(x => w.includes(' ' + x.toLowerCase()));
  if(type === 'start') return Wd(t).startsWith(Wd(arg).trimEnd());
  return false;
}
function startSession(topic){
  let plan;
  const pick = (kind, n, filt) => weightedPick(ALL().filter(([k,x]) => k === kind && (!filt || filt(x))).map(([k,x]) => ({id:x.id, k, x})), n);
  const pickFeil = (n, filt) => weightedPick(NUMS().filter(y => !filt || filt(y)), n).map(y => ({k:'feil', x:feilItem(y)}));
  const asGaate = arr => arr.map(o => ({k:'gaate', x:o.x}));
  if(topic === 'mix'){
    const kort = pick('kortsvar',3);
    plan = [...shuffle([...pick('begrep',2), ...asGaate(pick('begrep',1)), ...pick('fyll',2), ...pick('sorter',2), ...pick('skriv',3), ...kort.slice(0,1)]), kort[2]].filter(Boolean);
  }
  else if(topic === 'prove') plan = pick('kortsvar',5);
  else if(topic === 'skriv') plan = shuffle(pick('skriv',6));
  else if(topic === 'begreper') plan = shuffle([...pick('begrep',6), ...asGaate(pick('begrep',6))]);
  else { const f = x => x.t === topic;
    const kort = pick('kortsvar',3,f);
    plan = [...shuffle([...pick('begrep',2,f), ...asGaate(pick('begrep',2,f)), ...pick('fyll',2,f), ...pickFeil(1,f), ...pick('sorter',1,f), ...pick('skriv',2,f), ...kort.slice(0,2)]), kort[2]].filter(Boolean); }
  plan = plan.map(o => ({kind:o.k, item:o.x}));
  // ⭐ Én bonusoppgave (dobbel XP) og 👾 sjefsoppgave til slutt (trippel XP)
  if(topic !== 'prove' && plan.length > 3){
    plan[Math.floor(Math.random()*(plan.length-1))].bonus = 2;
    if(plan.at(-1).kind === 'kortsvar') plan.at(-1).boss = 3;
  }
  SES = {topic, plan, i:0, base:plan.length, correct:0, combo:0, xp:0, wrong:[], startLevel:level()};
  nextTask();
}
let SES = null;
function nextTask(){
  $('.fb')?.remove();
  if(SES.i >= SES.plan.length) return endSession();
  const task = SES.plan[SES.i]; SES.current = task;
  app.innerHTML = `<div class="sbar"><button class="icon" id="quit" aria-label="Avslutt">✕</button><div class="bar"><div style="width:${100*SES.i/SES.plan.length}%"></div></div>
    <div class="combo ${SES.combo >= 3 ? 'on' : ''}">${SES.combo >= 2 ? '🔥 ' + SES.combo : ''}</div></div>
    ${SES.i >= SES.base ? '<p class="muted" style="margin:-6px 0 10px">🔁 Ekstrarunde: noe du bommet på</p>' : ''}
    ${task.boss ? '<div class="badge boss">👾 SJEFSOPPGAVE · trippel XP</div>' : task.bonus ? '<div class="badge bonus">⭐ BONUS · dobbel XP</div>' : ''}
    <div class="card task" id="task"></div>`;
  $('#quit').onclick = () => { if(confirm('Avslutte økta? XP-en du har fått, beholder du.')){ save(); renderHome(); } };
  RUN[task.kind]($('#task'), task.item, onResult, SES.topic); window.scrollTo(0,0);
}
function onResult(res){
  (res.rec||[]).forEach(([id,ok]) => record(id, ok));
  let gained = Math.max(0, res.xp || 0) * (SES.current.boss || SES.current.bonus || 1);
  if(res.ok && !res.near){ SES.correct++; SES.combo++; S.maxCombo = Math.max(S.maxCombo, SES.combo); if(SES.combo >= 3) gained += 5; }
  else { SES.combo = 0; const cur = SES.current; if(!SES.wrong.includes(cur)) SES.wrong.push(cur);
    if(SES.topic !== 'prove' && SES.plan.length < SES.base + 4) SES.plan.splice(Math.min(SES.i + 4, SES.plan.length), 0, {kind:cur.kind, item:cur.item}); }
  if(!res.quiet) beep(res.ok && !res.near ? 'ok' : 'bad');
  if(res.ok && !res.near && [3,5,10].includes(SES.combo)) burst();
  SES.xp += gained; S.xp += gained; SES.i++; save();
  const fb = document.createElement('div'); fb.className = 'fb ' + (res.near ? 'near' : res.ok ? 'ok' : 'bad');
  fb.innerHTML = `<div class="in"><div class="msg"><div class="title">${res.near ? 'Nesten!' : res.ok ? rnd(['Riktig!','Supert!','Bra jobba!','Helt rått!']) : 'Ikke helt'}${gained ? `<span class="xp">+${gained} XP</span>` : ''}</div>
    ${res.note ? `<div>${res.note}</div>` : ''}</div><button class="btn primary" id="next">Fortsett ➜</button></div>`;
  document.body.append(fb); const nb = $('#next'); nb.onclick = nextTask; nb.focus();
}
document.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.defaultPrevented && $('#next') && document.activeElement?.id !== 'next' && document.activeElement?.tagName !== 'TEXTAREA'){ e.preventDefault(); nextTask(); } });
function label(t){ const x = t.item; return t.kind === 'skriv' ? `🖊️ ${esc(x.tittel)}: ${esc(x.gitt)}` : t.kind === 'les' ? `📖 ${esc(x.tittel)}` : t.kind === 'sorter' ? `🧺 ${esc(x.tittel)}` : t.kind === 'feil' ? esc(x.y.s.replace('___', x.y.svar[0])) : t.kind === 'begrep' || t.kind === 'gaate' ? `${esc(x.fork)} → <b>${esc(x.svar[0])}</b>` : t.kind === 'fyll' ? esc(x.s.replace('___', x.svar[0])) : `<b>${esc(x.spm)}</b><br><span class="muted">${esc(x.modell)}</span>`; }
function endSession(){
  $('.fb')?.remove(); S.sessions++; markDay(); save();
  const pct = SES.correct / SES.plan.length, up = level() > SES.startLevel, L = levelInfo(); beep('win'); burst(up ? 30 : 16);
  app.innerHTML = `<div class="card end"><div class="big">${pct >= .85 ? '🏆' : pct >= .6 ? '🌟' : '💪'}</div>
    <h2>${pct >= .85 ? 'Helt rått!' : pct >= .6 ? 'Kjempebra jobba!' : 'Bra! Det du bommet på, kommer igjen.'}</h2>
    <div class="stat">${SES.correct} av ${SES.plan.length} helt riktige</div><div class="stat" style="color:var(--accent)">+${SES.xp} XP</div>
    ${up ? `<div class="pill hot">⬆️ Nytt nivå: ${L.l} – ${L.rank}!</div>` : ''}
    ${SES.wrong.length ? `<div class="review"><div class="q-label">Les gjennom disse en gang til:</div>${SES.wrong.map(t => `<div>${label(t)}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn primary" id="again">En runde til</button><button class="btn" id="home">Hjem</button></div></div>`;
  const t = SES.topic; $('#again').onclick = () => startSession(t); $('#home').onclick = renderHome; $('#again').focus();
}

/* ---------- ⚡ Tallsprint: skriv tallene på 90 sekunder ---------- */
let CH = null;
function startSprint(){
  CH = {score:0, left:90, wrong:[], timer:null};
  app.innerHTML = `<div class="sbar"><button class="icon" id="quit" aria-label="Avslutt">✕</button><div class="bar"><div id="tbar" style="width:100%"></div></div></div>
    <div class="chal-top"><span class="timer" id="time">⏱ 1:30</span><span>⭐ <span id="score">0</span> · rekord ${S.bestSprint || 0}</span></div>
    <div class="card task"><div class="q-label">⚡ Tallsprint: skriv tallet eller ordet som mangler</div>
      <div class="q-text" id="sq"></div><input class="answer" id="sinp" ${WRITE_ATTR} placeholder="Svar + Enter" style="max-width:240px"><div class="guard"></div>
      <div class="flash" id="sfl"></div><div class="row end"><button class="btn ghost" id="skip">Hopp over</button><button class="btn primary" id="sok">Sjekk</button></div></div>`;
  const inp = $('#sinp'); guardInput(inp, $('.guard'));
  $('#quit').onclick = () => { clearInterval(CH.timer); CH = null; renderHome(); };
  const next = () => { CH.cur = weightedPick(NUMS(), 1)[0]; $('#sq').textContent = CH.cur.s; inp.value = ''; inp.disabled = false; inp.focus(); };
  const submit = skip => { if(!CH || inp.disabled) return; const g = skip ? 'bad' : gradeWord(inp.value, CH.cur.svar); if(g === null) return;
    inp.disabled = true; record(CH.cur.id, g === 'ok');
    if(g === 'ok'){ CH.score++; $('#score').textContent = CH.score; $('#sfl').innerHTML = '<span style="color:var(--ok)">✅ Riktig!</span>'; beep('ok'); }
    else { CH.wrong.push(CH.cur); $('#sfl').innerHTML = `<span style="color:var(--bad)">Riktig: ${esc(CH.cur.svar[0])}</span>`; beep('bad'); }
    setTimeout(() => { if(CH){ $('#sfl').innerHTML = ''; next(); } }, g === 'ok' ? 350 : 1400); };
  $('#sok').onclick = () => submit(false); $('#skip').onclick = () => submit(true);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(false); } });
  CH.timer = setInterval(() => { CH.left--; $('#time').textContent = '⏱ ' + Math.floor(CH.left/60) + ':' + String(CH.left%60).padStart(2,'0');
    $('#tbar').style.width = (100*CH.left/90) + '%'; if(CH.left <= 10) $('#time').classList.add('low'); if(CH.left <= 0) endSprint(); }, 1000);
  next();
}
function endSprint(){
  const c = CH; clearInterval(c.timer); CH = null;
  const rec = c.score > (S.bestSprint || 0); if(rec) S.bestSprint = c.score;
  const xp = c.score * 4; S.xp += xp; markDay(); save(); beep('win'); burst(rec ? 30 : 12);
  app.innerHTML = `<div class="card end"><div class="big">${rec ? '🏆' : '⚡'}</div><h2>${rec ? 'Ny rekord!' : 'Tiden er ute!'}</h2>
    <div class="stat">${c.score} riktige på 90 sekunder</div><div class="muted">Rekord: ${S.bestSprint}</div><div class="stat" style="color:var(--accent)">+${xp} XP</div>
    ${c.wrong.length ? `<div class="review"><div class="q-label">Øv på disse:</div>${[...new Set(c.wrong)].map(y => `<div>${esc(y.s.replace('___', y.svar[0]))}</div>`).join('')}</div>` : ''}
    <div class="row"><button class="btn primary" id="again">Prøv igjen</button><button class="btn" id="home">Hjem</button></div></div>`;
  $('#again').onclick = startSprint; $('#home').onclick = renderHome;
}

/* ---------- 🏁 PRØVETRENING: hel argumenterende tekst, steg for steg ---------- */
const PSTEG = [
  {id:'tema', navn:'Påstand', hjelp:'Velg en påstand du vil argumentere for (eller skriv din egen). Dette blir standpunktet ditt.'},
  {id:'inn', navn:'Innledning', hjelp:'Presenter saken og standpunktet ditt. Setningsstartere fra boka: «Har du tenkt på …», «Mange mener at …, men jeg er ikke så sikker …»',
   sjekk:[['Minst 2 setninger','setn',2],['Standpunktet ditt kommer fram (jeg mener, jeg synes, derfor, bør …)','noen',['jeg mener','jeg synes','jeg tror','bør','burde','må','mener']]]},
  {id:'a1', navn:'Argument 1', hjelp:'Ett avsnitt = ett argument. Start med temasetningen (påstanden), og skriv kommentarsetninger med begrunnelser. «For det første …», «Det er kjent for mange at …»',
   sjekk:[['Minst 3 setninger','setn',3],['Begrunnelse: fordi, derfor, siden …','noen',['fordi','derfor','siden','ettersom','på grunn av']]]},
  {id:'a2', navn:'Argument 2', hjelp:'Nytt avsnitt, nytt argument. Prøv en annen argumenttype enn i argument 1. «For det andre …», «I tillegg så …», «En av fordelene er at …»',
   sjekk:[['Minst 3 setninger','setn',3],['Begrunnelse: fordi, derfor, siden …','noen',['fordi','derfor','siden','ettersom','på grunn av']]]},
  {id:'a3', navn:'Argument 3', hjelp:'Det tredje argumentet. «For det tredje …», «Det viser seg at …»',
   sjekk:[['Minst 3 setninger','setn',3],['Begrunnelse: fordi, derfor, siden …','noen',['fordi','derfor','siden','ettersom','på grunn av']]]},
  {id:'mot', navn:'Motargument', hjelp:'Legg fram et motargument selv, og svar på det. Det viser at du har tenkt gjennom saken og skaper tillit. «På den annen side …», «Selv om det kanskje …»',
   sjekk:[['Minst 3 setninger','setn',3],['Motargumentet: noen mener, på den annen side, selv om …','noen',['noen mener','andre mener','på den annen side','selv om','riktignok','mange vil si','kritikere']],['Du svarer på det: men, likevel, derfor …','noen',['men','likevel','allikevel','derfor','imidlertid']]]},
  {id:'avs', navn:'Avslutning', hjelp:'Oppsummer og gjenta standpunktet. «Derfor tror jeg at …», «Derfor vil det beste være …», «Tenk derfor over …»',
   sjekk:[['Minst 2 setninger','setn',2],['Avslutter: derfor, tenk derfor over, kanskje, alt i alt …','noen',['derfor','tenk derfor','kanskje','alt i alt','til slutt','konklusjon']]]},
];
let PV = null;
function renderProve(){
  PV = S.proveDraft || {steg:0, tekst:{}, tid:0, start:null};
  S.proveDraft = PV; save(); drawProve();
}
function proveTimer(){
  if(PV.timerInt) clearInterval(PV.timerInt);
  if(!PV.tid) return;
  PV.timerInt = setInterval(() => { const el = $('#ptime'); if(!el){ clearInterval(PV.timerInt); return; }
    const left = Math.max(0, PV.tid*60 - Math.round((Date.now() - PV.start)/1000));
    el.textContent = '⏱ ' + Math.floor(left/60) + ':' + String(left%60).padStart(2,'0'); if(left <= 300) el.classList.add('low'); }, 1000);
}
function drawProve(){
  const st = PSTEG[PV.steg];
  app.innerHTML = `<div class="sbar"><button class="icon" id="quit" aria-label="Avslutt">✕</button><div class="bar"><div style="width:${100*PV.steg/PSTEG.length}%"></div></div><span class="timer" id="ptime" style="font-weight:800"></span></div>
    <div class="steps5" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${PSTEG.map((x,k) => `<span class="badge" style="background:${k === PV.steg ? 'var(--brand)' : k < PV.steg ? 'var(--okbg)' : 'var(--chip)'};color:${k === PV.steg ? '#fff' : 'inherit'}">${k+1}. ${x.navn}</span>`).join('')}</div>
    <div class="card task" id="task"></div>`;
  $('#quit').onclick = () => { save(); renderHome(); };
  const el = $('#task');
  if(st.id === 'tema'){
    el.innerHTML = `<div class="q-label">🏁 Prøvetrening · steg 1</div><div class="q-text">${esc(st.hjelp)}</div>
      <div class="chips">${K.temaForslag.map((t,i) => `<button class="chipb" data-i="${i}" style="cursor:pointer">${esc(t)}</button>`).join('')}</div>
      <input class="answer" id="pt" ${WRITE_ATTR} placeholder="Eller skriv din egen påstand …" value="${esc(PV.tekst.tema || '')}"><div class="guard"></div>
      <div class="q-label" style="margin-top:14px">Vil du skrive på tid, som på prøven?</div>
      <div class="chips">${[[0,'Uten klokke'],[30,'30 minutter'],[45,'45 minutter'],[60,'60 minutter']].map(([m,n]) => `<button class="chipb" data-m="${m}" style="cursor:pointer;${PV.tid === m ? 'background:var(--brand);color:#fff' : ''}">${n}</button>`).join('')}</div>
      <div class="row end"><button class="btn primary" id="next1">Start å skrive ➜</button></div>`;
    const inp = $('#pt'); guardInput(inp, el.querySelector('.guard'));
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { inp.value = K.temaForslag[+b.dataset.i]; });
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { PV.tid = +b.dataset.m; el.querySelectorAll('[data-m]').forEach(x => x.style.cssText = 'cursor:pointer'); b.style.cssText = 'cursor:pointer;background:var(--brand);color:#fff'; });
    $('#next1').onclick = () => { if(inp.value.trim().split(/\s+/).length < 3) return inp.focus(); PV.tekst.tema = inp.value.trim(); PV.steg = 1; PV.start = Date.now(); save(); drawProve(); };
    return;
  }
  proveTimer();
  el.innerHTML = `<div class="q-label">🏁 Steg ${PV.steg+1}: ${esc(st.navn)}</div><div class="clue" style="font-size:16px">Påstand: «${esc(PV.tekst.tema)}»</div>
    <div class="muted" style="margin-bottom:8px">${esc(st.hjelp)}</div>
    <details><summary>Se det du har skrevet så langt</summary><div class="model" style="white-space:pre-wrap">${esc(PSTEG.slice(1, PV.steg).map(x => PV.tekst[x.id] || '').filter(Boolean).join('\n\n')) || '(ingenting ennå)'}</div></details>
    <textarea id="txt" ${WRITE_ATTR} style="min-height:170px" placeholder="Skriv ${esc(st.navn.toLowerCase())} her …">${esc(PV.tekst[st.id] || '')}</textarea><div class="guard"></div>
    <ul class="keys" id="live"></ul><div id="atype" class="muted" style="font-size:14px"></div>
    <div class="row"><button class="btn ghost" id="prev">← Tilbake</button><span style="flex:1"></span><button class="btn primary" id="nx">${PV.steg < PSTEG.length-1 ? 'Neste ➜' : 'Ferdig ✓'}</button></div>`;
  const ta = $('#txt'); guardInput(ta, el.querySelector('.guard')); ta.focus();
  const draw = () => { PV.tekst[st.id] = ta.value; save();
    $('#live').innerHTML = st.sjekk.map(c => { const ok = sjekkOk(ta.value, c); return `<li class="${ok ? 'ok' : ''}">${ok ? '✅' : '⬜'} ${esc(c[0])}</li>`; }).join('');
    const ty = argTyper(ta.value); $('#atype').textContent = ty.length ? 'Argumenttype jeg ser spor av: ' + ty.join(', ') : ''; };
  ta.addEventListener('input', draw); draw();
  $('#prev').onclick = () => { PV.steg--; save(); drawProve(); };
  $('#nx').onclick = () => { if(ta.value.trim().split(/\s+/).length < 5) return ta.focus(); if(PV.steg < PSTEG.length-1){ PV.steg++; save(); drawProve(); } else finishProve(); };
}
function argTyper(t){ const w = Wd(t); return Object.entries(K.typeOrd).filter(([,ord]) => ord.some(o => w.includes(' ' + o))).map(([n]) => n); }
function finishProve(){
  if(PV.timerInt) clearInterval(PV.timerInt);
  const deler = PSTEG.slice(1), full = deler.map(x => (PV.tekst[x.id] || '').trim()).filter(Boolean).join('\n\n');
  const stegOk = deler.map(x => ({navn:x.navn, ok:x.sjekk.every(c => sjekkOk(PV.tekst[x.id] || '', c))}));
  const typer = [...new Set(['a1','a2','a3'].flatMap(k => argTyper(PV.tekst[k] || '')))];
  const binde = ['for det første','for det andre','for det tredje','i tillegg','på den annen side','derfor','selv om'].filter(b => Wd(full).includes(' ' + b + ' '));
  const ord = full.split(/\s+/).filter(Boolean).length, min = PV.start ? Math.round((Date.now() - PV.start)/60000) : 0;
  const total = [
    ['Alle seks delene er skrevet', deler.every(x => (PV.tekst[x.id] || '').trim())],
    ['Hver del oppfyller sjekklista si', stegOk.every(x => x.ok)],
    ['Minst to ulike argumenttyper i argumentene', typer.length >= 2],
    ['Minst tre bindeord/setningsstartere fra boka', binde.length >= 3],
    ['Minst 250 ord', ord >= 250],
  ];
  const n = total.filter(x => x[1]).length, xp = n*10 + (n === total.length ? 30 : 0);
  S.xp += xp; S.sessions++; record('prove-tekst', n === total.length); markDay();
  S.proveArkiv = [...(S.proveArkiv || []), {dato: dayKey(), tema: PV.tekst.tema, ord, poeng: n}].slice(-10);
  S.proveDraft = null; save(); beep('win'); burst(n === total.length ? 34 : 14);
  app.innerHTML = `<div class="card end"><div class="big">${n === total.length ? '🏆' : '✍️'}</div><h2>${n === total.length ? 'Hele teksten er på plass!' : 'Teksten er ferdig!'}</h2>
      <div class="stat">${ord} ord${min ? ` · ${min} minutter` : ''}</div><div class="stat" style="color:var(--accent)">+${xp} XP</div>
      <ul class="keys" style="text-align:left">${total.map(([l,ok]) => `<li class="${ok ? 'ok' : ''}">${ok ? '✅' : '⬜'} ${esc(l)}</li>`).join('')}</ul>
      <div class="muted" style="text-align:left;font-size:14px">${stegOk.filter(x => !x.ok).length ? 'Deler som kan bli bedre: ' + stegOk.filter(x => !x.ok).map(x => x.navn).join(', ') + '. ' : ''}${typer.length ? 'Argumenttyper jeg ser spor av: ' + typer.join(', ') + '. ' : ''}${binde.length ? 'Bindeord: ' + binde.join(', ') + '.' : ''}</div>
      <p class="muted" style="text-align:left;font-size:14px">Appen sjekker oppbyggingen og ordene, ikke om argumentene er gode eller om teksten er riktig skrevet. Les teksten høyt for deg selv eller for en voksen.</p>
      <details style="width:100%;text-align:left"><summary>Les hele teksten din</summary><div class="model" style="white-space:pre-wrap"><b>${esc(PV.tekst.tema)}</b>\n\n${esc(full)}</div></details>
      <div class="row"><button class="btn primary" id="again">Skriv en ny tekst</button><button class="btn" id="home">Hjem</button></div></div>`;
  $('#again').onclick = renderProve; $('#home').onclick = renderHome; window.scrollTo(0,0);
}

/* ---------- Forside ---------- */
function mastery(t){ const ids = ALL().filter(([,x]) => x.t === t).map(([,x]) => x.id); return ids.length ? Math.round(100 * ids.filter(id => st(id).s >= 1).length / ids.length) : 0; }
function renderHome(){
  const L = levelInfo(), d = daysToTest();
  const cd = d === null ? (K.provetekst || '') : d > 1 ? `⏳ ${d} dager til prøven` : d === 1 ? '⏳ Prøven er i morgen!' : d === 0 ? '🍀 Prøven er i dag. Lykke til!' : '';
  app.innerHTML = `<header class="top"><div class="brand"><a class="icon" href="../" aria-label="Tilbake til faget">←</a> ✍️ Norsk</div>
      <button class="icon" id="snd" aria-label="Lyd av/på">${S.sound ? '🔊' : '🔇'}</button></header>
    <section class="card hero"><div class="muted" style="font-weight:700">${esc(K.tittel)}</div>
      <div class="lvl"><span class="lvlnum">Nivå ${L.l}</span><span class="rank">${L.rank}</span></div>
      <div class="bar"><div style="width:${Math.min(100, 100*L.cur/L.need)}%"></div></div>
      <small class="muted">${S.xp} XP · ${L.need - L.cur} XP til neste nivå</small>
      <div class="pills">${cd ? `<span class="pill hot">${cd}</span>` : ''}</div></section>
    <h2 class="sec">Kort tid? Start her</h2>
    <div class="grid">
      <button class="topic wide" data-topic="mix"><span class="em">🎲</span><b>Blandet: det viktigste</b><small>Begreper, sortering, skriveoppgaver, ⭐ bonus og 👾 sjefsoppgave (ca. 10 min)</small></button>
      <button class="topic" data-topic="begreper"><span class="em">✍️</span><b>Begrepene</b><small>Fagbegrepene fra kurs 5.4, og 🕵️ Hvem er jeg?</small></button>
      <button class="topic" data-topic="prove"><span class="em">📝</span><b>Kortsvar</b><small>5 spørsmål du svarer på med egne ord, uten hint</small></button>
      <button class="topic" data-topic="skriv"><span class="em">🖊️</span><b>Skrivetrening</b><small>Bygg argumenter, møt motargumenter, skriv avsnitt</small></button>
      <button class="topic wide" id="prove"><span class="em">🏁</span><b>Prøvetrening: skriv en hel tekst</b><small>${S.proveDraft ? '✏️ Du har en påbegynt tekst. Trykk for å fortsette.' : 'Steg for steg: innledning, tre argumenter, motargument og avslutning. Med klokke hvis du vil.'}</small></button>
    </div>
    <h2 class="sec">Øv på ett tema</h2>
    <div class="grid">${K.temaer.map(t => `<button class="topic" data-topic="${t.id}"><span class="em">${t.e}</span><b>${esc(t.navn)}</b><small>${esc(t.desc)}</small>
      <div class="bar"><div style="width:${mastery(t.id)}%"></div></div><small>${mastery(t.id)} % riktig minst én gang</small></button>`).join('')}</div>
    <footer><button class="link" id="reset">Nullstill fremgangen i norsk</button></footer>`;
  $('#snd').onclick = () => { S.sound = !S.sound; save(); renderHome(); };
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => startSession(b.dataset.topic));
  $('#prove').onclick = renderProve;
  $('#reset').onclick = () => { if(confirm('Slette all fremgang i norsk?')){ S = JSON.parse(JSON.stringify(DEFAULT)); save(); renderHome(); } };
  window.scrollTo(0,0);
}
renderHome();
</script>
</body>
</html>
