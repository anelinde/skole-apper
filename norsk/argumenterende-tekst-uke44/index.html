<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norsk: argumenterende tekst</title>
<style>
:root{
  --bg:#eff6ff; --card:#ffffff; --ink:#172033; --muted:#5b6478; --line:#bfdbfe; --chip:#dbeafe;
  --brand:#1d4ed8; --brand-ink:#ffffff; --accent:#ff8a3d;
  --ok:#14874a; --okbg:#e3f6ea; --bad:#c93a3a; --badbg:#fde9e9; --near:#b45309; --nearbg:#fff4e5;
  --shadow:0 2px 0 rgba(23,32,51,.07), 0 8px 24px rgba(23,32,51,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1626; --card:#18233a; --ink:#e8eefb; --muted:#9fb0cf; --line:#2b3b5c; --chip:#22304d;
    --brand:#60a5fa; --brand-ink:#0b1220; --accent:#ff9b57;
    --ok:#46d68a; --okbg:#173a28; --bad:#ff7070; --badbg:#3d1d24; --near:#ffb35c; --nearbg:#3a2a14;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{line-height:1.2;margin:0}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--chip);color:var(--ink);min-height:48px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;text-decoration:none;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--chip);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700}
.pill.hot{background:var(--accent);color:#fff}
.big{display:grid;gap:8px;text-align:left;padding:20px;border-radius:20px;border:2px solid var(--brand);background:var(--card);box-shadow:var(--shadow);width:100%}
.big .em{font-size:40px}
.big b{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.tile:hover,.big:hover{border-color:var(--brand)}
.tile .em{font-size:26px}
.tile small{color:var(--muted)}
/* skriving */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
.steps span.now{background:var(--brand);color:var(--brand-ink)}
.steps span.done{background:var(--okbg);color:var(--ok)}
.claim{background:var(--chip);border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:10px}
.learn{border-left:4px solid var(--brand);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 12px;margin:8px 0 12px;font-size:16px}
.learn b{display:block;margin-bottom:2px}
.learn .ex{font-style:italic;color:var(--muted);margin-top:4px}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.starters span{background:var(--chip);border-radius:99px;padding:4px 10px;font-size:14px;font-style:italic}
textarea,input.answer{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:170px;resize:vertical;line-height:1.55}
textarea:focus,input.answer:focus{outline:none;border-color:var(--brand)}
.guard{font-size:14px;color:var(--near);font-weight:700;margin-top:6px}
.guard:empty{display:none}
.coach{margin-top:10px;display:grid;gap:8px}
.coach .q{background:var(--nearbg);border-radius:12px;padding:10px 12px;font-weight:600}
.coach .q::before{content:'💬 '}
.coach .good{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:700}
.coach .info{color:var(--muted);font-size:14px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.types button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px;font-weight:700;font-size:15px;text-align:left}
.types button.sel{border-color:var(--brand);background:var(--chip)}
.planrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.planrow h3{font-size:16px;margin-bottom:6px}
.timer{font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.review .part{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.review .part h3{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.review .part p{white-space:pre-wrap;margin:6px 0}
.review .part.miss{border-color:var(--accent)}
.keys{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.keys li.ok{color:var(--ok);font-weight:700}
.spell .marked{background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.8;white-space:pre-wrap}
.spell mark{background:var(--badbg);color:inherit;border-bottom:3px solid var(--bad);border-radius:3px;padding:0 2px}
.spell ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.spell li{background:var(--bg);border-radius:12px;padding:10px 12px}
.sugg{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:10px;padding:2px 8px;font-weight:800;margin:4px 6px 0 0;display:inline-block}
.model{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:6px}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700;color:var(--brand)}
.hl{margin-bottom:12px}
.hl h3{font-size:17px}
.conf{position:fixed;top:55vh;font-size:28px;pointer-events:none;z-index:10;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-50vh) scale(1.2) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="innhold.js"></script>
<script src="../../felles/stavekontroll.js"></script>
<script>
/* =====================================================================
   NORSK – skriv en argumenterende tekst (Horisonter 9, kurs 5.4)
   Fokus: selve skrivingen. Kunnskapen fra boka vises akkurat når den
   trengs (planlegging → ett avsnitt om gangen → gjennomlesing), og en
   «skrivecoach» stiller spørsmål ut fra det han faktisk skriver.
   ===================================================================== */
const K = window.FAG;
const TYPE = Object.fromEntries(K.argtyper.map(t => [t.id, t]));
const KEY = K.lagringsnokkel;
const DEFAULT = {xp:0, stats:{}, sessions:0, lastDay:null, dayStreak:0, draft:null, arkiv:[], ovelser:{}};
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(r)); }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function record(id, ok){ const x = S.stats[id] || {w:3, s:0, n:0}; x.n++; if(ok) x.s++; S.stats[id] = x; }
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = a => a[Math.floor(Math.random()*a.length)];
function dayKey(d = new Date()){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function markDay(){ const t = dayKey(); if(S.lastDay === t) return; const y = new Date(); y.setDate(y.getDate()-1); S.dayStreak = S.lastDay === dayKey(y) ? S.dayStreak+1 : 1; S.lastDay = t; }
function daysToTest(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(K.provedato + 'T00:00:00') - t)/864e5); }
function burst(n = 18){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<n;i++){ const s = document.createElement('span'); s.className = 'conf'; s.textContent = rnd(['⭐','✨','✍️','💬','🏆']);
    s.style.left = (35 + Math.random()*30) + 'vw'; s.style.setProperty('--dx', (Math.random()*60-30) + 'vw'); s.style.setProperty('--r', (Math.random()*360-180) + 'deg');
    document.body.append(s); setTimeout(() => s.remove(), 1400); } }

/* ---------- Han skriver selv ---------- */
const WRITE_ATTR = 'autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"';
function guardInput(inp, msgEl){
  inp.addEventListener('beforeinput', e => { const t = e.inputType || '';
    if(/^insertFrom(Paste|Drop|Yank)/.test(t) || (e.data && e.data.length > 25)){ e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Skriv selv. På prøven skriver du for hånd!'; } });
  inp.addEventListener('paste', e => { e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Innliming er skrudd av. Skriv selv!'; });
}

/* ---------- Tekstanalyse ---------- */
const Wd = t => ' ' + t.toLowerCase().replace(/[.,!?;:"«»()…]/g,' ').replace(/\s+/g,' ').trim() + ' ';
const has = (t, list) => { const w = Wd(t); return list.some(x => w.includes(' ' + x + ' ') || (x.length > 6 && w.includes(x))); };
const sentences = t => t.split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(x => x.split(/\s+/).length >= 3);
const words = t => t.trim().split(/\s+/).filter(Boolean).length;
const BEGRUNN = ['fordi','siden','ettersom','derfor','på grunn av','det er fordi','for det','grunnen er','dette betyr','det fører til','som gjør at'];
const EKSEMPEL = ['for eksempel','blant annet','f.eks','eksempel','som når','tenk deg','jeg har selv','jeg har opplevd','da jeg'];
const MOT = ['noen mener','andre mener','på den annen side','selv om','riktignok','mange vil si','noen vil si','kritikere','motargument','en kan hevde'];
const SVAR = ['men','likevel','allikevel','imidlertid','uansett','derfor'];
const AVS = ['derfor','tenk derfor','kanskje','alt i alt','til slutt','konklusjon','avslutningsvis'];
const STAND = ['jeg mener','jeg synes','jeg tror','bør','burde','må','mener'];
const USAKLIG = ['dust','idiot','teit','dum','dumme','dumt','tullinger','skjønner ingenting','skjønner jo ingenting','latterlig','hjernedød'];
const STOP = new Set('og i på er at det en et som for til av med har de den ikke vi jeg du han hun seg sin sitt sine om kan skal vil bør må så men eller når fra alle mange være blir ble mer mest'.split(' '));
function argTyper(t){ const w = Wd(t); return Object.entries(K.typeOrd).filter(([,ord]) => ord.some(o => w.includes(' ' + o))).map(([n]) => n); }
const typeIdByName = n => K.argtyper.find(t => t.navn === n)?.id;
function sharedWords(a, b){ const A = new Set(a.toLowerCase().match(/\p{L}{4,}/gu) || []); return (b.toLowerCase().match(/\p{L}{4,}/gu) || []).filter(w => A.has(w) && !STOP.has(w)).length; }

/* ---------- Stavekontroll ---------- */
const STAVE_EKSTRA = [...new Set([...K.huskelapp.flatMap(h => (h.tekst + ' ' + h.eks).split(/[^\p{L}-]+/u)), ...K.argtyper.flatMap(t => (t.navn + ' ' + t.hva).split(/[^\p{L}-]+/u))].map(w => w.toLowerCase()).filter(w => w.length > 1))];
async function staveBoks(text, box){
  if(!box || !text.trim()) return;
  box.innerHTML = '<p class="muted">🔍 Sjekker stavingen …</p>';
  let sk; try{ sk = await Stavekontroll.last('../../felles/'); }catch(e){ box.innerHTML = '<p class="muted">Fikk ikke lastet stavekontrollen (er du på nett?).</p>'; return; }
  if(!box.isConnected) return;
  const feil = sk.sjekk(text, STAVE_EKSTRA);
  if(!feil.length){ box.innerHTML = '<p style="color:var(--ok);font-weight:700">✅ Fant ingen stavefeil.</p>'; return; }
  let html = '', pos = 0;
  feil.forEach(f => { html += esc(text.slice(pos, f.offset)) + `<mark>${esc(text.substr(f.offset, f.length))}</mark>`; pos = f.offset + f.length; });
  html += esc(text.slice(pos));
  box.innerHTML = `<div class="spell"><b>🔍 ${feil.length} mulig${feil.length > 1 ? 'e' : ''} stavefeil</b><div class="marked">${html}</div>
    <ul>${feil.map(f => `<li><b style="color:var(--bad)">${esc(f.ord)}</b> · ${esc(f.grunn)}${f.forslag.length ? '<br>Forslag: ' + f.forslag.map(r => `<span class="sugg">${esc(r)}</span>`).join('') : ''}</li>`).join('')}</ul></div>`;
}

/* =====================================================================
   SKRIVECOACH: spørsmål ut fra det han skriver (ingen fasit)
   ===================================================================== */
function coachAvsnitt(t, planType){
  const out = [], ss = sentences(t);
  if(!t.trim()) return [{info:'Start med temasetningen: én setning med påstanden din.'}];
  if(ss.length >= 1) out.push({info:`Temasetningen din: «${ss[0]}»`});
  if(ss.length < 2) out.push({q:'Hvorfor mener du det? Skriv en kommentarsetning som begrunner påstanden, for eksempel «Det er fordi …».'});
  else {
    if(!has(t, BEGRUNN)) out.push({q:'Hvorfor er det sånn? Forklar med «fordi», «derfor» eller «det fører til at …».'});
    if(!has(t, EKSEMPEL) && argTyper(t).length === 0) out.push({q:'Kan du gi et eksempel? Boka: eksempler kan bygge på erfaringer, eller du kan vise til fakta, forskning og statistikk.'});
    if(planType){ const T = TYPE[planType], seen = argTyper(t).map(typeIdByName);
      if(!seen.includes(planType)) out.push({q:`Du planla et ${T.navn.toLowerCase()}. Det ${T.hva.charAt(0).toLowerCase() + T.hva.slice(1)} Prøv for eksempel: «${T.start[0]}»`}); }
    if(ss.length < 3) out.push({q:'Skriv én kommentarsetning til. Utdyp eller forklar mer.'});
  }
  if(has(t, USAKLIG)) out.push({q:'Saklighetspyramiden: nedsettende ord om andre er nederste trinn. Argumenter om saken, ikke om personen.'});
  if(!out.some(o => o.q) && ss.length >= 3) out.push({good:'Bra avsnitt! Påstand og begrunnelser er på plass.'});
  const ty = argTyper(t); if(ty.length) out.push({info:'Argumenttype jeg ser spor av: ' + ty.join(', ')});
  return out;
}
function coachInn(t, pastand){
  const out = [], ss = sentences(t);
  if(!t.trim()) return [{info:'Presenter saken og si hva du mener.'}];
  if(ss.length < 2) out.push({q:'Skriv minst to setninger: først hva saken handler om, så hva du mener.'});
  if(!has(t, STAND)) out.push({q:'Kommer standpunktet ditt tydelig fram? Boka: «Vær overbevisende, få tydelig fram ditt standpunkt.» Prøv «Jeg mener at …».'});
  if(ss.length >= 2 && has(t, STAND)) out.push({good:'Leseren vet hva saken er og hva du mener.'});
  return out;
}
function coachMot(t){
  const out = [], ss = sentences(t);
  if(!t.trim()) return [{info:'Hva ville noen som er uenig, sagt? Skriv det, og svar på det.'}];
  if(!has(t, MOT)) out.push({q:'Vis at det er motargumentet: «På den annen side …», «Noen mener at …», «Selv om det kanskje …».'});
  if(!has(t, SVAR) || ss.length < 2) out.push({q:'Svar på motargumentet: hvorfor holder du likevel fast på standpunktet ditt? «Men …», «Likevel …».'});
  if(!out.length) out.push({good:'Du legger fram motargumentet og avviser det. Det viser at du har tenkt gjennom saken.'});
  return out;
}
function coachAvs(t, pastand){
  const out = [];
  if(!t.trim()) return [{info:'Avslutt med å gjenta standpunktet ditt kort.'}];
  if(!has(t, AVS)) out.push({q:'Vis at teksten slutter: «Derfor tror jeg at …», «Tenk derfor over …».'});
  if(sharedWords(t, pastand) < 1) out.push({q:`Gjenta standpunktet ditt med egne ord. Påstanden din var: «${pastand}»`});
  if(sentences(t).length < 2) out.push({q:'Skriv én setning til, for eksempel en oppfordring til leseren.'});
  if(!out.length) out.push({good:'God avslutning: standpunktet kommer tydelig fram igjen.'});
  return out;
}
// Viser bare ETT spørsmål om gangen (det viktigste først), så det ikke blir for mye
function drawCoach(box, list){
  const qs = list.filter(o => o.q), rest = list.filter(o => !o.q);
  const shown = [...rest.filter(o => o.info && !/^Argumenttype/.test(o.info)), ...(qs.length ? [qs[0]] : rest.filter(o => o.good)), ...rest.filter(o => o.info && /^Argumenttype/.test(o.info))];
  box.innerHTML = shown.map(o => o.q ? `<div class="q">${esc(o.q)}</div>` : o.good ? `<div class="good">✅ ${esc(o.good)}</div>` : `<div class="info">${esc(o.info)}</div>`).join('')
    + (qs.length > 1 ? `<div class="info">Når du har fikset dette, kommer neste tips (${qs.length - 1} til).</div>` : '');
}

/* =====================================================================
   SKRIV EN TEKST: sak → plan → innledning → 3 argumenter → motargument → avslutning → les gjennom
   ===================================================================== */
const STEG = ['Sak','Plan','Innledning','Argument 1','Argument 2','Argument 3','Motargument','Avslutning','Les gjennom'];
const DEL = {2:'inn', 3:'a1', 4:'a2', 5:'a3', 6:'mot', 7:'avs'};
let D = null;
function startTekst(){ if(!S.draft) S.draft = {steg:0, sak:'', pastand:'', plan:{a1:{s:'',t:''}, a2:{s:'',t:''}, a3:{s:'',t:''}, mot:''}, tekst:{}, tid:0, start:null}; D = S.draft; save(); drawTekst(); }
function shell(){
  app.innerHTML = `<div class="top"><button class="icon" id="quit" aria-label="Til forsiden">✕</button><span class="timer" id="ptime"></span></div>
    <div class="steps">${STEG.map((n,k) => `<span class="${k === D.steg ? 'now' : k < D.steg ? 'done' : ''}">${n}</span>`).join('')}</div>
    <div class="card" id="task"></div>`;
  $('#quit').onclick = () => { save(); renderHome(); };
  if(D.tid && D.start){ const tick = () => { const el = $('#ptime'); if(!el) return clearInterval(iv);
    const left = Math.max(0, D.tid*60 - Math.round((Date.now() - D.start)/1000)); el.textContent = '⏱ ' + Math.floor(left/60) + ':' + String(left%60).padStart(2,'0'); el.classList.toggle('low', left <= 300); };
    const iv = setInterval(tick, 1000); tick(); }
  window.scrollTo(0,0);
  return $('#task');
}
const go = n => { D.steg = n; save(); drawTekst(); };
function drawTekst(){
  const el = shell();
  if(D.steg === 0){
    el.innerHTML = `<h3>1. Velg sak</h3>
      <div class="learn"><b>Påstand</b>${esc('En påstand er noe som påstås, uten at det er begrunnet. Den blir standpunktet ditt – det du skal overbevise leseren om.')}</div>
      <div class="starters">${K.temaForslag.map((t,i) => `<span data-i="${i}" style="cursor:pointer">${esc(t)}</span>`).join('')}</div>
      <input class="answer" id="pa" ${WRITE_ATTR} placeholder="Skriv påstanden din, f.eks. «Alle skoler bør være mobilfrie.»" value="${esc(D.pastand)}"><div class="guard"></div>
      <div class="row"><span class="muted">Skrive på tid, som på prøven?</span>${[[0,'Nei'],[45,'45 min'],[60,'60 min'],[90,'90 min']].map(([m,n]) => `<button class="btn ${D.tid === m ? 'primary' : 'ghost'}" data-m="${m}" style="min-height:40px;padding:8px 12px">${n}</button>`).join('')}</div>
      <div class="row"><span style="flex:1"></span><button class="btn primary" id="nx">Planlegg ➜</button></div>`;
    const inp = $('#pa'); guardInput(inp, el.querySelector('.guard'));
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { inp.value = K.temaForslag[+b.dataset.i]; });
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { D.tid = +b.dataset.m; save(); drawTekst(); $('#pa').value = inp.value; });
    $('#nx').onclick = () => { if(words(inp.value) < 3) return inp.focus(); D.pastand = inp.value.trim(); if(!D.start) D.start = Date.now(); go(1); };
    return;
  }
  if(D.steg === 1){
    const typeChips = k => `<div class="types">${K.argtyper.map(t => `<button data-k="${k}" data-t="${t.id}" class="${D.plan[k].t === t.id ? 'sel' : ''}">${t.e} ${t.navn}</button>`).join('')}</div><div class="learn" id="tl-${k}" ${D.plan[k].t ? '' : 'hidden'}></div>`;
    el.innerHTML = `<h3>2. Planlegg (stikkord holder)</h3><div class="claim">«${esc(D.pastand)}»</div>
      <div class="learn"><b>Bruk ulike typer argumenter (s. 221)</b>Skriv stikkord for tre argumenter, og velg hvilken type hvert argument er. Det gjør teksten mer overbevisende.</div>
      ${['a1','a2','a3'].map((k,i) => `<div class="planrow"><h3>Argument ${i+1}</h3><input class="answer" data-p="${k}" ${WRITE_ATTR} placeholder="Stikkord …" value="${esc(D.plan[k].s)}">${typeChips(k)}</div>`).join('')}
      <div class="planrow"><h3>Motargument</h3><div class="muted" style="font-size:15px;margin-bottom:6px">Hva ville noen som er uenig, sagt?</div><input class="answer" data-p="mot" ${WRITE_ATTR} placeholder="Stikkord …" value="${esc(D.plan.mot)}"></div>
      <div class="coach" id="pc"></div>
      <div class="row"><button class="btn ghost" id="pv">← Tilbake</button><span style="flex:1"></span><button class="btn primary" id="nx">Skriv innledningen ➜</button></div>`;
    const showType = k => { const t = TYPE[D.plan[k].t], box = $('#tl-' + k); if(!t) return box.hidden = true; box.hidden = false;
      box.innerHTML = `<b>${t.e} ${t.navn}</b>${esc(t.hva)} ${esc(t.styrke)}<div class="ex">Eksempel fra boka: ${esc(t.eks)}</div>`; };
    const pcoach = () => { const ty = ['a1','a2','a3'].map(k => D.plan[k].t).filter(Boolean), uniq = new Set(ty).size, list = [];
      if(ty.length === 3 && uniq < 2) list.push({q:'Alle argumentene er samme type. Boka anbefaler ulike typer argumenter. Kan ett av dem bli en annen type?'});
      if(ty.length === 3 && uniq >= 2) list.push({good:`Du har ${uniq} ulike argumenttyper. Bra!`});
      if(!D.plan.mot.trim()) list.push({info:'Tips: tenk ut motargumentet nå, så er det lettere å svare på det senere.'});
      drawCoach($('#pc'), list); };
    el.querySelectorAll('[data-p]').forEach(i => { guardInput(i, null); i.oninput = () => { const k = i.dataset.p; if(k === 'mot') D.plan.mot = i.value; else D.plan[k].s = i.value; save(); pcoach(); }; });
    el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const k = b.dataset.k; D.plan[k].t = b.dataset.t; save();
      el.querySelectorAll(`[data-k="${k}"]`).forEach(x => x.classList.toggle('sel', x === b)); showType(k); pcoach(); });
    ['a1','a2','a3'].forEach(showType); pcoach();
    $('#pv').onclick = () => go(0);
    $('#nx').onclick = () => { if(['a1','a2','a3'].some(k => !D.plan[k].s.trim())) { drawCoach($('#pc'), [{q:'Skriv stikkord for alle tre argumentene først.'}]); return; } go(2); };
    return;
  }
  if(D.steg >= 2 && D.steg <= 7){
    const k = DEL[D.steg], st = K.setningsstartere;
    const meta = {
      inn:{t:'3. Innledning', learn:['Innledningen','Presenter saken og få tydelig fram standpunktet ditt.'], start:st.inn, coach:t => coachInn(t, D.pastand)},
      a1:{t:'4. Argument 1', learn:['Ett avsnitt = ett argument (s. 220)','Start med temasetningen (påstanden). Skriv så kommentarsetninger med begrunnelser: beskriv, forklar, utdyp og kom med eksempler.'], start:st.hoved, coach:t => coachAvsnitt(t, D.plan.a1.t), plan:D.plan.a1},
      a2:{t:'5. Argument 2', learn:['Nytt avsnitt, nytt argument','Temasetning først, så begrunnelser.'], start:st.hoved, coach:t => coachAvsnitt(t, D.plan.a2.t), plan:D.plan.a2},
      a3:{t:'6. Argument 3', learn:['Det tredje argumentet','Temasetning først, så begrunnelser.'], start:st.hoved, coach:t => coachAvsnitt(t, D.plan.a3.t), plan:D.plan.a3},
      mot:{t:'7. Motargument', learn:['Legg fram motargumentet selv (s. 217)','Det viser at du har tenkt godt gjennom saken, og kan skape tillit. Skriv motargumentet, og svar på det.'], start:st.mot, coach:coachMot, planTxt:D.plan.mot},
      avs:{t:'8. Avslutning', learn:['Avslutningen','Gjenta standpunktet kort, gjerne med en oppfordring til leseren.'], start:st.avs, coach:t => coachAvs(t, D.pastand)},
    }[k];
    const T = meta.plan && TYPE[meta.plan.t];
    el.innerHTML = `<h3>${meta.t}</h3><div class="claim">«${esc(D.pastand)}»</div>
      ${meta.plan ? `<div class="learn"><b>Planen din: ${esc(meta.plan.s)}${T ? ` · ${T.e} ${T.navn}` : ''}</b>${T ? `${esc(T.hva)}<div class="ex">Bokas eksempel: ${esc(T.eks)}</div>` : ''}</div>` : ''}
      ${meta.planTxt ? `<div class="learn"><b>Planen din: ${esc(meta.planTxt)}</b></div>` : ''}
      <div class="learn"><b>${esc(meta.learn[0])}</b>${esc(meta.learn[1])}</div>
      <div class="starters">${(T ? [...T.start, ...meta.start.slice(0,3)] : meta.start).map(x => `<span>${esc(x)}</span>`).join('')}</div>
      <textarea id="txt" ${WRITE_ATTR} placeholder="Skriv her …">${esc(D.tekst[k] || '')}</textarea><div class="guard"></div>
      <div class="coach" id="cc"></div><div id="stave"></div>
      <div class="row"><button class="btn ghost" id="pv">← Tilbake</button><button class="btn ghost" id="sp">🔍 Staving</button><span style="flex:1"></span><button class="btn primary" id="nx">${D.steg < 7 ? 'Neste ➜' : 'Les gjennom ➜'}</button></div>`;
    const ta = $('#txt'); guardInput(ta, el.querySelector('.guard')); ta.focus();
    let tm; const upd = () => { D.tekst[k] = ta.value; save(); clearTimeout(tm); tm = setTimeout(() => drawCoach($('#cc'), meta.coach(ta.value)), 500); };
    ta.addEventListener('input', upd); drawCoach($('#cc'), meta.coach(ta.value));
    $('#pv').onclick = () => go(D.steg - 1);
    $('#sp').onclick = () => staveBoks(ta.value, $('#stave'));
    $('#nx').onclick = () => { if(words(ta.value) < 6) return ta.focus(); go(D.steg + 1); };
    return;
  }
  // Les gjennom
  const parts = [['inn','Innledning',t => coachInn(t, D.pastand)],['a1','Argument 1',t => coachAvsnitt(t, D.plan.a1.t)],['a2','Argument 2',t => coachAvsnitt(t, D.plan.a2.t)],['a3','Argument 3',t => coachAvsnitt(t, D.plan.a3.t)],['mot','Motargument',coachMot],['avs','Avslutning',t => coachAvs(t, D.pastand)]];
  const full = parts.map(([k]) => (D.tekst[k] || '').trim()).filter(Boolean).join('\n\n');
  const typer = [...new Set(['a1','a2','a3'].flatMap(k => argTyper(D.tekst[k] || '')))];
  const binde = ['for det første','for det andre','for det tredje','i tillegg','på den annen side','derfor','selv om','likevel'].filter(b => Wd(full).includes(' ' + b + ' '));
  const total = [['Alle seks delene er skrevet', parts.every(([k]) => (D.tekst[k] || '').trim())],['Ulike argumenttyper (minst to)', typer.length >= 2],['Bindeord/setningsstartere fra boka (minst tre)', binde.length >= 3],['Saklig: ingen nedsettende ord', !has(full, USAKLIG)],['Minst 250 ord', words(full) >= 250]];
  el.innerHTML = `<h3>9. Les gjennom teksten din</h3>
    <div class="learn"><b>Les teksten høyt for deg selv</b>Gjør den overbevisende? Henger avsnittene sammen? Trykk «Endre» for å gå tilbake til en del.</div>
    <div class="review"><div class="claim">«${esc(D.pastand)}»</div>
    ${parts.map(([k,n,c], i) => { const qs = c(D.tekst[k] || '').filter(o => o.q);
      return `<div class="part ${qs.length ? 'miss' : ''}"><h3><span>${n}</span><button class="btn ghost" data-go="${i+2}" style="min-height:34px;padding:4px 10px;font-size:14px">Endre</button></h3><p>${esc(D.tekst[k] || '(ikke skrevet)')}</p>
        ${qs.length ? `<div class="coach">${qs.map(o => `<div class="q">${esc(o.q)}</div>`).join('')}</div>` : '<div class="coach"><div class="good">✅ Ser bra ut</div></div>'}</div>`; }).join('')}</div>
    <ul class="keys">${total.map(([l,ok]) => `<li class="${ok ? 'ok' : ''}">${ok ? '✅' : '⬜'} ${esc(l)}</li>`).join('')}</ul>
    <div class="muted" style="font-size:14px">${words(full)} ord${typer.length ? ' · argumenttyper: ' + typer.join(', ') : ''}${binde.length ? ' · bindeord: ' + binde.join(', ') : ''}</div>
    <div id="stave" style="margin-top:10px"></div>
    <p class="muted" style="font-size:14px">Appen ser på oppbyggingen og ordene, ikke på om argumentene er gode. Les gjerne teksten for en voksen.</p>
    <div class="row"><span style="flex:1"></span><button class="btn primary" id="lever">Lever teksten ✓</button></div>`;
  el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
  staveBoks(full, $('#stave'));
  $('#lever').onclick = () => {
    const n = total.filter(x => x[1]).length, xp = 20 + n*10;
    S.xp += xp; S.sessions++; record('tekst', n === total.length); markDay();
    S.arkiv = [{dato:new Date().toLocaleDateString('no-NO'), pastand:D.pastand, tekst:full, ord:words(full), poeng:n, av:total.length}, ...S.arkiv].slice(0, 20);
    S.draft = null; save(); burst(n === total.length ? 34 : 16);
    app.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:64px">${n === total.length ? '🏆' : '✍️'}</div><h2>Teksten er levert!</h2>
      <p>${words(full)} ord · ${n} av ${total.length} punkter · <b style="color:var(--accent)">+${xp} XP</b></p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="ny">Skriv en ny tekst</button><button class="btn" id="hj">Til forsiden</button></div></div>`;
    $('#ny').onclick = startTekst; $('#hj').onclick = renderHome;
  };
}

/* =====================================================================
   KORTE SKRIVEØVELSER (ett avsnitt) – samme coach-tenkning
   ===================================================================== */
const OVGRUPPER = [['Bygg et argument','a','💪'],['Møt motargumentet','m','⚖️'],['Skriv et avsnitt','v','🧱'],['Gjør det saklig','u','🤝'],['Drøft','d','🤔'],['Setningsstartere','t','🔤']];
function renderOvelse(prefix){
  const pool = K.skriv.filter(w => w.id.startsWith(prefix)), w = pool.slice().sort((a,b) => (S.ovelser[a.id]||0) - (S.ovelser[b.id]||0))[0];
  app.innerHTML = `<div class="top"><button class="icon" id="quit" aria-label="Tilbake">✕</button></div>
    <div class="card"><h3>${esc(w.tittel)}</h3><div class="claim" style="margin-top:8px">${esc(w.gitt)}</div>
      <div class="learn"><b>Oppgave</b>${esc(w.oppgave)}</div>
      <textarea id="txt" ${WRITE_ATTR} placeholder="Skriv her …"></textarea><div class="guard"></div>
      <ul class="keys" id="live"></ul><div id="res"></div><div id="stave"></div>
      <div class="row"><button class="btn ghost" id="mod">💡 Bokas eksempel</button><span style="flex:1"></span><button class="btn primary" id="ok">Ferdig ✓</button></div></div>`;
  const ta = $('#txt'); guardInput(ta, $('.guard')); ta.focus();
  const chk = c => { const [, type, arg] = c, w2 = Wd(ta.value);
    if(type === 'ord') return words(ta.value) >= arg; if(type === 'setn') return sentences(ta.value).length >= arg; if(type === 'spm') return (ta.value.match(/\?/g) || []).length >= arg;
    if(type === 'noen') return has(ta.value, arg.map(x => x.toLowerCase())); if(type === 'ikke') return ta.value.trim() && !has(ta.value, arg); if(type === 'start') return w2.startsWith(Wd(arg).trimEnd()); return false; };
  const draw = () => { $('#live').innerHTML = w.sjekk.map(c => { const ok = chk(c); return `<li class="${ok ? 'ok' : ''}">${ok ? '✅' : '⬜'} ${esc(c[0])}</li>`; }).join(''); };
  ta.addEventListener('input', draw); draw();
  $('#quit').onclick = renderHome;
  $('#mod').onclick = () => { $('#res').innerHTML = `<div class="model">${esc(w.modell)}</div>`; };
  $('#ok').onclick = () => { if(words(ta.value) < 4) return ta.focus();
    const n = w.sjekk.filter(chk).length, all = n === w.sjekk.length; ta.disabled = true;
    S.ovelser[w.id] = (S.ovelser[w.id] || 0) + 1; S.xp += n*3 + (all ? 5 : 0); S.sessions++; record(w.id, all); markDay(); save();
    $('#res').innerHTML = `<div class="${all ? 'coach' : ''}"><div class="${all ? 'good' : 'q'}" style="border-radius:12px;padding:10px 12px;background:${all ? 'var(--okbg)' : 'var(--nearbg)'}">${all ? '✅ Alle punktene er med!' : `${n} av ${w.sjekk.length} punkter. Se hva som mangler.`}</div></div><div class="model">${esc(w.modell)}</div>`;
    staveBoks(ta.value, $('#stave'));
    $('#ok').textContent = 'Ny øvelse ➜'; $('#ok').onclick = () => renderOvelse(prefix); };
}

/* =====================================================================
   HUSKELAPP
   ===================================================================== */
function renderHuskelapp(){
  app.innerHTML = `<div class="top"><button class="icon" id="quit" aria-label="Tilbake">←</button><b style="font-size:20px">📖 Huskelapp</b><span></span></div>
    ${K.huskelapp.map(h => `<div class="card hl"><h3>${esc(h.tittel)} <span class="muted" style="font-weight:400;font-size:14px">(${h.side})</span></h3><p style="margin:6px 0">${esc(h.tekst)}</p>${h.eks ? `<div class="model">${esc(h.eks)}</div>` : ''}</div>`).join('')}
    <div class="card hl"><h3>Argumenttyper <span class="muted" style="font-weight:400;font-size:14px">(s. 218)</span></h3>
      ${K.argtyper.map(t => `<p style="margin:8px 0"><b>${t.e} ${t.navn}:</b> ${esc(t.hva)}<br><i class="muted">${esc(t.eks)}</i></p>`).join('')}</div>
    <div class="card hl"><h3>Setningsstartere <span class="muted" style="font-weight:400;font-size:14px">(s. 221)</span></h3>
      ${[['Innledning','inn'],['Hoveddel','hoved'],['Motargument','mot'],['Avslutning','avs']].map(([n,k]) => `<p style="margin:6px 0"><b>${n}:</b> ${K.setningsstartere[k].map(esc).join(' · ')}</p>`).join('')}</div>`;
  $('#quit').onclick = renderHome; window.scrollTo(0,0);
}

/* =====================================================================
   FORSIDE
   ===================================================================== */
function renderHome(){
  const d = daysToTest(), cd = d > 1 ? `⏳ ${d} dager til prøven` : d === 1 ? '⏳ Prøven er i morgen!' : d === 0 ? '🍀 Prøven er i dag. Lykke til!' : '';
  app.innerHTML = `<header class="top"><div class="brand"><a class="icon" href="../" aria-label="Tilbake til faget">←</a> ✍️ Norsk</div>${cd ? `<span class="pill hot">${cd}</span>` : ''}</header>
    <p class="muted" style="margin:0 0 14px">Argumenterende tekst · Horisonter 9, kurs 5.4 · ⭐ ${S.xp} XP</p>
    <button class="big" id="skriv"><span class="em">✍️</span><b>${S.draft ? 'Fortsett teksten din' : 'Skriv en argumenterende tekst'}</b>
      <span class="muted">${S.draft ? `«${esc(S.draft.pastand || 'ny tekst')}» · steg ${S.draft.steg+1} av ${STEG.length}` : 'Velg sak → planlegg → skriv ett avsnitt om gangen. Du får hjelp fra boka og spørsmål underveis.'}</span></button>
    ${S.draft ? '<button class="btn ghost" id="forkast" style="margin-top:8px;min-height:38px;font-size:14px">Start på nytt med en annen sak</button>' : ''}
    <h2 class="sec">Korte skriveøvelser (ett avsnitt)</h2>
    <div class="grid">${OVGRUPPER.map(([n,p,e]) => `<button class="tile" data-ov="${p}"><span class="em">${e}</span><b>${n}</b><small>${K.skriv.filter(w => w.id.startsWith(p)).filter(w => S.ovelser[w.id]).length} av ${K.skriv.filter(w => w.id.startsWith(p)).length} gjort</small></button>`).join('')}</div>
    <h2 class="sec">Slå opp</h2>
    <div class="grid"><button class="tile" id="hl"><span class="em">📖</span><b>Huskelapp</b><small>Det viktigste fra kurs 5.4</small></button></div>
    ${S.arkiv.length ? `<h2 class="sec">Tekstene dine</h2>${S.arkiv.map((a,i) => `<details class="card" style="margin-bottom:8px"><summary>${esc(a.pastand)} <span class="muted" style="font-weight:400">· ${a.dato} · ${a.ord} ord</span></summary><div class="model" style="white-space:pre-wrap">${esc(a.tekst)}</div></details>`).join('')}` : ''}`;
  $('#skriv').onclick = startTekst;
  if($('#forkast')) $('#forkast').onclick = () => { if(confirm('Slette den påbegynte teksten og starte på nytt?')){ S.draft = null; save(); renderHome(); } };
  app.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => renderOvelse(b.dataset.ov));
  $('#hl').onclick = renderHuskelapp;
  window.scrollTo(0,0);
}
renderHome();
</script>
</body>
</html>
