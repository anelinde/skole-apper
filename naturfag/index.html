<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naturfag</title>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --ink:#1f1b3a; --muted:#6b6790; --line:#e4e0f5; --brand:#6c4cf1;
  --shadow:0 2px 0 rgba(31,27,58,.08), 0 8px 24px rgba(31,27,58,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14122a; --card:#1f1c3b; --ink:#f1efff; --muted:#a8a3cc; --line:#34305a; --brand:#8f74ff;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
.back{color:var(--brand);font-weight:700;text-decoration:none}
.card{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:32px 20px;text-align:center}
.em{font-size:72px;line-height:1}
h1{margin:12px 0 6px}
p{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Alle fag</a>
  <div class="card">
    <div class="em">🔬</div>
    <h1>Naturfag</h1>
    <p>Kommer snart! Appen lages når pensum er klart.</p>
  </div>
</main>
</body>
</html>
