<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naturfag</title>
<style>
:root{
  --bg:#f2f7f5; --card:#ffffff; --ink:#15302a; --muted:#5d746e; --line:#dbe7e3; --chip:#e4f1ed;
  --brand:#0f8a6c; --brand-ink:#ffffff; --accent:#ff8a3d;
  --ok:#14874a; --okbg:#e3f6ea; --bad:#c93a3a; --badbg:#fde9e9; --near:#b45309; --nearbg:#fff4e5;
  --shadow:0 2px 0 rgba(21,48,42,.07), 0 8px 24px rgba(21,48,42,.06);
  --fig-a:#8fb8ff; --fig-b:#ffd59a; --fig-c:#c9b6ff; --fig-d:#a6e3b8; --fig-e:#ffb3b3; --fig-line:#4b5d58;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1a18; --card:#172623; --ink:#e8f4f0; --muted:#9db5ae; --line:#2a3f3a; --chip:#203531;
    --brand:#2bb894; --brand-ink:#06201a; --accent:#ff9b57;
    --ok:#46d68a; --okbg:#173a28; --bad:#ff7070; --badbg:#3d1d24; --near:#ffb35c; --nearbg:#3a2a14;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --fig-a:#5a86cc; --fig-b:#b8924f; --fig-c:#7f6bc0; --fig-d:#4f9a68; --fig-e:#b86a6a; --fig-line:#c7d6d2;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:16px 16px 150px}
h1,h2,h3{line-height:1.2;margin:0}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row.end{justify-content:flex-end}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--chip);color:var(--ink);min-height:48px}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.primary:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;text-decoration:none;color:inherit}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:22px;display:flex;align-items:center;gap:10px}
.hero{display:grid;gap:10px}
.lvl{display:flex;align-items:baseline;gap:10px}
.lvlnum{font-size:28px;font-weight:800}
.rank{font-weight:700;color:var(--brand)}
.bar{height:14px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px;transition:width .5s}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:15px;font-weight:600}
.pill.hot{background:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.topic{display:grid;gap:6px;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.topic:hover{border-color:var(--brand)}
.topic .em{font-size:30px}
.topic b{font-size:18px}
.topic small{color:var(--muted);font-size:14px}
.topic .bar{height:8px;margin-top:4px}
.topic.wide{grid-column:1/-1}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.medal{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.medal .e{font-size:26px}
.medal.locked{opacity:.4;filter:grayscale(1)}
.medal b{display:block;font-size:14px}
footer{margin-top:32px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}

.sbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sbar .bar{flex:1}
.combo{font-weight:800;min-width:56px;text-align:right}
.combo.on{color:var(--accent)}
.task{min-height:300px}
.q-label{color:var(--muted);font-weight:600;font-size:15px;margin-bottom:8px}
.q-big{font-size:26px;font-weight:800;margin:6px 0 18px}
.q-text{font-size:20px;font-weight:700;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;min-height:54px}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.explain{margin-top:12px;background:var(--bg);border-radius:14px;padding:12px 14px}

/* Begrepskort */
.flash{text-align:center;padding:20px 8px}
.flash .term{font-size:32px;font-weight:800;margin:10px 0}
.flash .answer{font-size:19px;background:var(--bg);border-radius:14px;padding:14px;margin-top:14px;text-align:left}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rate .btn{padding:12px 6px;font-size:15px}

/* Forklar */
textarea{width:100%;min-height:170px;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--brand)}
textarea:disabled{opacity:.85}
.tip{font-size:14px;color:var(--muted);margin-top:6px}
.guard{font-size:14px;color:var(--near);font-weight:700;margin-top:6px}
.guard:empty{display:none}
input.answer{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.answer:focus{outline:none;border-color:var(--brand)}
input.answer.right{border-color:var(--ok);background:var(--okbg)}
input.answer.wrong{border-color:var(--bad);background:var(--badbg)}
.startline{font-size:20px;font-weight:800;margin:6px 0 10px}
.blank{display:inline-block;min-width:110px;border-bottom:3px solid var(--brand);margin:0 4px}
.glist{display:grid;gap:8px}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.gitem b{font-size:17px}
.gitem .st{float:right;font-size:14px}
.concepts{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.concepts li{display:flex;gap:8px;align-items:flex-start}
.concepts li.done{color:var(--ok);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--chip);border-radius:99px;padding:5px 11px;font-size:15px;font-weight:600}
.model{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:6px}
details{margin:10px 0}
summary{cursor:pointer;font-weight:700;color:var(--brand)}
.score{font-size:20px;font-weight:800;margin-top:10px}
.spell{margin-top:12px}
.spell .marked{background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.8;white-space:pre-wrap}
.spell mark{background:var(--badbg);color:inherit;border-bottom:3px solid var(--bad);border-radius:3px;padding:0 2px}
.spell ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.spell li{background:var(--bg);border-radius:12px;padding:10px 12px}
.sugg{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:10px;padding:4px 10px;font-weight:800;margin:4px 6px 0 0}

/* Rekkefølge */
.steps{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px;counter-reset:s}
.steps li button,.bank button{width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:600;min-height:52px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:center}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800}
.steps li.right button{border-color:var(--ok);background:var(--okbg)}
.steps li.wrong button{border-color:var(--bad);background:var(--badbg)}
.steps:empty::after{content:'Trykk på stegene under i riktig rekkefølge';color:var(--muted);display:block;border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center}
.bank{display:grid;gap:8px}
.bank button:hover{border-color:var(--brand)}

/* Sorter */
.sortcard{font-size:22px;font-weight:800;text-align:center;background:var(--bg);border-radius:16px;padding:26px 14px;margin:8px 0 14px;transition:background .2s}
.sortcard.right{background:var(--okbg);color:var(--ok)}
.sortcard.wrong{background:var(--badbg);color:var(--bad)}
.buckets{display:grid;gap:10px}
.buckets.n2{grid-template-columns:1fr 1fr}
.buckets .btn{min-height:64px;font-size:16px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots span.ok{background:var(--ok)}
.dots span.bad{background:var(--bad)}

/* Likning */
.eq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-weight:800;font-size:18px}
.slot{min-width:92px;min-height:48px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;padding:6px 10px;background:var(--bg)}
.slot.filled{border-style:solid;border-color:var(--brand);background:var(--card)}
.slot.right{border-color:var(--ok);background:var(--okbg)}
.slot.wrong{border-color:var(--bad);background:var(--badbg)}
.arrow{display:grid;justify-items:center;font-size:14px;color:var(--muted);line-height:1.1}
.arrow b{font-size:26px;color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:800;font-size:17px;min-height:48px}
.tile:disabled{opacity:.3}

/* Figur */
.fig{width:100%;height:auto;display:block;background:var(--bg);border-radius:14px;touch-action:manipulation}
.fig .mk circle{fill:var(--brand);stroke:var(--card);stroke-width:3}
.fig .mk text{fill:var(--brand-ink);font:800 15px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fig .mk.click{cursor:pointer}
.fig .mk.right circle{fill:var(--ok)}
.fig .mk.wrong circle{fill:var(--bad)}
.fig .mk.ask circle{fill:var(--accent)}
.figkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:10px;font-size:15px}

/* Tilbakemelding */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px;border-top:3px solid;display:flex;justify-content:center;animation:up .2s ease-out;z-index:5}
.fb .in{max-width:720px;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb.near{background:var(--nearbg);border-color:var(--accent)}
.fb .msg{flex:1;min-width:220px;max-height:40vh;overflow:auto}
.fb .title{font-size:21px;font-weight:800}
.fb.ok .title{color:var(--ok)}
.fb.bad .title{color:var(--bad)}
.fb.near .title{color:var(--near)}
.fb .xp{font-weight:800;color:var(--accent);margin-left:6px}

.end{text-align:center;display:grid;gap:10px;justify-items:center}
.end .big{font-size:72px}
.end .stat{font-size:20px;font-weight:800}
.newmedal{background:var(--chip);border-radius:14px;padding:10px 14px;font-weight:700}
.review{text-align:left;width:100%;display:grid;gap:10px}
.goalbar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin:-4px 0 12px}
.goalbar>div{height:100%;background:var(--accent);transition:width .3s}
.goalbar.done>div{background:var(--ok)}
.jflash{min-height:26px;font-weight:800;margin-top:10px}
.jflash.ok{color:var(--ok)} .jflash.bad{color:var(--bad)} .jflash.near{color:var(--near)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:6px 0 10px}
.jrow{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.jrow .mk2{font-size:20px;line-height:1.2;flex:none;width:26px;text-align:center}
.jrow.now-ok{border-color:var(--ok);background:var(--okbg)}
.jrow.now-bad{border-color:var(--bad);background:var(--badbg)}
.jrow.missing{opacity:.75}
.jrow b{display:block}
.jrow small{color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;margin:10px 0}
.fullpott{background:linear-gradient(90deg,var(--accent),var(--brand));color:#fff;border-radius:16px;padding:14px;font-size:20px;font-weight:800;text-align:center}
.chal-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:22px;margin-bottom:12px;gap:12px}
.timer{font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}

.conf{position:fixed;top:55vh;font-size:28px;pointer-events:none;z-index:10;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-50vh) scale(1.2) rotate(var(--r));opacity:0}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){ .q-big{font-size:23px} .q-text{font-size:19px} .flash .term{font-size:27px} .sortcard{font-size:20px} }
</style>
</head>
<body>
<div id="app"></div>
<script src="nervesystemet.js"></script>
<script>
/* =====================================================================
   NATURFAG – øve-app. Innholdet ligger i nervesystemet.js (window.PROVE).
   ===================================================================== */
const P = window.PROVE;
const BEGREPER = P.begreper.map(([id,t,navn,fork]) => ({id,t,navn,fork}));
const SANT = P.santusant.map(([id,t,p,sann,fork]) => ({id,t,p,sann,fork}));
const TEMA = Object.fromEntries(P.temaer.map(t => [t.id, t]));
const TEST_DATE = new Date(P.provedato + 'T00:00:00');
const KIND_NAMES = {kort:'Begrepskort', begrepMc:'Begreper', match:'Finn parene', forklar:'Forklar', rekke:'Rekkefølge', sorter:'Sorter', hvorfor:'Hvorfor?', sant:'Sant eller usant', likning:'Likning', figur:'Figur'};

/* ---------- Lagring ---------- */
const KEY = P.lagringsnokkel;
const DEFAULT = {xp:0, stats:{}, medals:[], sessions:0, topicDone:{}, best60:0, maxCombo:0, dayStreak:0, lastDay:null,
  sound:true, forklarOk:0, figurOk:0, proveDone:0, drafts:{}, jakt:{}};
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(r)); }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ return S.stats[id] || {w:3, s:0, n:0}; }
function record(id, ok){
  const x = st(id); x.n++;
  if(ok){ x.s++; x.w = Math.max(1, x.w-1); } else { x.s = 0; x.w = Math.min(9, x.w+3); }
  S.stats[id] = x;
}
function weightedPick(arr, n){
  const a = arr.slice(), out = [];
  while(out.length < n && a.length){
    const tot = a.reduce((s,x) => s+st(x.id).w, 0);
    let r = Math.random()*tot, i = 0;
    for(; i < a.length-1; i++){ r -= st(a[i].id).w; if(r <= 0) break; }
    out.push(a.splice(i,1)[0]);
  }
  return out;
}

/* ---------- Hjelpere ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = a => a[Math.floor(Math.random()*a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const RANKS = ['Nysgjerrig','Utforsker','Forsker','Nevro-nerd','Hjerneekspert','Professor','Nobelprisvinner'];
function level(xp = S.xp){ return Math.floor(Math.sqrt(xp/30)) + 1; }
function levelInfo(){ const l = level(), base = 30*(l-1)*(l-1), next = 30*l*l; return {l, rank:RANKS[Math.min(l-1, RANKS.length-1)], cur:S.xp-base, need:next-base}; }
function dayKey(d = new Date()){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function markDay(){
  const today = dayKey(); if(S.lastDay === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  S.dayStreak = (S.lastDay === dayKey(y)) ? S.dayStreak+1 : 1; S.lastDay = today;
}
function streakNow(){ const y = new Date(); y.setDate(y.getDate()-1); return (S.lastDay === dayKey() || S.lastDay === dayKey(y)) ? S.dayStreak : 0; }
function daysToTest(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((TEST_DATE - t)/864e5); }

let actx;
function beep(kind){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = {ok:[660,880], bad:[260,200], win:[523,659,784,1046], tick:[520]}[kind];
    notes.forEach((f,i) => {
      const t0 = actx.currentTime + i*0.09, o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.14, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.2);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+0.22);
    });
  }catch(e){}
}
function burst(n = 14){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const em = ['⭐','✨','🎉','🧠','⚡','🏆'];
  for(let i=0;i<n;i++){
    const s = document.createElement('span'); s.className = 'conf'; s.textContent = rnd(em);
    s.style.left = (35 + Math.random()*30) + 'vw';
    s.style.setProperty('--dx', (Math.random()*60-30) + 'vw');
    s.style.setProperty('--r', (Math.random()*360-180) + 'deg');
    s.style.animationDelay = (Math.random()*0.15) + 's';
    document.body.append(s); setTimeout(() => s.remove(), 1400);
  }
}

/* ---------- Medaljer ---------- */
const MEDALS = [
  {id:'first',  e:'🎉', name:'Første økt',        desc:'Fullfør en økt',                  test:()=>S.sessions>=1},
  {id:'combo10',e:'🔥', name:'10 på rad',         desc:'10 riktige på rad',               test:()=>S.maxCombo>=10},
  {id:'forklar',e:'✍️', name:'Forklaringsmester', desc:'10 gode forklaringer',            test:()=>S.forklarOk>=10},
  {id:'figur',  e:'🔬', name:'Figurekspert',      desc:'5 figurer uten feil',             test:()=>S.figurOk>=5},
  {id:'prove',  e:'📝', name:'Prøveklar',         desc:'2 prøvetreninger',                test:()=>S.proveDone>=2},
  {id:'lyn',    e:'⚡', name:'Begrepsjeger',      desc:'Nå målet i Begrepsjakt: velg',    test:()=>(S.jakt.velg?.best||0)>=JAKT.velg.mal || S.best60>=15},
  {id:'jaktvelg',e:'🎯', name:'Begrepsmester',    desc:'Full pott i Begrepsjakt: velg',   test:()=>!!S.jakt.velg?.full},
  {id:'jaktskriv',e:'⌨️', name:'Staveekspert',    desc:'Full pott i Begrepsjakt: skriv',  test:()=>!!S.jakt.skriv?.full},

/* =====================================================================
   STAVEKONTROLL AV FAGORD (lokal, ingen nettjeneste)
   Den norske LanguageTool-kontrollen ble testet og forkastet: den merket
   riktige ord (noe, noen) som feil og slapp gjennom ekte feil. Her sjekkes
   derfor bare fagordene, mot lista i nervesystemet.js.
   ===================================================================== */
const FAGORD = P.fagord;                    // godkjente stammer
const FAGBASE = P.fagordVisning.filter(f => f.length >= 5);
const IKKE = P.ikkeFagord;
// Avstand som også teller ombytting av to naboboksstaver som én feil
function osa(a, b){
  const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if(i>1 && j>1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);
  }
  return d[a.length][b.length];
}
function fagordCheck(t){
  const out = [], re = /\p{L}+/gu; let m;
  while((m = re.exec(t))){
    const word = m[0], w = word.toLowerCase();
    if(w.length < 5 || FAGORD.some(f => w.startsWith(f)) || FAGBASE.some(f => w.startsWith(f)) || IKKE.some(x => w.startsWith(x))) continue;
    let hit = null;
    for(const f of FAGBASE){
      if(w.slice(0,2) !== f.slice(0,2)) continue;
      for(const L of [f.length-1, f.length, f.length+1]){
        if(L > w.length || L < 4) continue;
        const part = w.slice(0,L);
        if(L === f.length-1 && f.startsWith(part)) continue;   // ordet bare fortsetter annerledes, f.eks. «reflek-tere»
        if(osa(part, f) === 1){ hit = f; break; }
      }
      if(hit) break;
    }
    if(hit) out.push({offset:m.index, length:word.length, base:hit});
  }
  return out;
}

/* =====================================================================
   SKRIVETRENING: han skal skrive selv (de skriver for hånd på prøven).
   Autokorrektur og stavehjelp er skrudd av, og store tekstbiter som limes
   inn eller kommer fra diktering på én gang, blir avvist.
   ===================================================================== */
const WRITE_ATTR = 'autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"';
function guardInput(inp, msgEl){
  inp.addEventListener('beforeinput', e => {
    const t = e.inputType || '';
    if(/^insertFrom(Paste|Drop|Yank)/.test(t) || t === 'insertReplacementText' && (e.data || '').length > 25 || (e.data && e.data.length > 25)){
      e.preventDefault();
      if(msgEl) msgEl.textContent = '✍️ Skriv svaret selv med tastaturet. På prøven skriver du for hånd!';
    }
  });
  inp.addEventListener('paste', e => { e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Innliming er skrudd av. Skriv svaret selv!'; });
}
function spellHtml(text){
  const sp = fagordCheck(text); if(!sp.length) return '';
  let html = '', pos = 0;
  sp.forEach(m => { html += esc(text.slice(pos, m.offset)) + `<mark>${esc(text.substr(m.offset, m.length))}</mark>`; pos = m.offset + m.length; });
  html += esc(text.slice(pos));
  return `<div class="spell"><div class="q-label">Sjekk stavingen av fagordene:</div><div class="marked">${html}</div>
    <ul>${sp.map(m => `<li><b style="color:var(--bad)">${esc(text.substr(m.offset, m.length))}</b>: mente du fagordet <span class="sugg">${esc(m.base)}</span>? Sjekk stavingen.</li>`).join('')}</ul></div>`;
}
const normA = s => s.toLowerCase().replace(/[.,!?;:«»"()]/g,'').replace(/\s+/g,' ').trim();
function begrepSvar(b){
  const n = b.navn.toLowerCase(), out = new Set([n]);
  const m = n.match(/^(.*?)\s*\((.*)\)$/);
  if(m){ out.add(m[1].trim()); out.add(m[2].trim()); }
  [...out].forEach(x => { const y = x.replace(/^(det|den) /,''); out.add(y); });
  return [...out];
}
// Ett-ords-svar: riktig, nesten (skrivefeil) eller feil
function gradeWord(input, answers){
  const a = normA(input); if(!a) return null;
  if(answers.some(x => normA(x) === a)) return 'ok';
  if(answers.some(x => { const y = normA(x); return osa(a, y) <= (y.length >= 6 ? 2 : 1); })) return 'near';
  return 'bad';
}

/* =====================================================================
   BEGREPSSJEKK for forklaringer
   ===================================================================== */
function words(t){ return t.toLowerCase().replace(/[^\p{L}\p{N}₀-₉ ]+/gu,' ').split(/\s+/).filter(Boolean); }
function hasStem(t, ws, stem){
  stem = stem.toLowerCase();
  if(stem.length < 4) return ws.some(w => w.startsWith(stem));
  if(stem === 'sympatisk') return /(?<!para)sympatisk/.test(t.toLowerCase());
  if(t.toLowerCase().includes(stem)) return true;
  if(stem.length >= 6) return ws.some(w => w.length >= stem.length-1 && lev(w.slice(0, stem.length), stem) <= 1);
  return false;
}
function conceptCheck(task, text){
  text = text.replace(/[₀-₉]/g, c => String('₀₁₂₃₄₅₆₇₈₉'.indexOf(c)));
  const ws = words(text);
  return task.begreper.map(([navn, ...stems]) => ({navn, ok: stems.some(s => hasStem(text, ws, s))}));
}

/* =====================================================================
   OPPGAVETYPER – hver kaller finish({ok, near, rec, xp, answer, note})
   ===================================================================== */
const inTopic = (arr, topic) => ['mix','prove','kort','skriv'].includes(topic) ? arr : arr.filter(x => x.t === topic);
function pool(kind, topic){
  switch(kind){
    case 'kort': case 'begrepMc': case 'match': return inTopic(BEGREPER, topic);
    case 'forklar': return inTopic(P.forklar, topic);
    case 'rekke': return inTopic(P.rekkefolge, topic);
    case 'sorter': return inTopic(P.sorter, topic);
    case 'hvorfor': return inTopic(P.hvorfor, topic);
    case 'sant': return inTopic(SANT, topic);
    case 'likning': return inTopic(P.likninger, topic);
    case 'figur': return inTopic(P.figurer, topic);
    case 'kortsvar': return inTopic(P.kortsvar, topic);
    case 'fullfor': return inTopic(P.fullfor, topic);
    case 'brukord': return inTopic(P.brukord, topic);
    case 'fyllinn': return inTopic(P.fyllinn, topic);
    case 'skrivBegrep': return inTopic(BEGREPER, topic).map(b => ({id:'sb-'+b.id, t:b.t, b}));
  }
  return [];
}
function mc(el, head, options, correct, cb){
  el.innerHTML = head + `<div class="opts">${options.map((o,i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="after"></div>`;
  const btns = [...el.querySelectorAll('.opt')];
  btns.forEach(b => b.onclick = () => {
    const ok = options[+b.dataset.i] === correct;
    btns.forEach(x => { x.disabled = true; if(options[+x.dataset.i] === correct) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    cb(ok, el.querySelector('.after'));
  });
}
function otherBegreper(item, n, sameTopic = true){
  let src = BEGREPER.filter(b => b.id !== item.id && (!sameTopic || b.t === item.t));
  if(src.length < n) src = BEGREPER.filter(b => b.id !== item.id);
  return shuffle(src).slice(0, n);
}

  rekke(el, r, finish){
    let bank = shuffle(r.steg.map((s,i) => ({s,i})));

    let line = [], locked = false;
    el.innerHTML = `<div class="q-label">${TEMA[r.t].e} Beskriv prosessen</div><div class="q-text">${esc(r.tittel)}</div>

      el.querySelectorAll('button').forEach(b => b.disabled = true);
      finish({ok, near: !ok && right >= line.length - 2, rec:[[r.id, ok]], xp: right*2 + (ok ? 6 : 0),
        note: ok ? '' : '<b>Riktig rekkefølge:</b><ol style="margin:6px 0 0;padding-left:22px">' + r.steg.map(s => `<li>${esc(s)}</li>`).join('') + '</ol>'});

  sorter(el, s, finish){

    el.innerHTML = `<div class="q-label">${TEMA[s.t].e} Sorter</div><div class="q-text">${esc(s.tittel)}</div>

        i++;

  hvorfor(el, h, finish){

  sant(el, u, finish){

  likning(el, l, finish){
    const slots = [...l.inn.map(() => 'inn'), ...l.ut.map(() => 'ut')], fill = slots.map(() => null);
    const tiles = shuffle([...l.inn, ...l.ut, ...l.lure]);
    el.innerHTML = `<div class="q-label">${TEMA[l.t].e} Bygg likningen</div><div class="q-text">${esc(l.tittel)}</div>

      <div class="row end"><button class="btn primary" id="check" disabled>Sjekk</button></div>`;
    const eq = el.querySelector('.eq'), tb = [...el.querySelectorAll('.tile')];
    let locked = false;
    const draw = () => {
      const part = (side) => slots.map((s,k) => s === side ? k : -1).filter(k => k >= 0)
        .map(k => `<div class="slot ${fill[k] !== null ? 'filled' : ''}" data-k="${k}">${fill[k] !== null ? esc(tiles[fill[k]]) : ''}</div>`).join('<span>+</span>');

      eq.querySelectorAll('.slot').forEach(s => s.onclick = () => { if(locked) return; const k = +s.dataset.k; if(fill[k] !== null){ tb[fill[k]].disabled = false; fill[k] = null; draw(); } });

    };
    tb.forEach(b => b.onclick = () => {
      if(locked) return; const k = fill.indexOf(null); if(k < 0) return;

    });
    $('#check').onclick = () => {
      locked = true;
      const got = side => slots.map((s,k) => s === side ? tiles[fill[k]] : null).filter(x => x !== null);
      const same = (a, b) => a.length === b.length && a.slice().sort().join('|') === b.slice().sort().join('|');
      const okIn = same(got('inn'), l.inn), okUt = same(got('ut'), l.ut), ok = okIn && okUt;
      eq.querySelectorAll('.slot').forEach(s => { const k = +s.dataset.k; const want = slots[k] === 'inn' ? l.inn : l.ut; s.classList.add(want.includes(tiles[fill[k]]) ? 'right' : 'wrong'); });
      tb.forEach(b => b.disabled = true);
      finish({ok, near: !ok && (okIn || okUt), rec:[[l.id, ok]], xp: ok ? 12 : (okIn || okUt) ? 4 : 0,
        answer: ok ? null : `${l.inn.join(' + ')} → ${l.ut.join(' + ')}`, note: l.over ? `Fotosyntesen trenger ${l.over}, som klorofyllet fanger opp.` : 'Energien som frigjøres, bruker cellene til alt de gjør.'});
    };
    draw();
  },
  figur(el, g, finish){
    const qs = shuffle(g.deler).slice(0, 3).map((d,k) => ({d, mode: k % 2 === 0 ? 'name' : 'click'}));

    const ask = () => {

        const nb = document.createElement('div'); nb.className = 'row end';
        nb.innerHTML = `<button class="btn primary">${qi < qs.length - 1 ? 'Neste ➜' : 'Ferdig ✓'}</button>`;
        el.append(nb);
        const b = nb.querySelector('button'); b.focus();
        b.onclick = () => {
          b.disabled = true; qi++;
          if(qi < qs.length) return ask();

          el.querySelector('.qbox').innerHTML = `<div class="figkey">${g.deler.map(([n,nm]) => `<div><b>${n}</b> ${esc(nm)}</div>`).join('')}</div>`;
          nb.remove();
          finish({ok: mistakes <= 1, near: mistakes === 1, rec:[[g.id, ok2]], xp: (3 - mistakes)*4 + (ok2 ? 4 : 0), silent:true,
            note: ok2 ? 'Alle riktige! Se navnene på alle delene i figuren.' : `${mistakes} feil. Se navnene på alle delene i figuren over.`});
        };
      };
      if(q.mode === 'name'){
        const names = shuffle([navn, ...shuffle(g.deler.filter(d => d[0] !== nr)).slice(0,3).map(d => d[1])]);
        const box = el.querySelector('.qbox');
        box.innerHTML = `<div class="opts" style="margin-top:12px">${names.map(n => `<button class="opt">${esc(n)}</button>`).join('')}</div>`;
        box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
          const ok = b.textContent === navn;
          box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(x.textContent === navn) x.classList.add('right'); });
          if(!ok) b.classList.add('wrong');
          next(ok);
        });
      } else {
        let done = false;
        el.querySelectorAll('.mk').forEach(m => m.addEventListener('click', () => {
          if(done) return; done = true;
          const ok = +m.dataset.nr === nr;
          m.classList.add(ok ? 'right' : 'wrong');
          if(!ok){ el.querySelector(`.mk[data-nr="${nr}"]`).classList.add('right');
            el.querySelector('.qbox').innerHTML = `<p class="muted">Du trykket på ${esc(g.deler.find(d => d[0] === +m.dataset.nr)[1])}. Riktig er nummer ${nr}.</p>`; }
          next(ok);
        }));
      }
    };
    ask();
  },
};

function oneWord(el, id, answers, finish, fasit){
  const inp = el.querySelector('input'); guardInput(inp, el.querySelector('.guard'));
  const check = () => {
    const g = gradeWord(inp.value, answers); if(!g || inp.disabled) return;
    inp.disabled = true; $('#check').disabled = true;
    inp.classList.add(g === 'ok' ? 'right' : 'wrong');
    finish({ok: g !== 'bad', near: g === 'near', rec:[[id, g === 'ok']], xp: g === 'ok' ? 10 : g === 'near' ? 4 : 0,
      answer: g === 'ok' ? null : fasit(), note: g === 'near' ? 'Nesten! Se nøye på skrivemåten, og øv på å stave fagordet riktig.' : ''});
  };
  $('#check').onclick = check;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); check(); } });
  inp.focus();
}
function shortWrite(el, item, finish, c){
  el.innerHTML = c.head + `<textarea id="txt" rows="3" style="min-height:110px" ${WRITE_ATTR} placeholder="${c.placeholder || 'Skriv svaret ditt her …'}"></textarea>
    <div class="guard"></div><div class="hintbox"></div>
    <div class="row end">${c.hint ? '<button class="btn ghost" id="hint">💡 Hint</button>' : ''}<button class="btn primary" id="check">Sjekk</button></div><div id="result"></div>`;
  const ta = $('#txt'); guardInput(ta, el.querySelector('.guard')); let hint = false;
  if($('#hint')) $('#hint').onclick = e => { hint = true; e.target.disabled = true;
    el.querySelector('.hintbox').innerHTML = `<div class="chips">${c.begreper.map(b => `<span class="chip">${esc(b[0])}</span>`).join('')}</div>`; };
  $('#check').onclick = () => {
    const text = ta.value.trim();
    if(text.split(/\s+/).filter(Boolean).length < (c.minWords || 2)){ ta.focus(); $('#result').innerHTML = '<p class="muted">Skriv litt mer først.</p>'; return; }
    const res = conceptCheck({begreper:c.begreper}, text), found = res.filter(r => r.ok).length;
    let ordenOk = true;
    if(c.orden){
      const t = text.toLowerCase(), first = arr => Math.min(...arr.map(w => { const i = t.indexOf(w); return i < 0 ? Infinity : i; }));
      const lastFor = Math.max(...c.orden.for.map(w => t.indexOf(w)));
      ordenOk = lastFor >= 0 && lastFor < first(c.orden.etter);
    }
    const ok = found >= c.min && ordenOk;
    ta.disabled = true; $('#check').disabled = true; if($('#hint')) $('#hint').disabled = true;
    $('#result').innerHTML = `<div class="score">${ok ? '✅' : '🔶'} ${found} av ${res.length} fagbegreper${ok ? '' : ` (trenger ${c.min})`}</div>
      <ul class="concepts">${res.map(r => `<li class="${r.ok ? 'done' : ''}">${r.ok ? '✅' : '⬜'} ${esc(r.navn)}</li>`).join('')}</ul>
      ${c.orden && !ordenOk ? '<p style="color:var(--bad);font-weight:700">Husk rekkefølgen: det som brukes opp, står før pilen (→).</p>' : ''}
      <div class="q-label">Eksempel på et godt svar:</div><div class="model">${esc(c.eks)}</div>
      ${spellHtml(text)}
      <div class="row end"><button class="btn primary" id="done">Ferdig ✓</button></div>`;
    $('#done').onclick = () => { $('#done').disabled = true;
      finish({ok, near: !ok && found > 0, rec:[[item.id, ok]], xp: found*3 + (ok ? 6 : 0) - (hint ? 3 : 0), silent:true,
        forklar: c.min >= 3 ? {spm: item.spm || item.start, found, total: res.length, ok} : null,
        note: ok ? 'Bra skrevet med fagbegreper!' : 'Se på eksempelet og begrepene du manglet. Oppgaven kommer igjen.'}); };
  };
}

const WRITE_KINDS = ['forklar','kortsvar','fullfor','brukord','fyllinn','skrivBegrep'];
const MODES = {
  // Selvvurdering (kort) er begrenset: han skal heller skrive selv.
  tema:  {kinds:['kort','forklar','forklar','kortsvar','kortsvar','fullfor','fullfor','brukord','fyllinn','skrivBegrep','begrepMc','rekke','sorter','hvorfor','sant','likning','figur','match'], total:10, max:{kort:1}},
  mix:   {kinds:['kort','forklar','forklar','kortsvar','kortsvar','fullfor','fullfor','brukord','fyllinn','skrivBegrep','begrepMc','rekke','sorter','hvorfor','sant','likning','figur','match'], total:12, max:{kort:1}},
  skriv: {kinds:['kortsvar','kortsvar','fullfor','fullfor','brukord','fyllinn','skrivBegrep','forklar'], total:8},
  prove: {kinds:['forklar','kortsvar'], total:5},
  kort:  {kinds:['skrivBegrep','kort'], total:10, repeat:true, max:{kort:3}},
};
const ONCE = ['match','likning','figur','rekke','sorter','begrepMc','sant'];
const RETRY = ['begrepMc','hvorfor','sant','forklar','kortsvar','fullfor','brukord','fyllinn','skrivBegrep'];
let SES = null;
function startSession(topic){
  const mode = MODES[topic] || MODES.tema;
  SES = {topic, mode, i:0, total:mode.total, correct:0, combo:0, xp:0, lastKind:null, recent:[], retry:[], kindCount:{}, startLevel:level(), forklar:[]};
  nextTask();
}
function chooseTask(){
  const kinds = SES.mode.kinds.filter(k => (k !== SES.lastKind || SES.mode.repeat || SES.mode.kinds.length === 1) &&
    !(SES.mode.max && SES.mode.max[k] !== undefined && (SES.kindCount[k]||0) >= SES.mode.max[k]) &&
    !(ONCE.includes(k) && SES.kindCount[k]) && pool(k, SES.topic).length >= (k === 'match' ? 4 : 1));
  for(let tries = 0; tries < 30; tries++){
    const k = rnd(kinds);
    if(k === 'match') return {kind:k, item:null};
    const p = pool(k, SES.topic).filter(x => !SES.recent.includes(x.id));
    if(p.length) return {kind:k, item:weightedPick(p,1)[0]};
  }
  const k = rnd(kinds); return {kind:k, item: k === 'match' ? null : rnd(pool(k, SES.topic))};
}
function nextTask(){
  $('.fb')?.remove();
  if(SES.i >= SES.total && SES.retry.length && SES.total < SES.mode.total + 3 && SES.topic !== 'prove'){ SES.total++; SES.retry[0].due = 0; }
  if(SES.i >= SES.total) return endSession();
  const di = SES.retry.findIndex(r => r.due <= SES.i);
  const task = di >= 0 ? SES.retry.splice(di,1)[0] : chooseTask();
  SES.current = task; SES.lastKind = task.kind; SES.kindCount[task.kind] = (SES.kindCount[task.kind]||0) + 1;
  if(task.item){ SES.recent.push(task.item.id); SES.recent = SES.recent.slice(-6); }
  app.innerHTML = `
    <div class="sbar"><button class="icon" id="quit" aria-label="Avslutt">✕</button>
      <div class="bar"><div style="width:${100*SES.i/SES.total}%"></div></div>
      <div class="combo ${SES.combo >= 3 ? 'on' : ''}">${SES.combo >= 2 ? '🔥 '+SES.combo : ''}</div></div>
    ${SES.i >= SES.mode.total ? '<p class="muted" style="margin:-6px 0 10px">🔁 Ekstrarunde: noe du bommet på</p>' : ''}
    <div class="card task" id="task"></div>`;
  $('#quit').onclick = () => { if(confirm('Avslutte økta? XP-en du har fått, beholder du.')){ save(); renderHome(); } };
  RUN[task.kind]($('#task'), task.item, onResult, SES.topic);
  window.scrollTo(0,0);
}
const PRAISE = ['Riktig!','Supert!','Bra jobba!','Kjempebra!','Helt rått!','Akkurat!'];
const COMFORT = ['Ikke helt','Nesten!','Godt forsøk','Ikke denne gangen'];
function onResult(res){
  (res.rec||[]).forEach(([id,ok]) => record(id, ok));
  if(res.forklar) SES.forklar.push(res.forklar);
  let gained = Math.max(0, res.xp ?? (res.ok ? 10 : 0));
  if(res.ok && !res.near){ SES.correct++; SES.combo++; S.maxCombo = Math.max(S.maxCombo, SES.combo); if(SES.combo >= 3) gained += 5; }
  else if(!res.ok){ SES.combo = 0; }
  if(!res.silent) beep(res.ok ? 'ok' : 'bad');
  if(res.ok && ([3,5,10,15].includes(SES.combo) || res.xp >= 20)) burst();
  if((!res.ok || res.near) && SES.current.item && RETRY.includes(SES.current.kind) && SES.topic !== 'prove')
    SES.retry.push({kind:SES.current.kind, item:SES.current.item, due:SES.i+3});
  // Et begrepskort han ikke kunne, kommer igjen som skriveoppgave (ikke som nytt selvvurderingskort)
  if((!res.ok || res.near) && SES.current.kind === 'kort'){ const b = SES.current.item;
    SES.retry.push({kind:'skrivBegrep', item:{id:'sb-'+b.id, t:b.t, b}, due:SES.i+3}); }
  SES.xp += gained; S.xp += gained; SES.i++; save();
  const fb = document.createElement('div');
  fb.className = 'fb ' + (res.near ? 'near' : res.ok ? 'ok' : 'bad');
  fb.innerHTML = `<div class="in"><div class="msg">
      <div class="title">${res.near ? 'Nesten!' : res.ok ? rnd(PRAISE) : rnd(COMFORT)}${gained ? `<span class="xp">+${gained} XP</span>` : ''}${res.ok && !res.near && SES.combo >= 3 ? ` <span class="xp">🔥 ${SES.combo} på rad!</span>` : ''}</div>
      ${res.answer ? `<div>Riktig svar: <b>${esc(res.answer)}</b></div>` : ''}
      ${res.note ? `<div>${res.note}</div>` : ''}
    </div><button class="btn primary" id="next">Fortsett ➜</button></div>`;
  document.body.append(fb);
  const nb = $('#next'); nb.onclick = nextTask; nb.focus();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.defaultPrevented && $('#next') && document.activeElement?.id !== 'next' && document.activeElement?.tagName !== 'TEXTAREA'){ e.preventDefault(); nextTask(); }
});
function endSession(){
  $('.fb')?.remove();
  S.sessions++;
  if(SES.topic === 'prove') S.proveDone++;
  S.topicDone[SES.topic] = (S.topicDone[SES.topic]||0) + 1;
  markDay(); const newM = checkMedals(); save();
  const up = level() > SES.startLevel, L = levelInfo(), pct = SES.correct / SES.total;
  beep('win'); burst(up || newM.length ? 30 : 16);
  const review = SES.forklar.length ? `<div class="review"><div class="q-label">Forklaringene dine</div>${SES.forklar.map(f =>
    `<div class="explain">${f.ok ? '✅' : '🔶'} ${esc(f.spm)}<br><span class="muted">${f.found} av ${f.total} begreper</span></div>`).join('')}</div>` : '';
  app.innerHTML = `<div class="card end">
      <div class="big">${pct >= .85 ? '🏆' : pct >= .6 ? '🌟' : '💪'}</div>
      <h2>${pct >= .85 ? 'Helt rått!' : pct >= .6 ? 'Kjempebra jobba!' : 'Bra! Det du bommet på, kommer igjen.'}</h2>
      <div class="stat">${SES.correct} av ${SES.total} helt riktige</div>
      <div class="stat" style="color:var(--accent)">+${SES.xp} XP</div>
      ${up ? `<div class="newmedal">⬆️ Nytt nivå: ${L.l} – ${L.rank}!</div>` : ''}
      ${newM.map(m => `<div class="newmedal">${m.e} Ny medalje: ${m.name}</div>`).join('')}
      ${review}
      <div class="row"><button class="btn primary" id="again">En runde til</button><button class="btn" id="home">Hjem</button></div>
    </div>`;
  const t = SES.topic; $('#again').onclick = () => startSession(t); $('#home').onclick = renderHome; $('#again').focus();
}

/* ---------- BEGREPSJAKT på tid (alle begrepene) ----------
   velg: les forklaringen, velg fagordet. skriv: les forklaringen, skriv fagordet.
   Full pott = alle begrepene klart, gjerne over flere runder. */
const JAKT = {
  velg:  {e:'⚡', navn:'Begrepsjakt: velg',  tid:60,  mal:15, desc:'Les forklaringen og velg riktig fagord'},
  skriv: {e:'⌨️', navn:'Begrepsjakt: skriv', tid:120, mal:10, desc:'Les forklaringen og skriv fagordet selv'},
};
const mmss = t => Math.floor(t/60) + ':' + String(t % 60).padStart(2,'0');
function jaktState(m){ return S.jakt[m] = S.jakt[m] || {done:[], runder:0, best:0, full:false}; }
let CH = null;
function stopChallenge(){ if(CH){ clearInterval(CH.timer); CH = null; } }
function startChallenge(mode = 'velg'){
  stopChallenge();
  const J = JAKT[mode], js = jaktState(mode);
  // De som ikke er klart ennå, kommer først
  const notDone = shuffle(BEGREPER.filter(b => !js.done.includes(b.id))), done = shuffle(BEGREPER.filter(b => js.done.includes(b.id)));
  CH = {mode, score:0, left:J.tid, timer:null, startLevel:level(), queue:[...notDone, ...done], qi:0, right:new Set(), wrong:new Set(), goalHit:false};
  app.innerHTML = `<div class="sbar"><button class="icon" id="quit" aria-label="Avslutt">✕</button><div class="bar"><div id="tbar" style="width:100%"></div></div></div>
    <div class="chal-top"><span class="timer" id="time">⏱ ${mmss(J.tid)}</span><span>🎯 <span id="score">0</span> / ${J.mal}</span></div>
    <div class="goalbar" id="goal"><div style="width:0%"></div></div>
    <div class="card task" id="task"></div>`;
  $('#quit').onclick = () => { if(confirm('Avslutte runden? Det du har klart, blir lagret.')) endChallenge(); };
  CH.timer = setInterval(() => {
    CH.left--; $('#time').textContent = '⏱ ' + mmss(Math.max(0, CH.left)); $('#tbar').style.width = (100*CH.left/J.tid) + '%';
    if(CH.left <= 10) $('#time').classList.add('low');
    if(CH.left <= 0) endChallenge();
  }, 1000);
  if(mode === 'skriv') setupSkrivJakt();
  chalQ();
}
function nextBegrep(){ if(CH.qi >= CH.queue.length){ CH.queue = shuffle(BEGREPER); CH.qi = 0; } return CH.queue[CH.qi++]; }
function jaktAnswer(b, ok){
  const js = jaktState(CH.mode);
  record(CH.mode === 'skriv' ? 'sb-'+b.id : b.id, ok);
  if(ok){ CH.right.add(b.id); CH.wrong.delete(b.id); if(!js.done.includes(b.id)) js.done.push(b.id); CH.score++; beep('ok'); }
  else { if(!CH.right.has(b.id)) CH.wrong.add(b.id); beep('bad'); }
  save();
  const J = JAKT[CH.mode];
  $('#score').textContent = CH.score;
  $('#goal').firstElementChild.style.width = Math.min(100, 100*CH.score/J.mal) + '%';
  if(CH.score >= J.mal && !CH.goalHit){ CH.goalHit = true; $('#goal').classList.add('done'); burst(20); }
}
function chalQ(){
  if(!CH) return;
  const b = nextBegrep(); CH.cur = b;
  if(CH.mode === 'velg'){
    mc($('#task'), `<div class="q-label">Hvilket fagbegrep passer?</div><div class="q-text">${esc(b.fork)}</div>`,
      shuffle([b.navn, ...otherBegreper(b, 3).map(o => o.navn)]), b.navn, ok => {
        if(!CH) return; jaktAnswer(b, ok); setTimeout(chalQ, ok ? 300 : 1100);
      });
  } else {
    $('#jq').textContent = b.fork; const inp = $('#jinp'); inp.value = ''; inp.disabled = false; inp.focus();
  }
}
function setupSkrivJakt(){
  $('#task').innerHTML = `<div class="q-label">Skriv fagordet som passer</div><div class="q-text" id="jq"></div>
    <input class="answer" id="jinp" ${WRITE_ATTR} placeholder="Skriv fagordet …"><div class="guard"></div>
    <div class="jflash" id="jflash"></div>
    <div class="row end"><button class="btn ghost" id="jskip">Hopp over</button><button class="btn primary" id="jok">Sjekk</button></div>`;
  const inp = $('#jinp'); guardInput(inp, $('#task .guard'));
  const flash = (cls, html) => { const f = $('#jflash'); f.className = 'jflash ' + cls; f.innerHTML = html; };
  const submit = skip => {
    if(!CH || inp.disabled) return;
    const b = CH.cur, g = skip ? 'bad' : gradeWord(inp.value, begrepSvar(b));
    if(!g) return inp.focus();
    inp.disabled = true;
    jaktAnswer(b, g === 'ok');
    if(g === 'ok') flash('ok', '✅ Riktig!');
    else if(g === 'near') flash('near', `Nesten! Riktig skrivemåte: <b>${esc(b.navn)}</b>`);
    else flash('bad', `${skip ? 'Hoppet over.' : 'Feil.'} Riktig: <b>${esc(b.navn)}</b>`);
    setTimeout(() => { if(CH){ flash('', ''); chalQ(); } }, g === 'ok' ? 350 : 1600);
  };
  $('#jok').onclick = () => submit(false);
  $('#jskip').onclick = () => submit(true);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(false); } });
}
function endChallenge(){
  const c = CH; if(!c) return; stopChallenge();
  const J = JAKT[c.mode], js = jaktState(c.mode);
  js.runder++;
  const rec = c.score > js.best; if(rec) js.best = c.score;
  if(c.mode === 'velg') S.best60 = Math.max(S.best60, c.score);
  let xp = c.score * 3 + (c.score >= J.mal ? 15 : 0), full = false;
  if(!js.full && js.done.length >= BEGREPER.length){ js.full = true; full = true; xp += 100; }
  S.xp += xp; markDay();
  const newM = checkMedals(); save(); beep('win'); burst(full ? 40 : c.score >= J.mal ? 24 : 10);
  renderJaktResult(c, {xp, rec, full, newM});
}
function renderJaktResult(c, r){
  const J = JAKT[c.mode], js = jaktState(c.mode), total = BEGREPER.length, n = js.done.length;
  const status = b => c.right.has(b.id) ? ['now-ok','✅','Riktig nå'] : c.wrong.has(b.id) ? ['now-bad','❌','Feil nå'] : js.done.includes(b.id) ? ['','✔️','Klart før'] : ['missing','⬜','Ikke klart ennå'];
  const list = onlyMissing => P.temaer.map(t => {
    const bs = BEGREPER.filter(b => b.t === t.id && (!onlyMissing || !js.done.includes(b.id) || c.wrong.has(b.id)));
    return bs.length ? `<h2 class="sec">${t.e} ${esc(t.navn)}</h2><div class="glist">${bs.map(b => { const [cls, mk, txt] = status(b);
      return `<div class="jrow ${cls}"><span class="mk2" title="${txt}">${mk}</span><div><b>${esc(cap(b.navn))}</b><small>${esc(b.fork)}</small></div></div>`; }).join('')}</div>` : '';
  }).join('');
  app.innerHTML = `<div class="card end">
      <div class="big">${r.full ? '🏆' : c.score >= J.mal ? '🎯' : J.e}</div>
      <h2>${c.score >= J.mal ? 'Målet er nådd!' : 'Tiden er ute!'}</h2>
      <div class="stat">${c.score} riktige på ${J.tid >= 120 ? J.tid/60 + ' minutter' : J.tid + ' sekunder'} · mål ${J.mal}</div>
      <div class="muted">Rekorden din: ${js.best}${r.rec && js.runder > 1 ? ' (ny rekord!)' : ''} · runde ${js.runder}</div>
      <div class="stat" style="color:var(--accent)">+${r.xp} XP</div>
      ${r.newM.map(m => `<div class="newmedal">${m.e} Ny medalje: ${m.name}</div>`).join('')}
    </div>
    ${js.full ? `<div class="fullpott" style="margin-top:14px">🏆 Full pott! Du har klart alle ${total} begrepene.</div>` : ''}
    <div class="card" style="margin-top:14px">
      <div style="font-weight:800;font-size:18px">Klart totalt: ${n} av ${total} begreper</div>
      <div class="bar" style="margin:8px 0"><div style="width:${100*n/total}%"></div></div>
      <div class="muted">${js.full ? 'Du kan starte jakten på nytt for å øve mer.' : `For full pott må du klare alle ${total}. Ta flere runder. De du ikke har klart, kommer først.`}</div>
      <div class="row"><button class="btn primary" id="again">Ny runde</button><button class="btn" id="home">Hjem</button>${js.full ? '<button class="btn ghost" id="reset">Start jakten på nytt</button>' : ''}</div>
    </div>
    <h2 class="sec">Begrepslista</h2>
    <div class="legend"><span>✅ Riktig nå</span><span>❌ Feil nå</span><span>✔️ Klart før</span><span>⬜ Ikke klart ennå</span></div>
    <label class="toggle"><input type="checkbox" id="onlymiss"> Vis bare de jeg mangler eller hadde feil</label>
    <div id="jlist">${list(false)}</div>`;
  $('#onlymiss').onchange = e => { $('#jlist').innerHTML = list(e.target.checked); };
  $('#again').onclick = () => startChallenge(c.mode); $('#home').onclick = renderHome;
  if($('#reset')) $('#reset').onclick = () => { if(confirm('Starte jakten på nytt? Medaljen beholder du.')){ js.done = []; js.full = false; save(); startChallenge(c.mode); } };
  window.scrollTo(0,0);
}

/* =====================================================================
   FORSIDE
   ===================================================================== */
function topicIds(t){
  return [...BEGREPER, ...P.forklar, ...P.kortsvar, ...P.fullfor, ...P.brukord, ...P.fyllinn, ...P.rekkefolge, ...P.sorter, ...P.hvorfor, ...SANT, ...P.likninger, ...P.figurer].filter(x => x.t === t).map(x => x.id);
}
function mastery(t){ const ids = topicIds(t); return ids.length ? Math.round(100 * ids.filter(id => st(id).s >= 1).length / ids.length) : 0; }
function renderHome(){
  stopChallenge();
  const L = levelInfo(), d = daysToTest(), streak = streakNow();
  const countdown = d > 1 ? `⏳ ${d} dager til prøven` : d === 1 ? '⏳ Prøven er i morgen!' : d === 0 ? '🍀 Prøven er i dag. Lykke til!' : '';
  app.innerHTML = `
    <header class="top">
      <div class="brand"><a class="icon" href="../" aria-label="Alle fag">←</a> 🔬 Naturfag</div>
      <button class="icon" id="snd" aria-label="Lyd av/på">${S.sound ? '🔊' : '🔇'}</button>
    </header>
    <section class="card hero">
      <div class="muted" style="font-weight:700">${esc(P.tittel)}</div>
      <div class="lvl"><span class="lvlnum">Nivå ${L.l}</span><span class="rank">${L.rank}</span></div>
      <div class="bar"><div style="width:${Math.min(100, 100*L.cur/L.need)}%"></div></div>
      <small class="muted">${S.xp} XP · ${L.need - L.cur} XP til neste nivå</small>
      <div class="pills">
        ${streak ? `<span class="pill hot">🔥 ${streak} ${streak === 1 ? 'dag' : 'dager'} på rad</span>` : '<span class="pill">🔥 Start en streak i dag!</span>'}
        ${countdown ? `<span class="pill">${countdown}</span>` : ''}
      </div>
    </section>

    <h2 class="sec">Spesialøkter</h2>
    <div class="grid">
      <button class="topic" data-topic="mix"><span class="em">🎲</span><b>Blandet</b><small>Litt av alt. Best rett før prøven!</small></button>
      <button class="topic" data-topic="skriv"><span class="em">✍️</span><b>Skrivetrening</b><small>Korte skriveoppgaver med fagbegreper</small></button>
      <button class="topic" data-topic="prove"><span class="em">📝</span><b>Prøvetrening</b><small>5 skriveoppgaver som på prøven, uten hint</small></button>
      <button class="topic" data-topic="kort"><span class="em">🔤</span><b>Begreper</b><small>Les forklaringen og skriv fagordet selv</small></button>
      ${Object.entries(JAKT).map(([m,J]) => { const js = jaktState(m); return `<button class="topic" data-jakt="${m}"><span class="em">${J.e}</span><b>${J.navn}</b>
        <small>${J.desc}. Mål: ${J.mal} på ${J.tid >= 120 ? J.tid/60 + ' min' : J.tid + ' sek'}${js.best ? ' · rekord ' + js.best : ''}</small>
        <div class="bar"><div style="width:${100*js.done.length/BEGREPER.length}%"></div></div><small>${js.full ? '🏆 Full pott!' : `${js.done.length} av ${BEGREPER.length} begreper klart`}</small></button>`; }).join('')}
      <button class="topic" id="glist"><span class="em">📒</span><b>Begrepslista</b><small>Se over alle fagbegrepene</small></button>
    </div>

    <h2 class="sec">Øv på tema</h2>
    <div class="grid">
      ${P.temaer.map(t => `<button class="topic" data-topic="${t.id}"><span class="em">${t.e}</span><b>${esc(t.navn)}</b><small>${esc(t.desc)}</small>${t.kilde ? `<small style="color:var(--near)">ℹ️ ${esc(t.kilde)}</small>` : ''}
        <div class="bar"><div style="width:${mastery(t.id)}%"></div></div><small>${mastery(t.id)} % øvd riktig</small></button>`).join('')}
    </div>

    <h2 class="sec">Medaljer (${S.medals.length}/${MEDALS.length})</h2>
    <div class="medals">${MEDALS.map(m => `<div class="medal ${S.medals.includes(m.id) ? '' : 'locked'}"><span class="e">${m.e}</span><span><b>${m.name}</b><span class="muted">${m.desc}</span></span></div>`).join('')}</div>
    <footer><button class="link" id="reset">Nullstill all fremgang i naturfag</button></footer>`;
  $('#snd').onclick = () => { S.sound = !S.sound; save(); renderHome(); };
  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => startSession(b.dataset.topic));
  app.querySelectorAll('[data-jakt]').forEach(b => b.onclick = () => startChallenge(b.dataset.jakt));
  $('#glist').onclick = renderGlossary;
  $('#reset').onclick = () => { if(confirm('Vil du slette all fremgang i naturfag?')){ S = JSON.parse(JSON.stringify(DEFAULT)); save(); renderHome(); } };
  window.scrollTo(0,0);
}
function renderGlossary(){
  app.innerHTML = `<div class="sbar"><button class="icon" id="back" aria-label="Tilbake">←</button><b style="font-size:20px">📒 Begrepslista</b></div>
    <p class="muted" style="margin-top:0">Alle fagbegrepene fra pensum. ✅ = du har svart riktig på dem i appen. 🔁 = øv mer.</p>
    ${P.temaer.map(t => { const bs = BEGREPER.filter(b => b.t === t.id); return bs.length ? `<h2 class="sec">${t.e} ${esc(t.navn)}</h2><div class="glist">${bs.map(b => {
      const x = st(b.id), y = st('sb-'+b.id), seen = x.n + y.n, good = x.s >= 1 || y.s >= 1;
      return `<div class="gitem"><span class="st">${seen ? (good ? '✅' : '🔁') : ''}</span><b>${esc(cap(b.navn))}</b><div class="muted">${esc(b.fork)}</div></div>`; }).join('')}</div>` : ''; }).join('')}
    <div class="row"><button class="btn primary" id="practice">✍️ Øv på begrepene</button></div>`;
  $('#back').onclick = renderHome; $('#practice').onclick = () => startSession('kort');
  window.scrollTo(0,0);
}
renderHome();
</script>
