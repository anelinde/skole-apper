<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mat og helse</title>
<style>
:root{
  --bg:#f0fdf4; --card:#ffffff; --ink:#172033; --muted:#5b6478; --line:#bbf7d0; --chip:#dcfce7;
  --brand:#15803d; --brand-ink:#ffffff; --accent:#ff8a3d;
  --ok:#14874a; --okbg:#e3f6ea; --bad:#c93a3a; --badbg:#fde9e9; --near:#b45309; --nearbg:#fff4e5;
  --shadow:0 2px 0 rgba(23,32,51,.07), 0 8px 24px rgba(23,32,51,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1626; --card:#18233a; --ink:#e8eefb; --muted:#9fb0cf; --line:#2b3b5c; --chip:#22304d;
    --brand:#4ade80; --brand-ink:#0b1220; --accent:#ff9b57;
    --ok:#46d68a; --okbg:#173a28; --bad:#ff7070; --badbg:#3d1d24; --near:#ffb35c; --nearbg:#3a2a14;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h1,h2,h3{line-height:1.2;margin:0}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--chip);color:var(--ink);min-height:48px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:20px;display:grid;place-items:center;flex:none;text-decoration:none;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px}
.pill{display:inline-block;background:var(--chip);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700}
.pill.hot{background:var(--accent);color:#fff}
.big{display:grid;gap:8px;text-align:left;padding:20px;border-radius:20px;border:2px solid var(--brand);background:var(--card);box-shadow:var(--shadow);width:100%}
.big .em{font-size:40px}
.big b{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:grid;gap:4px;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.tile:hover,.big:hover{border-color:var(--brand)}
.tile .em{font-size:26px}
.tile small{color:var(--muted)}
/* skriving */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps span{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
.steps span.now{background:var(--brand);color:var(--brand-ink)}
.steps span.done{background:var(--okbg);color:var(--ok)}
.claim{background:var(--chip);border-radius:12px;padding:8px 12px;font-weight:700;margin-bottom:10px}
.learn{border-left:4px solid var(--brand);background:var(--bg);border-radius:0 12px 12px 0;padding:10px 12px;margin:8px 0 12px;font-size:16px}
.learn b{display:block;margin-bottom:2px}
.learn .ex{font-style:italic;color:var(--muted);margin-top:4px}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.starters span{background:var(--chip);border-radius:99px;padding:4px 10px;font-size:14px;font-style:italic}
textarea,input.answer{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:170px;resize:vertical;line-height:1.55}
textarea:focus,input.answer:focus{outline:none;border-color:var(--brand)}
.guard{font-size:14px;color:var(--near);font-weight:700;margin-top:6px}
.guard:empty{display:none}
.coach{margin-top:10px;display:grid;gap:8px}
.coach .q{background:var(--nearbg);border-radius:12px;padding:10px 12px;font-weight:600}
.coach .q::before{content:'💬 '}
.coach .good{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:700}
.coach .info{color:var(--muted);font-size:14px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.types button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px;font-weight:700;font-size:15px;text-align:left}
.types button.sel{border-color:var(--brand);background:var(--chip)}
.planrow{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.planrow h3{font-size:16px;margin-bottom:6px}
.timer{font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.review .part{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.review .part h3{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.review .part p{white-space:pre-wrap;margin:6px 0}
.review .part.miss{border-color:var(--accent)}
.keys{list-style:none;padding:0;margin:8px 0;display:grid;gap:4px}
.keys li.ok{color:var(--ok);font-weight:700}
.spell .marked{background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.8;white-space:pre-wrap}
.spell mark{background:var(--badbg);color:inherit;border-bottom:3px solid var(--bad);border-radius:3px;padding:0 2px}
.spell ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.spell li{background:var(--bg);border-radius:12px;padding:10px 12px}
.sugg{border:2px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:10px;padding:2px 8px;font-weight:800;margin:4px 6px 0 0;display:inline-block}
.model{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:6px}
details{margin:8px 0}
summary{cursor:pointer;font-weight:700;color:var(--brand)}
.hl{margin-bottom:12px}
.hl h3{font-size:17px}
.conf{position:fixed;top:55vh;font-size:28px;pointer-events:none;z-index:10;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-50vh) scale(1.2) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.readtext{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:18px;line-height:1.7;white-space:pre-line;margin:8px 0}
.src{font-size:13px;color:var(--muted)}
.prog{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.prog>div{height:100%;background:var(--brand)}
.mine{background:var(--bg);border-radius:12px;padding:10px 12px;white-space:pre-wrap;margin-top:6px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 8px;background:var(--chip)}
.tag.ok{background:var(--okbg);color:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<script src="innhold.js"></script>
<script src="../../felles/stavekontroll.js"></script>
<script>
/* =====================================================================
   MAT OG HELSE – les og skriv (pensum = heftets spørsmål)
   Les en tekst → svar skriftlig på heftets spørsmål → få et hint om det
   som mangler → forbedre svaret → se et godt eksempel. Ingen quiz.
   ===================================================================== */
const K = window.FAG;
const DEL = Object.fromEntries(K.deler.map(d => [d.id, d]));
const TEKST = Object.fromEntries(K.tekster.map(t => [t.id, t]));
const KEY = K.lagringsnokkel;
const DEFAULT = {xp:0, stats:{}, sessions:0, lastDay:null, dayStreak:0, svar:{}, lest:{}};
let S = load();
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), JSON.parse(r));
    const old = JSON.parse(localStorage.getItem('mat_og_helse_v1') || 'null'); // ta med XP fra forrige versjon
    if(old) return Object.assign(JSON.parse(JSON.stringify(DEFAULT)), {xp:old.xp||0, sessions:old.sessions||0, lastDay:old.lastDay||null, dayStreak:old.dayStreak||0});
  }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function record(id, ok){ const x = S.stats[id] || {s:0, n:0}; x.n++; if(ok) x.s++; S.stats[id] = x; }
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function dayKey(d = new Date()){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function markDay(){ const t = dayKey(); if(S.lastDay === t) return; const y = new Date(); y.setDate(y.getDate()-1); S.dayStreak = S.lastDay === dayKey(y) ? S.dayStreak+1 : 1; S.lastDay = t; }
function daysToTest(){ const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(K.provedato + 'T00:00:00') - t)/864e5); }
const words = t => t.trim().split(/\s+/).filter(Boolean).length;

/* ---------- Han skriver selv ---------- */
const WRITE_ATTR = 'autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"';
function guardInput(inp, msgEl){
  inp.addEventListener('beforeinput', e => { const t = e.inputType || '';
    if(/^insertFrom(Paste|Drop|Yank)/.test(t) || (e.data && e.data.length > 25)){ e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Skriv selv. På prøven skriver du for hånd!'; } });
  inp.addEventListener('paste', e => { e.preventDefault(); if(msgEl) msgEl.textContent = '✍️ Innliming er skrudd av. Skriv selv!'; });
}

/* ---------- Finner han de viktige punktene? ---------- */
function osa(a, b){ const d = Array.from({length:a.length+1}, (_,i) => [i, ...Array(b.length).fill(0)]); for(let j=1;j<=b.length;j++) d[0][j] = j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){ d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if(i>1 && j>1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1); } return d[a.length][b.length]; }
const wordsOf = t => t.toLowerCase().replace(/[^\p{L}\p{N} -]+/gu,' ').split(/\s+/).filter(Boolean);
function hasStem(t, ws, stem){ stem = stem.toLowerCase(); const tl = t.toLowerCase();
  if(/^\d+$/.test(stem)) return new RegExp('(^|[^\\d])' + stem + '([^\\d]|$)').test(tl);
  if(stem.length < 4) return ws.some(w => w === stem || w.startsWith(stem));
  if(tl.includes(stem)) return true;
  if(stem.length >= 6) return ws.some(w => w.length >= stem.length-1 && osa(w.slice(0, stem.length), stem) <= 1);
  return false; }
function punkter(q, text){ const ws = wordsOf(text); return q.begreper.map(([navn, ...stems]) => ({navn, ok: stems.some(s => hasStem(text, ws, s))})); }
const BEGRUNN = ['fordi','siden','ettersom','derfor','på grunn av','grunnen','for det','det gjør at','det fører til'];

/* ---------- Stavekontroll ---------- */
const STAVE_EKSTRA = [...new Set([...K.fagord, ...K.tekster.flatMap(t => t.tekst.split(/[^\p{L}-]+/u)), ...K.sporsmal.flatMap(q => ((q.modell || '') + ' ' + q.spm).split(/[^\p{L}-]+/u))].map(w => w.toLowerCase()).filter(w => w.length > 1))];
async function staveBoks(text, box){
  if(!box || !text.trim()) return;
  box.innerHTML = '<p class="muted">🔍 Sjekker stavingen …</p>';
  let sk; try{ sk = await Stavekontroll.last('../../felles/'); }catch(e){ box.innerHTML = '<p class="muted">Fikk ikke lastet stavekontrollen (er du på nett?).</p>'; return; }
  if(!box.isConnected) return;
  const feil = sk.sjekk(text, STAVE_EKSTRA);
  if(!feil.length){ box.innerHTML = '<p style="color:var(--ok);font-weight:700;margin:6px 0">✅ Ingen stavefeil.</p>'; return; }
  let html = '', pos = 0;
  feil.forEach(f => { html += esc(text.slice(pos, f.offset)) + `<mark>${esc(text.substr(f.offset, f.length))}</mark>`; pos = f.offset + f.length; });
  html += esc(text.slice(pos));
  box.innerHTML = `<div class="spell"><b>🔍 ${feil.length} mulig${feil.length > 1 ? 'e' : ''} stavefeil</b><div class="marked">${html}</div>
    <ul>${feil.map(f => `<li><b style="color:var(--bad)">${esc(f.ord)}</b> · ${esc(f.grunn)}${f.forslag.length ? '<br>Forslag: ' + f.forslag.map(r => `<span class="sugg">${esc(r)}</span>`).join('') : ''}</li>`).join('')}</ul></div>`;
}

/* =====================================================================
   ETT SPØRSMÅL: skriv → hint → forbedre → eksempel
   ===================================================================== */
function sporsmal(el, q, opts){
  // opts: {visTekst: bool (teksten kan åpnes), ferdig: fn()}
  const T = TEKST[q.tekst]; let forsok = 0;
  el.innerHTML = `<div class="q-label" style="color:var(--muted);font-weight:600">${DEL[q.del].e} ${esc(DEL[q.del].navn)}${q.mening ? ' · din mening' : ''}</div>
    <h3 style="margin:6px 0 10px;font-size:20px">${esc(q.spm)}</h3>
    ${q.mening ? '<div class="learn"><b>Heftet: «Begrunn svarene og gi din egen mening.»</b>Det finnes ikke ett riktig svar. Si hva du mener, og forklar hvorfor. Bruk gjerne noe du har lest.</div>' : ''}
    <details ${opts.visTekst ? '' : ''}><summary>📖 ${opts.visTekst ? 'Se i teksten' : 'Les teksten igjen'}: ${esc(T.tittel)}</summary><div class="readtext">${esc(T.tekst)}</div></details>
    <textarea id="txt" ${WRITE_ATTR} style="min-height:130px" placeholder="Skriv svaret ditt med egne ord …">${esc((S.svar[q.id] || {}).tekst || '')}</textarea><div class="guard"></div>
    <div class="coach" id="cc"></div><div id="stave"></div>
    <div class="row"><span style="flex:1"></span><button class="btn primary" id="sj">Sjekk svaret</button></div>`;
  const ta = $('#txt'); guardInput(ta, el.querySelector('.guard')); ta.focus();
  const ferdig = (ok, vis) => {
    S.svar[q.id] = {tekst: ta.value.trim(), ok, dato: dayKey()}; record(q.id, ok); S.xp += ok ? 10 : 4; markDay(); save();
    $('#cc').innerHTML = vis;
    $('#sj').textContent = 'Videre ➜'; $('#sj').onclick = opts.ferdig;
    staveBoks(ta.value, $('#stave'));
  };
  $('#sj').onclick = () => {
    const text = ta.value.trim(); if(words(text) < 3){ ta.focus(); return; }
    forsok++;
    if(q.mening){
      const begr = BEGRUNN.some(b => (' ' + text.toLowerCase() + ' ').includes(' ' + b)), lang = words(text) >= 15;
      if((!begr || !lang) && forsok === 1){ $('#cc').innerHTML = `<div class="q">${!begr ? 'Husk å begrunne: hvorfor mener du det? Bruk «fordi» eller «derfor».' : 'Skriv litt mer: gi et eksempel eller bruk noe fra teksten.'}</div>`; return; }
      return ferdig(begr && lang, `<div class="good">✅ ${begr && lang ? 'Du sier hva du mener og begrunner det. Bra!' : 'Fint! Neste gang: begrunn med «fordi».'}</div>`);
    }
    const res = punkter(q, text), har = res.filter(r => r.ok), mangler = res.filter(r => !r.ok), ok = har.length >= q.min;
    const harTxt = har.length ? `<div class="info">Du har med: ${har.map(r => esc(r.navn)).join(' · ')}</div>` : '';
    if(!ok && forsok === 1){
      $('#cc').innerHTML = harTxt + `<div class="q">Nesten! Teksten sier også noe om <b>${esc(mangler[0].navn.split(/[\/(]/)[0].trim())}</b>${mangler.length > 1 ? ` (og ${mangler.length - 1} ting til)` : ''}. Les i teksten og legg det til i svaret ditt.</div>`;
      el.querySelector('details').open = true; $('#sj').textContent = 'Sjekk igjen'; return;
    }
    ferdig(ok, harTxt + (ok ? `<div class="good">✅ Godt svar!</div>` : `<div class="q">Bra forsøk. Sammenlign med eksempelet under, og se hva du kan ta med neste gang.</div>`)
      + `<div class="learn" style="margin-top:6px"><b>Eksempel på et godt svar</b>${esc(q.modell)}</div>`);
  };
}

/* =====================================================================
   LES EN TEKST → SVAR PÅ SPØRSMÅLENE TIL DEN
   ===================================================================== */
function lesTekst(tid){
  const T = TEKST[tid], qs = K.sporsmal.filter(q => q.tekst === tid), wait = Math.min(45, Math.max(20, Math.round(words(T.tekst)/7)));
  app.innerHTML = `<div class="top"><button class="icon" id="back" aria-label="Tilbake">✕</button><span class="muted">${DEL[T.del].e} ${esc(DEL[T.del].navn)}</span></div>
    <div class="card"><h2 style="font-size:22px">${esc(T.tittel)}</h2><div class="src">Bygger på: ${esc(T.kilde)} (skrevet med egne ord)</div>
      <div class="readtext">${esc(T.tekst)}</div>
      <div class="learn"><b>Les nøye.</b>Etterpå skal du svare skriftlig på ${qs.length} spørsmål fra heftet. Du kan se i teksten mens du svarer.</div>
      <div class="row"><span style="flex:1"></span><button class="btn primary" id="go" disabled>Jeg har lest ✓ <span id="rc">(${wait})</span></button></div></div>`;
  $('#back').onclick = () => renderDel(T.del);
  let c = wait; const iv = setInterval(() => { const rc = $('#rc'); if(!rc) return clearInterval(iv); c--; rc.textContent = c > 0 ? `(${c})` : ''; if(c <= 0){ clearInterval(iv); $('#go').disabled = false; } }, 1000);
  $('#go').onclick = () => { S.lest[tid] = dayKey(); save(); kjede(qs, 0, () => renderDel(T.del), true); };
  window.scrollTo(0,0);
}
function kjede(qs, i, slutt, visTekst){
  if(i >= qs.length){ S.sessions++; save(); return slutt(); }
  app.innerHTML = `<div class="top"><button class="icon" id="back" aria-label="Tilbake">✕</button><span class="muted">Spørsmål ${i+1} av ${qs.length}</span></div>
    <div class="prog" style="margin-bottom:12px"><div style="width:${100*i/qs.length}%"></div></div><div class="card" id="task"></div>`;
  $('#back').onclick = slutt;
  sporsmal($('#task'), qs[i], {visTekst, ferdig: () => kjede(qs, i+1, slutt, visTekst)});
  window.scrollTo(0,0);
}

/* ---------- Test deg selv: spørsmål uten tekst, etter at han har lest ---------- */
function testDeg(){
  const lest = K.sporsmal.filter(q => !q.mening && S.lest[q.tekst]);
  const pool = lest.length >= 4 ? lest : K.sporsmal.filter(q => !q.mening);
  const qs = shuffle(pool).sort((a,b) => ((S.svar[a.id]||{}).ok ? 1 : 0) - ((S.svar[b.id]||{}).ok ? 1 : 0)).slice(0, 5);
  kjede(qs, 0, renderHome, false);
}

/* =====================================================================
   FORSIDE OG DELER
   ===================================================================== */
function delStatus(did){ const qs = K.sporsmal.filter(q => q.del === did && !q.mening), ok = qs.filter(q => (S.svar[q.id]||{}).ok).length; return {ok, n:qs.length}; }
function renderDel(did){
  const D = DEL[did], tekster = K.tekster.filter(t => t.del === did);
  app.innerHTML = `<div class="top"><button class="icon" id="back" aria-label="Tilbake">←</button><b style="font-size:20px">${D.e} ${esc(D.navn)}</b><span></span></div>
    <p class="muted" style="margin:0 0 12px">Velg en tekst. Les den, og svar på spørsmålene fra heftet.</p>
    ${tekster.map(t => { const qs = K.sporsmal.filter(q => q.tekst === t.id), ok = qs.filter(q => (S.svar[q.id]||{}).ok).length;
      return `<button class="big" data-t="${t.id}" style="margin-bottom:10px;border-width:1px"><b>📖 ${esc(t.tittel)}</b><span class="muted">${qs.length} spørsmål · ${ok} besvart godt${S.lest[t.id] ? ' · lest ✅' : ''}</span>
        <div class="prog"><div style="width:${qs.length ? 100*ok/qs.length : 0}%"></div></div></button>`; }).join('')}
    ${(() => { const qs = K.sporsmal.filter(q => q.del === did && S.svar[q.id]); return qs.length ? `<h2 class="sec">Svarene dine</h2>${qs.map(q => `<details class="card" style="margin-bottom:8px"><summary>${esc(q.spm)} <span class="tag ${S.svar[q.id].ok ? 'ok' : ''}">${S.svar[q.id].ok ? 'godt svar' : 'kan forbedres'}</span></summary><div class="mine">${esc(S.svar[q.id].tekst)}</div>${q.modell ? `<div class="learn" style="margin-top:8px"><b>Eksempel</b>${esc(q.modell)}</div>` : ''}</details>`).join('')}` : ''; })()}`;
  $('#back').onclick = renderHome;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => lesTekst(b.dataset.t));
  window.scrollTo(0,0);
}
function renderHome(){
  const d = daysToTest(), cd = d > 1 ? `⏳ ${d} dager til prøven` : d === 1 ? '⏳ Prøven er i morgen!' : d === 0 ? '🍀 Prøven er i dag!' : '';
  const tot = K.sporsmal.filter(q => !q.mening), ok = tot.filter(q => (S.svar[q.id]||{}).ok).length;
  app.innerHTML = `<header class="top"><div class="brand"><a class="icon" href="../" aria-label="Tilbake til faget">←</a> 🍎 Mat og helse</div>${cd ? `<span class="pill hot">${cd}</span>` : ''}</header>
    <p class="muted" style="margin:0 0 6px">Teoriprøve · spørsmålene fra heftet · ⭐ ${S.xp} XP</p>
    <div class="card" style="margin-bottom:14px"><b>Slik øver du:</b> Les en tekst → svar med egne ord → få et hint og forbedre svaret → se et godt eksempel.
      <div class="prog"><div style="width:${100*ok/tot.length}%"></div></div><small class="muted">${ok} av ${tot.length} faktaspørsmål besvart godt</small></div>
    <div class="grid">${K.deler.map(D => { const s = delStatus(D.id); return `<button class="tile" data-d="${D.id}"><span class="em">${D.e}</span><b>${esc(D.navn)}</b><small>${s.ok} av ${s.n} besvart godt</small><div class="prog"><div style="width:${100*s.ok/s.n}%"></div></div></button>`; }).join('')}</div>
    <h2 class="sec">Når du har lest</h2>
    <button class="big" id="test" style="border-width:1px"><b>🧠 Test deg selv</b><span class="muted">5 spørsmål fra tekstene du har lest, uten å se i teksten først. Det du ikke kunne, kommer først.</span></button>`;
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => renderDel(b.dataset.d));
  $('#test').onclick = testDeg;
  window.scrollTo(0,0);
}
renderHome();
</script>
</body>
</html>
