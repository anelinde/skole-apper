<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRLE</title>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --ink:#1f1b3a; --muted:#6b6790; --line:#e4e0f5; --chip:#efeafe;
  --brand:#6c4cf1; --accent:#ff8a3d; --ok:#14874a; --okbg:#e3f6ea;
  --shadow:0 2px 0 rgba(31,27,58,.08), 0 8px 24px rgba(31,27,58,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14122a; --card:#1f1c3b; --ink:#f1efff; --muted:#a8a3cc; --line:#34305a; --chip:#2c2852;
    --brand:#8f74ff; --accent:#ff9b57; --ok:#46d68a; --okbg:#173a28;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{display:grid;gap:6px;align-content:start;padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);color:inherit;text-decoration:none;text-align:left;font:inherit;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card .em{font-size:40px;line-height:1}
.card b{font-size:20px}
.card small{color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--chip);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:700}
.tag.soon{background:var(--accent);color:#fff}
.tag.xp{background:var(--okbg);color:var(--ok)}
.next{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--card);border:2px solid var(--accent);box-shadow:var(--shadow);color:inherit;text-decoration:none;margin-bottom:10px}
.next .em{font-size:32px}
.next b{display:block}
.next small{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;margin-bottom:14px;text-decoration:none}
.subj{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.subj .em{font-size:44px}
details{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
summary{cursor:pointer;font-weight:800;font-size:17px}
details .grid{margin-top:12px}
.old{opacity:.85}
.empty{color:var(--muted)}
.week{margin-bottom:14px}
.week .wk{font-weight:800;margin:4px 0 8px}
.week.cur .wk{color:var(--accent)}
.sum{display:flex;flex-wrap:wrap;gap:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.tlist{display:grid;gap:8px}
.trow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:inherit;text-decoration:none}
.trow:hover{border-color:var(--brand)}
.trow .em{font-size:26px}
.trow .tn{flex:1;min-width:0}
.trow .tn b{display:block}
.trow small{color:var(--muted);font-size:13px;display:block}
.trow .tv{text-align:right;font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<main id="app"></main>
<script src="../fag.js"></script>
<script>renderFag('krle');</script>
</body>
</html>
